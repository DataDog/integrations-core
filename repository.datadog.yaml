# https://datadoghq.atlassian.net/wiki/spaces/DEVX/pages/3176367142/Cleanup+Stale+Branches
schema-version: v1
kind: stale-branches
max_age: 4380h # 6 months
# Aligned with DataDog/datadog-agent (repository.datadog.yml): the default branch,
# release branches, the documentation branch and branches explicitly marked as
# do-not-delete are never cleaned up.
excludes:
  - ^master$
  - ^[0-9]+\.[0-9]+\.x$
  - ^gh-pages$
  - ^.*DO-NOT-DELETE$
---
schema-version: v1
kind: mergequeue
enable: false
---
schema-version: v1
kind: mergegate
rules:
  - require: commit-signatures
    excluded_emails:
      - '41898282+github-actions[bot]@users.noreply.github.com'
      - '159767151+datadog-agent-integrations-bot[bot]@users.noreply.github.com'
      - 'packages@datadoghq.com'
    allow_unsigned_external: true
