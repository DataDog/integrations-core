[build-system]
requires = ["hatchling>=0.11.2"]
build-backend = "hatchling.build"

[project]
name = "datadog-hmc"
description = "The HMC check"
readme = "README.md"
keywords = [
    "datadog",
    "datadog agent",
    "datadog check",
    "hmc",
    "ibm",
    "powervm",
]
authors = [{ name = "Datadog", email = "packages@datadoghq.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Private :: Do Not Upload",
]
dependencies = ["datadog-checks-base"]
dynamic = ["version"]
license = "BSD-3-Clause"

[project.optional-dependencies]
deps = ["paramiko==5.0.0"]

[project.urls]
Source = "https://github.com/DataDog/integrations-core"

[tool.hatch.version]
path = "datadog_checks/hmc/__about__.py"

[tool.hatch.build.targets.sdist]
include = ["/datadog_checks", "/tests"]

[tool.hatch.build.targets.wheel]
include = ["/datadog_checks/hmc"]
dev-mode-dirs = ["."]
