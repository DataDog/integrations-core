services:
  teleport-service:
    build:
      context: .
      args:
        TELEPORT_VERSION: ${TELEPORT_VERSION:-17.2.9}
    # Autodiscovery matches the image short name against the ad_identifiers in auto_conf.yaml.
    image: teleport-distroless:${TELEPORT_VERSION:-17.2.9}
    pull_policy: build
    ports:
      - 3000:3000
    volumes:
      - ./etc/teleport:/etc/teleport
    command: --diag-addr=0.0.0.0:3000
    container_name: teleport-service
