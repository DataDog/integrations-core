    name: Message
    path: ocsf.message
    source: log
  - groups:
      - OCSF
    name: Event Code
    path: ocsf.metadata.event_code
    source: log
  - groups:
      - OCSF
    name: Product Name
    path: ocsf.metadata.product.name
    source: log
  - groups:
      - OCSF
    name: Vendor Name
    path: ocsf.metadata.product.vendor_name
    source: log
  - groups:
      - OCSF
    name: Metadata Event UID
    path: ocsf.metadata.uid
    source: log
  - groups:
      - OCSF
    name: Policy Unique ID
    path: ocsf.policy.uid
    source: log
  - facetType: range
    groups:
      - OCSF
    name: Event Time
    path: ocsf.time
    source: log
