# bypass-global-no-service-config-checks
id: kandji
metric_id: kandji
backend_only: false
facets:
  - groups:
      - User
    name: User Name
    path: usr.name
    source: log
  - groups:
      - User
    name: User Email
    path: usr.email
    source: log
  - groups:
      - Event
    name: Event Outcome
    path: evt.outcome
    source: log
  - groups:
      - User
    name: User ID
    path: usr.id
    source: log
  - groups:
      - OCSF
    name: Activity ID
    path: ocsf.activity_id
    source: log
    type: integer
  - groups:
      - OCSF
    name: Activity Name
    path: ocsf.activity_name
    source: log
  - groups:
      - OCSF
    name: Category
    path: ocsf.category_name
    source: log
  - groups:
      - OCSF
    name: Category ID
    path: ocsf.category_uid
    source: log
    type: integer
  - groups:
      - OCSF
    name: Class
    path: ocsf.class_name
    source: log
  - groups:
      - OCSF
    name: Class ID
    path: ocsf.class_uid
    source: log
    type: integer
  - groups:
      - OCSF
    name: Type ID
    path: ocsf.type_uid
    source: log
    type: integer
  - groups:
      - OCSF
    name: Severity
    path: ocsf.severity
    source: log
  - groups:
      - OCSF
    name: Severity ID
    path: ocsf.severity_id
    source: log
    type: integer
  - groups:
      - OCSF
    name: Status
    path: ocsf.status
    source: log
  - groups:
      - OCSF
    name: Status ID
    path: ocsf.status_id
    source: log
    type: integer
  - groups:
      - OCSF
    name: Unique ID
    path: ocsf.actor.user.uid
    source: log
  - groups:
      - OCSF
    name: Compliance Control
    path: ocsf.compliance.control
    source: log
  - groups:
      - OCSF
    name: Compliance Standards
    path: ocsf.compliance.standards
    source: log
  - groups:
      - OCSF
    name: Device Hostname
    path: ocsf.device.hostname
    source: log
  - groups:
      - OCSF
    name: Device Hardware Info Serial Number
    path: ocsf.device.hw_info.serial_number
    source: log
  - groups:
      - OCSF
    name: Device Model
    path: ocsf.device.model
    source: log
  - groups:
      - OCSF
    name: Device Name
    path: ocsf.device.name
    source: log
  - groups:
      - OCSF
    name: Device OS Name
    path: ocsf.device.os.name
    source: log
  - groups:
      - OCSF
    name: Device OS Version
    path: ocsf.device.os.version
    source: log
  - groups:
      - OCSF
    name: Device Unique ID
    path: ocsf.device.uid
    source: log
  - groups:
      - OCSF
    name: Entity Name
    path: ocsf.entity.name
    source: log
  - groups:
      - OCSF
    name: Entity Unique ID
    path: ocsf.entity.uid
    source: log
  - groups:
      - OCSF
    name: Finding Information Description
    path: ocsf.finding_info.desc
    source: log
  - groups:
      - OCSF
    name: Finding Information Source URL
    path: ocsf.finding_info.src_url
    source: log
  - groups:
      - OCSF
    name: Finding Info Title
    path: ocsf.finding_info.title
    source: log
  - groups:
      - OCSF
    name: Finding Info Unique ID
    path: ocsf.finding_info.uid
    source: log
  - groups:
      - OCSF
    name: Malware Name
    path: ocsf.malware.name
    source: log
  - groups:
      - OCSF
    name: Malware Unique ID
    path: ocsf.malware.uid
    source: log
  - groups:
      - OCSF
    name: Message
    path: ocsf.message
    source: log
  - groups:
      - OCSF
    name: Event Code
    path: ocsf.metadata.event_code
    source: log
  - groups:
      - OCSF
    name: Product Name
    path: ocsf.metadata.product.name
    source: log
  - groups:
      - OCSF
    name: Vendor Name
    path: ocsf.metadata.product.vendor_name
    source: log
  - groups:
      - OCSF
    name: Metadata Event UID
    path: ocsf.metadata.uid
    source: log
  - facetType: range
    groups:
      - OCSF
    name: Event Time
    path: ocsf.time
    source: log
    type: integer
  - groups:
      - OCSF
    name: Target Email Address
    path: ocsf.user.email_addr
    source: log
  - groups:
      - OCSF
    name: Target Name
    path: ocsf.user.name
    source: log
  - groups:
      - OCSF
    name: User Type
    path: ocsf.user.type
    source: log
  - groups:
      - OCSF
    name: Target Unique ID
    path: ocsf.user.uid
    source: log
pipeline:
  type: pipeline
  name: Kandji
  enabled: true
  filter:
    query: source:kandji
  processors:
    - type: date-remapper
      name: Define `detection_datetime,occurred_at` as the official date of the log
      enabled: true
      sources:
        - detection_datetime
        - occurred_at
    - type: pipeline
      name: Parse Audit Logs with Admin Activities
      enabled: true
      filter:
        query: service:audit @target_type:admin
      processors:
        - type: string-builder-processor
          name: Prepare `fullName` string for user
          enabled: true
          template: "%{new_state.first_name} %{new_state.last_name}"
          target: usr.name
          replaceMissing: true
        - type: attribute-remapper
          name: Map `new_state.email` to `usr.email`
          enabled: true
          sources:
            - new_state.email
          sourceType: attribute
          target: usr.email
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
    - type: pipeline
      name: Parse Audit Logs with File Detection
      enabled: true
      filter:
        query: service:audit @target_type:file_detection
      processors:
        - type: attribute-remapper
          name: Map `new_state.event.outcome` to `evt.outcome`
          enabled: true
          sources:
            - new_state.event.outcome
          sourceType: attribute
          target: evt.outcome
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `new_state.user.name` to `usr.name`
          enabled: true
          sources:
            - new_state.user.name
          sourceType: attribute
          target: usr.name
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `new_state.user.id` to `usr.id`
          enabled: true
          sources:
            - new_state.user.id
          sourceType: attribute
          target: usr.id
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `new_state.file.name` to `file_name`
          enabled: true
          sources:
            - new_state.file.name
          sourceType: attribute
          target: file_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `metadata.device.name` to `device_name`
          enabled: true
          sources:
            - metadata.device.name
          sourceType: attribute
          target: device_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
    - type: pipeline
      name: Parse Audit Logs with Device Details
      enabled: true
      filter:
        query: service:audit @target_type:device
      processors:
        - type: attribute-remapper
          name: Map `new_state.blueprint.name` to `blueprint_name`
          enabled: true
          sources:
            - new_state.blueprint.name
          sourceType: attribute
          target: blueprint_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `new_state.device.name` to `device_name`
          enabled: true
          sources:
            - new_state.device.name
          sourceType: attribute
          target: device_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
    - type: pipeline
      name: Parse Audit Logs with Vulnerability
      enabled: true
      filter:
        query: service:audit @target_type:vulnerability
      processors:
        - type: attribute-remapper
          name: Map `new_state.vulnerability.id` to `cve_id`
          enabled: true
          sources:
            - new_state.vulnerability.id
          sourceType: attribute
          target: cve_id
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `new_state.host.name` to `device_name`
          enabled: true
          sources:
            - new_state.host.name
          sourceType: attribute
          target: device_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `new_state.file.name` to `file_name`
          enabled: true
          sources:
            - new_state.file.name
          sourceType: attribute
          target: file_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - name: Lookup on `new_state.vulnerability.severity` to `detection_severity`
          enabled: true
          source: new_state.vulnerability.severity
          target: detection_severity
          lookupTable: |-
            Critical,critical
            High,warning
            Medium,warning
            Low,info
            Undefined,info
          type: lookup-processor
        - type: status-remapper
          name: Define `detection_severity` as the official status of the log
          enabled: true
          sources:
            - detection_severity
    - type: pipeline
      name: Parse Audit Logs with Blueprint
      enabled: true
      filter:
        query: service:audit @target_type:blueprint
      processors:
        - type: attribute-remapper
          name: Map `new_state.name` to `blueprint_name`
          enabled: true
          sources:
            - new_state.name
          sourceType: attribute
          target: blueprint_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
    - type: pipeline
      name: Parse Detection Logs
      enabled: true
      filter:
        query: service:detection
      processors:
        - type: message-remapper
          name: Define `description` as the official message of the log
          enabled: true
          sources:
            - description
        - name: Lookup on `severity` to `detection_severity`
          enabled: true
          source: severity
          target: detection_severity
          lookupTable: |-
            Critical,critical
            High,warning
            Medium,warning
            Low,info
            Undefined,info
          type: lookup-processor
        - type: status-remapper
          name: Define `detection_severity` as the official status of the log
          enabled: true
          sources:
            - detection_severity
        - type: attribute-remapper
          name: Map `name` to `file_name`
          enabled: true
          sources:
            - name
          sourceType: attribute
          target: file_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false

    - type: pipeline
      name: OCSF pre transformations
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "*"
      processors:
        - type: string-builder-processor
          name: Add product name
          enabled: true
          template: "Kandji"
          target: ocsf.metadata.product.name
          replaceMissing: false
        - type: string-builder-processor
          name: Add product vendor
          enabled: true
          template: "Kandji"
          target: ocsf.metadata.product.vendor_name
          replaceMissing: false
    - type: pipeline
      name: OCSF sub pipeline for class Vulnerability Finding [2002] (Audit)
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "service:audit @target_type:vulnerability"
      processors:
        - type: grok-parser
          name: Parse `occurred_at` to `ocsf.time`
          enabled: true
          source: occurred_at
          samples:
            - "2025-09-09T07:47:49.172851Z"
          grok:
            supportRules: ""
            matchRules: "iso_to_ms %{date(\"yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ\"):ocsf.time}"
        - type: attribute-remapper
          name: Map `new_state.vulnerability.id` to `vuln_stage.cve.uid`
          enabled: true
          sources:
            - new_state.vulnerability.id
          sourceType: attribute
          target: vuln_stage.cve.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `new_state.vulnerability.description` to `vuln_stage.cve.desc`
          enabled: true
          sources:
            - new_state.vulnerability.description
          sourceType: attribute
          target: vuln_stage.cve.desc
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `new_state.vulnerability.description` to `vuln_stage.desc`
          enabled: true
          sources:
            - new_state.vulnerability.description
          sourceType: attribute
          target: vuln_stage.desc
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `new_state.vulnerability.severity` to `vuln_stage.severity`
          enabled: true
          sources:
            - new_state.vulnerability.severity
          sourceType: attribute
          target: vuln_stage.severity
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `new_state.vulnerability.scanner.vendor` to `vuln_stage.vendor_name`
          enabled: true
          sources:
            - new_state.vulnerability.scanner.vendor
          sourceType: attribute
          target: vuln_stage.vendor_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: array-processor
          name: Move attributes into vulnerabilities array
          enabled: true
          operation:
            source: vuln_stage
            target: ocsf.vulnerabilities
            preserveSource: false
            type: append
        - type: string-builder-processor
          name: Add finding title
          enabled: true
          template: "%{cve_id} in %{file_name}"
          target: finding_title
          replaceMissing: false
        - type: schema-processor
          name: Apply OCSF schema for 2002
          enabled: true
          mappers:
            - type: schema-remapper
              name: Map `ocsf.metadata.product.name` to `ocsf.metadata.product.name`
              sources:
                - ocsf.metadata.product.name
              target: ocsf.metadata.product.name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.product.vendor_name` to `ocsf.metadata.product.vendor_name`
              sources:
                - ocsf.metadata.product.vendor_name
              target: ocsf.metadata.product.vendor_name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.time` to `ocsf.time`
              sources:
                - ocsf.time
              target: ocsf.time
              preserveSource: true
              overrideOnConflict: true
              targetFormat: integer
            - type: schema-remapper
              name: Map `ocsf.vulnerabilities` to `ocsf.vulnerabilities`
              sources:
                - ocsf.vulnerabilities
              target: ocsf.vulnerabilities
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `id` to `ocsf.metadata.uid`
              sources:
                - id
              target: ocsf.metadata.uid
              preserveSource: true
              overrideOnConflict: false
              targetFormat: string
            - type: schema-remapper
              name: Map `target_id` to `ocsf.finding_info.uid`
              sources:
                - target_id
              target: ocsf.finding_info.uid
              preserveSource: true
              overrideOnConflict: false
              targetFormat: string
            - type: schema-remapper
              name: Map `finding_title` to `ocsf.finding_info.title`
              sources:
                - finding_title
              target: ocsf.finding_info.title
              preserveSource: false
              overrideOnConflict: false
            - type: schema-remapper
              name: Map `new_state.vulnerability.description` to `ocsf.finding_info.desc`
              sources:
                - new_state.vulnerability.description
              target: ocsf.finding_info.desc
              preserveSource: true
              overrideOnConflict: false
            - type: schema-remapper
              name: Map `device_name` to `ocsf.device.name`
              sources:
                - device_name
              target: ocsf.device.name
              preserveSource: true
              overrideOnConflict: false
            - type: schema-remapper
              name: Map `new_state.device.id` to `ocsf.device.uid`
              sources:
                - new_state.device.id
              target: ocsf.device.uid
              preserveSource: true
              overrideOnConflict: false
            - type: schema-remapper
              name: Map `new_state.host.os.name` to `ocsf.device.os.name`
              sources:
                - new_state.host.os.name
              target: ocsf.device.os.name
              preserveSource: true
              overrideOnConflict: false
            - type: schema-remapper
              name: Map `new_state.host.os.version` to `ocsf.device.os.version`
              sources:
                - new_state.host.os.version
              target: ocsf.device.os.version
              preserveSource: true
              overrideOnConflict: false
            - name: ocsf.device.type_id
              categories:
                - filter:
                    query: "*"
                  name: Unknown
                  id: 0
              targets:
                name: ocsf.device.type
                id: ocsf.device.type_id
              type: schema-category-mapper
            - name: ocsf.device.os.type_id
              categories:
                - filter:
                    query: "@new_state.host.os.name:*"
                  name: macOS
                  id: 300
                - filter:
                    query: "*"
                  name: Unknown
                  id: 0
              targets:
                name: ocsf.device.os.type
                id: ocsf.device.os.type_id
              type: schema-category-mapper
            - name: ocsf.activity_id
              categories:
                - filter:
                    query: "@action:detect"
                  name: Create
                  id: 1
                - filter:
                    query: "@action:remediate"
                  name: Close
                  id: 3
                - filter:
                    query: "@action:*"
                  name: Other
                  id: 99
                - filter:
                    query: "*"
                  name: Unknown
                  id: 0
              targets:
                name: ocsf.activity_name
                id: ocsf.activity_id
              fallback:
                values:
                  ocsf.activity_name: Other
                  ocsf.activity_id: "99"
                sources:
                  ocsf.activity_name:
                    - action
              type: schema-category-mapper
            - name: ocsf.status_id
              categories:
                - filter:
                    query: "@action:detect"
                  name: New
                  id: 1
                - filter:
                    query: "@action:remediate"
                  name: Resolved
                  id: 4
                - filter:
                    query: "*"
                  name: Unknown
                  id: 0
              targets:
                name: ocsf.status
                id: ocsf.status_id
              type: schema-category-mapper
            - name: ocsf.severity_id
              categories:
                - filter:
                    query: "@new_state.vulnerability.severity:Critical"
                  name: Critical
                  id: 5
                - filter:
                    query: "@new_state.vulnerability.severity:High"
                  name: High
                  id: 4
                - filter:
                    query: "@new_state.vulnerability.severity:Medium"
                  name: Medium
                  id: 3
                - filter:
                    query: "@new_state.vulnerability.severity:Low"
                  name: Low
                  id: 2
                - filter:
                    query: "@new_state.vulnerability.severity:*"
                  name: Other
                  id: 99
                - filter:
                    query: "*"
                  name: Unknown
                  id: 0
              targets:
                name: ocsf.severity
                id: ocsf.severity_id
              fallback:
                values:
                  ocsf.severity: Other
                  ocsf.severity_id: "99"
                sources:
                  ocsf.severity:
                    - new_state.vulnerability.severity
              type: schema-category-mapper
          schema:
            schemaType: ocsf
            version: 1.5.0
            className: Vulnerability Finding
            classUid: 2002
            extensions: []
            profiles: []
    - type: pipeline
      name: OCSF sub pipeline for class Vulnerability Finding [2002] (Detections)
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "service:detection"
      processors:
        - type: grok-parser
          name: Parse `detection_datetime` to `ocsf.time`
          enabled: true
          source: detection_datetime
          samples:
            - "2025-09-24T18:57:34.914031Z"
          grok:
            supportRules: ""
            matchRules: "iso_to_ms %{date(\"yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ\"):ocsf.time}"
        - type: string-builder-processor
          name: Add device OS name
          enabled: true
          template: "macOS"
          target: ocsf.device.os.name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `cve_id` to `vuln_stage.cve.uid`
          enabled: true
          sources:
            - cve_id
          sourceType: attribute
          target: vuln_stage.cve.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `cve_description` to `vuln_stage.cve.desc`
          enabled: true
          sources:
            - cve_description
          sourceType: attribute
          target: vuln_stage.cve.desc
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `cve_description` to `vuln_stage.desc`
          enabled: true
          sources:
            - cve_description
          sourceType: attribute
          target: vuln_stage.desc
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `cvss_severity`, `severity` to `vuln_stage.severity`
          enabled: true
          sources:
            - cvss_severity
            - severity
          sourceType: attribute
          target: vuln_stage.severity
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `cvss_score` to `cvss_stage.base_score`
          enabled: true
          sources:
            - cvss_score
          sourceType: attribute
          target: cvss_stage.base_score
          targetType: attribute
          targetFormat: double
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `cvss_severity`, `severity` to `cvss_stage.severity`
          enabled: true
          sources:
            - cvss_severity
            - severity
          sourceType: attribute
          target: cvss_stage.severity
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        #`cvss.version` is required and not in the logs, hardcoding it
        - type: string-builder-processor
          name: Add CVSS version
          enabled: true
          template: "3.1"
          target: cvss_stage.version
          replaceMissing: false
        - type: array-processor
          name: Move attributes into cve.cvss array
          enabled: true
          operation:
            source: cvss_stage
            target: vuln_stage.cve.cvss
            preserveSource: false
            type: append
        - type: array-processor
          name: Move attributes into vulnerabilities array
          enabled: true
          operation:
            source: vuln_stage
            target: ocsf.vulnerabilities
            preserveSource: false
            type: append
        - type: string-builder-processor
          name: Add finding title
          enabled: true
          template: "%{cve_id} in %{name}"
          target: finding_title
          replaceMissing: false
        # Synthesize a finding identifier. GET /api/v1/vulnerability-management/
        # detections returns no per-detection id (no id, detection_id or uuid --
        # confirmed against the vendor's published API collection), so there is
        # no single field that can serve ocsf.finding_info.uid or
        # ocsf.metadata.uid. The endpoint returns one row per
        # (device, application, CVE) across the whole fleet, while the sibling
        # /vulnerabilities endpoint is the CVE-grouped view -- so cve_id is the
        # grouping key and repeats across every affected device, which makes it
        # unusable as a unique finding id on its own. device_id + cve_id is the
        # essential identity; bundle_id additionally separates the case where one
        # CVE affects two applications on the same device. replaceMissing must
        # stay true: with false a single absent field yields no uid at all, and
        # finding_info.uid is a required attribute.
        - type: string-builder-processor
          name: Add finding uid
          enabled: true
          template: "%{device_id}-%{bundle_id}-%{cve_id}"
          target: finding_uid
          replaceMissing: true
        - type: schema-processor
          name: Apply OCSF schema for 2002
          enabled: true
          mappers:
            - type: schema-remapper
              name: Map `ocsf.metadata.product.name` to `ocsf.metadata.product.name`
              sources:
                - ocsf.metadata.product.name
