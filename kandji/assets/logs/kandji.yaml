    name: Type ID
    path: ocsf.type_uid
    source: log
    type: integer
  - groups:
      - OCSF
    name: Severity
    path: ocsf.severity
    source: log
  - groups:
      - OCSF
    name: Severity ID
    path: ocsf.severity_id
    source: log
    type: integer
  - groups:
      - OCSF
    name: Status
    path: ocsf.status
    source: log
  - groups:
