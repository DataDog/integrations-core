              overrideOnConflict: true
              targetFormat: integer
            - type: schema-remapper
              name: Map `ocsf.user.name` to `ocsf.user.name`
              sources:
                - ocsf.user.name
              target: ocsf.user.name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `id` to `ocsf.metadata.uid`
              sources:
                - id
              target: ocsf.metadata.uid
              preserveSource: true
