              iso_z_f1 %{date("yyyy-MM-dd'T'HH:mm:ss.SZ"):ocsf.time}
              iso_z_f0 %{date("yyyy-MM-dd'T'HH:mm:ssZ"):ocsf.time}
              iso_off_f6 %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSSSZZ"):ocsf.time}
