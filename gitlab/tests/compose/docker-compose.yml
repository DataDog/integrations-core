services:
  gitlab:
    image: ${GITLAB_IMAGE:-gitlab/gitlab-ce}:${GITLAB_VERSION}
    healthcheck:
      test: curl -f http://localhost:80/-/health | grep "GitLab OK" || exit 1
      interval: 3s
      retries: 100
      start_period: 30s
      timeout: 5s
    volumes:
      # `exporters` env swaps in gitlab-exporters.rb, which enables the Workhorse
      # and Sidekiq exporters on top of the default config.
      - ./config/${GITLAB_CONFIG_FILE:-gitlab.rb}:/etc/gitlab/gitlab.rb
      - ${LOGS_FOLDER}:/var/log/gitlab
    ports:
      - "${GITLAB_LOCAL_PORT}:80"
      - "${GITLAB_LOCAL_PROMETHEUS_PORT}:9090"
      - "${GITLAB_LOCAL_GITALY_PROMETHEUS_PORT}:9236"
      # Only listening when gitlab-exporters.rb is in use; mapping an unbound
      # container port is harmless for the other envs.
      - "${GITLAB_LOCAL_WORKHORSE_PROMETHEUS_PORT:-8090}:9229"
      - "${GITLAB_LOCAL_SIDEKIQ_PROMETHEUS_PORT:-8091}:8082"
    environment:
      - GITLAB_ROOT_PASSWORD=${GITLAB_TEST_PASSWORD}
