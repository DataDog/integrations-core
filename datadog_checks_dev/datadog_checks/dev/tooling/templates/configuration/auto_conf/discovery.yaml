- name: discovery
  description: |
    Enables configuration discovery.

    When this integration's metric prefix differs from its own name, `metrics_prefix` is set
    to that prefix automatically, so Autodiscovery can detect metric-duplicating generic
    (`openmetrics`/`prometheus`) integrations targeting the same service.
  enabled: true
  example: {}
- template: init_config
  description: Unused init configuration
  enabled: true
  options: []
- name: instances
  description: Unused instance configuration
  enabled: true
  example: []
