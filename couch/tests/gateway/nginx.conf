# Plain TCP passthrough so one hostname reaches both CouchDB generations. The
# check talks HTTP straight to the backends; nothing is rewritten or injected.
#   5984 -> couchdb    (3.x, CouchDB2 code path, CouchDB-overview dashboard)
#   5985 -> couchdb-v1 (1.x, CouchDB1 code path, CouchDBv1-overview dashboard)
worker_processes 1;

events {
  worker_connections 1024;
}

stream {
  server {
    listen 5984;
    proxy_pass couchdb:5984;
  }

  server {
    listen 5985;
    proxy_pass couchdb-v1:5984;
  }
}
