# Single entrypoint for kong-full: publishes both Kong nodes on one hostname so a
# consumer reaches each through the fixture's provides.* contract.
#   8000/8001 -> Kong 3.x proxy/admin   (kong)
#   8100/8101 -> Kong 2.x proxy/admin   (kong-legacy)
#   8200      -> recorded Kong 2.x /metrics (tests/fixtures/prometheus.txt), for
#                the 2.x stream series a live node cannot export (README)
worker_processes 1;
events { worker_connections 1024; }
stream {
  server { listen 8000; proxy_pass kong:8000; }
  server { listen 8001; proxy_pass kong:8001; }
  server { listen 8100; proxy_pass kong-legacy:8000; }
  server { listen 8101; proxy_pass kong-legacy:8001; }
}
http {
  server {
    listen 8200;
    location = /metrics {
      default_type text/plain;
      alias /fixtures/prometheus.txt;
    }
  }
}
