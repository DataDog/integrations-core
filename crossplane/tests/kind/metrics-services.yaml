# The Crossplane chart and package manager do not create Services for the metrics port.
apiVersion: v1
kind: Service
metadata:
  name: crossplane-metrics
  namespace: crossplane-system
spec:
  selector:
    app: crossplane
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: provider-nop-metrics
  namespace: crossplane-system
spec:
  selector:
    pkg.crossplane.io/provider: provider-nop
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
