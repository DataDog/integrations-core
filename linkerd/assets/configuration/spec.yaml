name: Linkerd
fleet_configurable: true
files:
- name: linkerd.yaml
  discovery:
    strategies:
    - template: discovery/openmetrics_from_named_ports
      overrides:
        port_names:
        - linkerd-admin
  options:
  - template: init_config
    options:
    - template: init_config/openmetrics
  - template: instances
    options:
    - template: instances/openmetrics
      overrides:
        openmetrics_endpoint.required: false
        openmetrics_endpoint.value.example: http://localhost:9990/admin/metrics/prometheus
        exclude_labels.enabled: true
        exclude_labels.value.example:
          - destination_service
        tag_by_endpoint.example: false
        tag_by_endpoint.hidden: false
        tag_by_endpoint.enabled: true
    - template: instances/openmetrics_legacy_base
      hidden: true
      overrides:
        prometheus_url.required: false

- name: auto_conf.yaml
  options:
  - template: ad_identifiers
    overrides:
      value.example:
      - proxy
  - template: auto_conf/cel_selector
    overrides:
      cel_selector.example:
        containers:
        - container.image.reference.contains("cr.l5d.io/linkerd/proxy")
  - template: auto_conf/discovery
