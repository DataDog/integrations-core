name: GlusterFS
fleet_configurable: true
files:
- name: glusterfs.yaml
  options:
  - template: init_config
    options:
    - name: gstatus_path
      description: |
        Deprecated and ignored. The glusterfs check now calls the `gluster` CLI
        directly and no longer ships or uses the `gstatus` binary. This option
        is retained only so a warning can be logged if it is still set.
      fleet_configurable: true
      value:
        type: string
        example: <datadog-agent>/embedded/sbin/gstatus
        require_trusted_provider: true
    - template: init_config/default
  - template: instances
    options:
    - name: gluster_command
      description: |
        Command used to invoke the `gluster` CLI, as a list of arguments. The
        default `["gluster"]` assumes `gluster` is on PATH. To run `gluster`
        inside a container, in a non-default location, or through a wrapper
        script, set this to the full command prefix, e.g.
        `["docker", "exec", "<container>", "gluster"]`.

        The `gluster` CLI is provided by the `glusterfs-server` package, which
        must be installed on the GlusterFS server node running this check.
      fleet_configurable: true
      value:
        type: array
        items:
          type: string
        example:
          - gluster
    - name: use_sudo
      description: |
        The `gluster` CLI requires root for status collection. Enable this
        option to run `gluster` with `sudo`. If enabled, add a line like the
        following to your sudoers file, adjusted to match `gluster_command`:

        dd-agent ALL=(ALL) NOPASSWD:/usr/sbin/gluster
      fleet_configurable: true
      value:
        type: boolean
        example: true

    - template: instances/default
      overrides:
        min_collection_interval.value.example: 60
        min_collection_interval.enabled: true
        min_collection_interval.description: |
          The GlusterFS integration collects cluster-wide metrics which can put additional workload on the server.
          Increase the collection interval to reduce the frequency.

          This changes the collection interval of the check. For more information, see:
          https://docs.datadoghq.com/developers/write_agent_check/#collection-interval

  - template: logs
    example:
    - type: file
      path: /var/log/glusterfs/glusterd.log
      source: glusterfs
    - type: file
      path: /var/log/glusterfs/cli.log
      source: glusterfs
