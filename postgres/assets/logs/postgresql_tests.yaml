# bypass-global-date-remapper-parse-failure-checks
# pgprefix_kv_client and pgprefix_unparsed intentionally have no timestamp to remap.
# Allow the harness sentinel for those cases; exact date expectations remain asserted below.
# Full-pipeline expectations; these are separate from each Grok processor's UI samples.
# Each case names its parsing rule and the behavior it protects. Assertions include absent fields.
# Failure triage: compare the reported actual output with the expected fields below.
# The test harness starts at timestamp 1; cases without a parsed date retain that sentinel.
# - Wrong/missing raw prefix fields: named pgprefix_* rule and its _pg_* helpers.
# - Wrong message/state_code: _pg_body[_with_prefix_state], then the message remapper.
# - Correct raw timestamp/session_start but wrong db.date/db.backend_start: date Grok rules.
# - Correct db.date but wrong official timestamp: date remapper.
# - Wrong db.statement/db.operation: pg_statement. Wrong duration: pg_duration/pg_statement,
#   then Convert duration from ms to ns (the expected output here is always nanoseconds).
# - Correct remote_host but wrong network.client.ip/hostname: Classify `remote_host`.
# - Correct error_severity but wrong category/status: Normalize PostgreSQL severity/status remapper.
# - Correct raw field but wrong compatibility alias or db tag: the corresponding Map processor.
# These cases cover representative branches, not every regex input or Agent collection behavior.
id: "postgresql"
tests:
 # pgprefix_timestamp_only: preserve an ordinary body; no query details or duration.
 -
  sample: "2017-11-07 17:30:39 UTC LOG:  incomplete startup packet"
  result:
    custom:
      db:
        date: 1510075839000
        severity: "LOG"
      error_severity: "LOG"
      postgres:
        severity_category: "info"
      timestamp: "2017-11-07 17:30:39 UTC"
    message: "incomplete startup packet"
    status: "info"
    tags:
     - "source:LOGS_SOURCE"
    timestamp: 1510075839000
