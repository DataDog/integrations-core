id: postgresql
metric_id: postgres
backend_only: false
facets:
  - groups:
      - Database
    name: Database
    path: db.instance
    source: log
  - groups:
      - Database
    name: Operation Type
    path: db.operation
    source: log
  - groups:
      - Database
    name: User
    path: db.user
    source: log
  - facetType: range
    groups:
      - Measure
    name: Duration
    path: duration
    source: log
    type: double
    unit:
      family: time
      name: nanosecond
  - groups:
      - Database
    name: Session ID
    path: postgres.session_id
    source: log
pipeline:
  type: pipeline
  name: Postgresql
  enabled: true
  filter:
    query: source:postgresql
  processors:
    # Read the original message before the existing message remapper runs.
    - type: grok-parser
      name: Extract PostgreSQL prefix fields
      enabled: true
      source: message
      samples:
        - '2017-11-08 18:11:35.727 UTC [5237] postgres psql postgres [local] 5a0348cd.1475 LOG:  statement: SELECT * FROM playground;'
        - '2026-08-17 20:45:45 UTC-6a8372f9.6b-LOG:  statement: SELECT 2 AS c02;'
        - '<2026-08-17 20:47:02 UTC 172.17.0.1(45772) pgllp_app pgllp_db pgllp_user 107 6a837346.6b idle>LOG:  statement: SELECT 2 AS c02;'
        - ' sql_error_code = 00000 time_ms = "2026-08-17 20:47:13.749 UTC" pid="108" proc_start_time="2026-08-17 20:47:13 UTC" session_id="6a837351.6c" vtid="4/5" tid="0" log_line="10" database="pgllp_db" connection_source="172.17.0.1(42336)" user="pgllp_user" application_name="pgllp_app" LOG:  statement: SELECT 2 AS c02;'
        - 'pid=107,user=pgllp_user,db=pgllp_db,app=pgllp_app,client=172.17.0.1 LOG:  statement: SELECT 2 AS c02;'
        - '2026-08-17 20:45:12 UTC:172.17.0.1(37472):pgllp_user@pgllp_db:[107]:LOG:  statement: SELECT 2 AS c02;'
        - '2026-08-17 20:45:23.980 UTC:172.17.0.1(54222):pgllp_user@pgllp_db:[107]:10:00000:2026-08-17 20:45:23 UTC:4/5:0:6a8372e3.6b:pgllp_app:LOG:  statement: SELECT 2 AS c02;'
        - '2026-08-17 20:46:29.997 UTC [106][client backend]: [10-1] db=pgllp_db,user=pgllp_user LOG:  statement: SELECT 2 AS c02;'
        - '2026-08-17 20:45:34.801 UTC [105] [user=pgllp_user,db=pgllp_db,app=pgllp_app] LOG:  statement: SELECT 2 AS c02;'
      grok:
        supportRules: |
          # %p — process ID
          _pg_pid %{integer:postgres.pid}
          # %l — log line number within the session
          _pg_line_num %{integer:postgres.line_num}
          # %x — transaction ID
          _pg_txid %{integer:postgres.txid}
          # %c — session ID
          _pg_session_id %{regex("[0-9a-f]+\\.[0-9a-f]+"):postgres.session_id}
          # %v — virtual transaction ID
          _pg_vxid (?:%{regex("[0-9]+/[0-9]+"):postgres.vxid})?
          # %e — SQLSTATE
          _pg_state_code %{regex("[A-Z0-9]{5}"):postgres.state_code:nullIf("00000")}
          # %m / %t — log timestamp with / without milliseconds
          # Accept standard timezone abbreviations (letters, digits, +, -) or an empty suffix.
          _pg_timestamp %{regex("[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)? (?:[0-9A-Za-z+-]+)?"):postgres.timestamp}
          # %s — process start timestamp
          _pg_session_start %{regex("[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)? (?:[0-9A-Za-z+-]+)?"):postgres.session_start}
          # %r — client host and optional port
          _pg_remote (?:(?:%{ipOrHost:postgres.remote_host}\(%{integer:postgres.remote_port}\))|%{regex("\\[local\\]"):postgres.remote_host}|%{ipOrHost:postgres.remote_host})?
          # %u — user name
          _pg_user %{regex("\\S*"):postgres.user:nullIf("[unknown]")}
          # %d — database name
          _pg_dbname %{regex("\\S*"):postgres.dbname:nullIf("[unknown]")}
          # %a — application name
          _pg_app_name %{data:postgres.application_name:nullIf("[unknown]")}
          # %h — client host only
          _pg_remote_host %{regex("\\S*"):postgres.remote_host}
          # %b — backend type
          _pg_backend_type %{data:postgres.backend_type}
          # %i — command tag
          _pg_ps %{data:postgres.ps}
          # Both body helpers parse the severity, optional SQLSTATE and message after the configured prefix.
          # Consume the position suffix without publishing cursorpos or internalpos: text cannot distinguish them.
          # Keep pgAudit's AUDIT: SESSION/OBJECT marker in the message instead of treating AUDIT as SQLSTATE.
          _pg_body %{word:postgres.error_severity}:  (?:%{regex("(?!AUDIT: (?:SESSION|OBJECT),)[A-Z0-9]{5}"):postgres.state_code:nullIf("00000")}: )?%{data:postgres.message}(?: at character \d+)?
          # When %e already captures SQLSTATE, consume its verbose-body copy without creating an array.
          _pg_body_with_prefix_state %{word:postgres.error_severity}:  (?:%{regex("(?!AUDIT: (?:SESSION|OBJECT),)[A-Z0-9]{5}")}: )?%{data:postgres.message}(?: at character \d+)?
        matchRules: |
          # log_line_prefix = '%m [%p] %d %a %u %h %c '
          pgprefix_dd_docs %{_pg_timestamp} \[%{_pg_pid}\] %{_pg_dbname} %{_pg_app_name} %{_pg_user} %{_pg_remote_host} %{_pg_session_id} %{_pg_body}

          # log_line_prefix = '%m [%p] ' (PostgreSQL's built-in default)
          default_format %{_pg_timestamp} \[%{_pg_pid}\] %{_pg_body}

          # log_line_prefix = '%t-%c-' (Azure Database for PostgreSQL default)
          pgprefix_azure %{_pg_timestamp}-%{_pg_session_id}-%{_pg_body}

          # log_line_prefix = '<%t %r %a %d %u %p %c %i>'
          pgprefix_bracket <%{_pg_timestamp} %{_pg_remote} %{_pg_app_name} %{_pg_dbname} %{_pg_user} %{_pg_pid} %{_pg_session_id} %{_pg_ps}>%{_pg_body}

          # log_line_prefix = ' sql_error_code = %e time_ms = "%m" pid="%p" proc_start_time="%s" session_id="%c" vtid="%v" tid="%x" log_line="%l" %qdatabase="%d" connection_source="%r" user="%u" application_name="%a" ' (Heroku Postgres)
          pgprefix_heroku \s*sql_error_code = %{_pg_state_code} time_ms = "%{_pg_timestamp}" pid="%{_pg_pid}" proc_start_time="%{_pg_session_start}" session_id="%{_pg_session_id}" vtid="%{_pg_vxid}" tid="%{_pg_txid}" log_line="%{_pg_line_num}" (?:database="%{_pg_dbname}" connection_source="%{_pg_remote}" user="%{_pg_user}" application_name="%{_pg_app_name}" )?%{_pg_body_with_prefix_state}

          # log_line_prefix = 'pid=%p,user=%u,db=%d,app=%a,client=%h '
          pgprefix_kv_client pid=%{_pg_pid},user=%{_pg_user},db=%{_pg_dbname},app=%{_pg_app_name},client=%{_pg_remote_host} %{_pg_body}

          # log_line_prefix = '%t:%r:%u@%d:[%p]:' (Amazon RDS default)
          pgprefix_rds %{_pg_timestamp}:%{_pg_remote}:%{_pg_user}@%{_pg_dbname}:\[%{_pg_pid}\]:%{_pg_body}

          # log_line_prefix = '%m:%r:%u@%d:[%p]:%l:%e:%s:%v:%x:%c:%q%a:' (RDS with the enhanced-logging fields enabled)
          pgprefix_rds_enhanced %{_pg_timestamp}:%{_pg_remote}:%{_pg_user}@%{_pg_dbname}:\[%{_pg_pid}\]:%{_pg_line_num}:%{_pg_state_code}:%{_pg_session_start}:%{_pg_vxid}:%{_pg_txid}:%{_pg_session_id}:(?:%{_pg_app_name}:)?%{_pg_body_with_prefix_state}

          # log_line_prefix = '%m [%p][%b]: [%l-1] db=%d,user=%u '
          pgprefix_verbose_user_backend %{_pg_timestamp} \[%{_pg_pid}\]\[%{_pg_backend_type}\]: \[%{_pg_line_num}-1\] db=%{_pg_dbname},user=%{_pg_user} %{_pg_body}

          # log_line_prefix = '%m [%p]: [%l-1] db=%d,user=%u,host=%h '
          pgprefix_verbose_user_host %{_pg_timestamp} \[%{_pg_pid}\]: \[%{_pg_line_num}-1\] db=%{_pg_dbname},user=%{_pg_user},host=%{_pg_remote_host} %{_pg_body}

          # log_line_prefix = '%m [%p]: [%l-1] db=%d,user=%u '
          pgprefix_verbose_user %{_pg_timestamp} \[%{_pg_pid}\]: \[%{_pg_line_num}-1\] db=%{_pg_dbname},user=%{_pg_user} %{_pg_body}

          # This rule must precede pgprefix_atdb, which can mistake an @ inside a labeled field for user@database.
          # log_line_prefix = '%m [%p] %q[user=%u,db=%d,app=%a] ' (pganalyze recommended prefix)
          pgprefix_pganalyze %{_pg_timestamp} \[%{_pg_pid}\] (?:\[user=%{_pg_user},db=%{_pg_dbname},app=%{_pg_app_name}\] )?%{_pg_body}

          # log_line_prefix = '%m [%p] %q%u@%d '
          pgprefix_atdb %{_pg_timestamp} \[%{_pg_pid}\] (?:%{_pg_user}@%{_pg_dbname} )?%{_pg_body}

          # log_line_prefix = '%t '
          pgprefix_timestamp_only %{_pg_timestamp} %{_pg_body}
    - type: grok-parser
      name: Parsing Postgresql logs
      enabled: true
      source: message
      samples:
        - '2017-11-07 17:30:39 UTC LOG:  incomplete startup packet'
        - '2017-11-07 17:37:22 UTC FATAL:  role "myrole" does not exist'
        - '2017-11-08 18:11:35.727 UTC [5237] postgres psql postgres [local] 5a0348cd.1475 LOG:  statement: SELECT * FROM playground;'
        - '2019-12-10 18:27:45.389 UTC [114] datadog_test datadog-agent datadog 172.28.0.1 5defc7c5.72 LOG:  duration: 0.140 ms  statement: select checkpoints_timed, checkpoints_req, buffers_checkpoint, buffers_clean, maxwritten_clean, buffers_backend, buffers_alloc, buffers_backend_fsync, checkpoint_write_time, checkpoint_sync_time FROM pg_stat_bgwriter'
        - '2025-09-15 19:05:58.892 UTC:10.0.216.218(36378):shopper_1@dbmorders_1:[20337]:395:00000:2025-09-15 19:02:57 UTC:384/39221:0:68c862e1.4f71:[unknown]:LOCATION:  exec_simple_query, postgres.c:1075'
        - '2025-09-16 18:26:45.429 UTC:192.168.65.1(31674):postgres@postgres:[87]:34853:00000:2025-09-16 18:25:58 UTC:5/2050:2823:68c9abb6.57:pgbench:LOG:  duration: 0.003 ms  execute <unnamed>: INSERT INTO pgbench_history (tid, bid, aid, delta, mtime) VALUES ($1, $2, $3, $4, CURRENT_TIMESTAMP);'
      grok:
        supportRules: |
          _timestamp %{date("yyyy-MM-dd HH:mm:ss z"):db.date}
          _timestamp_ms %{date("yyyy-MM-dd HH:mm:ss.SSS z"):db.date}
          _betimestamp %{date("yyyy-MM-dd HH:mm:ss z"):db.backend_start}
          _database %{notSpace:db.instance}
          _raw_query %{data:db.statement}
          _duration %{numberExt:duration}
          _severity %{?>notSpace:db.severity}
          _user %{notSpace:db.user}
          _client_ip %{notSpace:network.client.ip}
          _proc_id %{notSpace:postgres.proc_id}
          _session_id %{notSpace:postgres.session_id}
          _app %{notSpace:postgres.appname}
          _prefix %{_timestamp_ms} \[%{_proc_id}\] %{_database} %{_app} %{_user} %{_client_ip} %{_session_id}
        matchRules: |
          #Check documentation for the setup of the suggested format
          suggested_format_with_duration %{_prefix} %{_severity}:\s+duration:\s+%{_duration}\s+ms\s+(%{regex("statement:")}\s+%{_raw_query}|%{data:msg})

          suggested_format %{_prefix} %{_severity}:\s+(%{regex("statement:")}\s+%{_raw_query}|%{data:msg})

          #See RDS documentation for more data-rich format
          enhanced_rds_with_duration %{_timestamp_ms}:%{_client_ip}\(%{port:network.client.port:integer}\):%{_user}@%{_database}:\[%{_proc_id}\]:%{integer:session_lineno}:%{notSpace:sql_state}:%{_betimestamp}:%{regex("[^:]+"):postgres.vxid}:%{regex("[^:]+"):postgres.xid}:%{regex("[^:]+"):postgres.session_id}:(%{regex("[^:]+"):postgres.appname})?:%{_severity}:\s*(%{integer}:\s*)?duration:\s+%{_duration}\s+ms\s+(%{regex("statement:")}\s+%{_raw_query}|%{data:msg})

          enhanced_rds %{_timestamp_ms}:(%{_client_ip}\(%{port:network.client.port:integer}\))?:(%{_user})?@(%{_database})?:\[%{_proc_id}\]:%{integer:session_lineno}:%{notSpace:sql_state}:%{_betimestamp}:%{regex("[^:]+"):postgres.vxid}:%{regex("[^:]+"):postgres.xid}:%{regex("[^:]+"):postgres.session_id}:(%{regex("[^:]+"):postgres.appname}:)?%{_severity}:\s*(%{integer}:\s*)?(%{regex("statement:")}\s+%{_raw_query}|%{data:msg})

          default_format (%{_timestamp}|%{_timestamp_ms} \[%{_proc_id}])\s+%{_severity}:\s+(%{regex("statement:")}\s+%{_raw_query}|%{data:msg})

          #Sample
          #2017-11-07 17:30:39 UTC LOG:  incomplete startup packet
          #2017-11-07 17:37:22 UTC FATAL:  role "myrole" does not exist

          #Sample suggested format
          #2017-11-08 18:11:35.727 UTC [5237] postgres psql postgres [local] 5a0348cd.1475 LOG:  statement: SELECT * FROM playground;

          #Sample suggested format with duration included
          #2019-12-10 18:27:45.389 UTC [114] datadog_test datadog-agent datadog 172.28.0.1 5defc7c5.72 LOG:  duration: 0.140 ms  statement: select checkpoints_timed, checkpoints_req, buffers_checkpoint, buffers_clean, maxwritten_clean, buffers_backend, buffers_alloc, buffers_backend_fsync, checkpoint_write_time, checkpoint_sync_time FROM pg_stat_bgwriter
    - type: grok-parser
      name: Extract db.operation from statement
      enabled: true
      source: db.statement
      grok:
        supportRules: |
        matchRules: |
          extract_operation %{word:db.operation} .*
      samples:
        - SELECT * FROM playground;
        - select checkpoints_timed, checkpoints_req, buffers_checkpoint, buffers_clean, maxwritten_clean, buffers_backend, buffers_alloc, buffers_backend_fsync, checkpoint_write_time, checkpoint_sync_time FROM pg_stat_bgwriter
    - type: date-remapper
      name: Define `db.date` as the official date of the log
      enabled: true
      sources:
        - db.date
    - type: message-remapper
      name: Define `msg` as the official message of the log
      enabled: true
      sources:
        - msg
    - type: status-remapper
      name: Define `db.severity` as the official status of the log
      enabled: true
      sources:
        - db.severity
    - type: attribute-remapper
      name: Map attribute `db.instance` to tag `db`
      enabled: true
      sources:
        - db.instance
      target: db
      targetType: tag
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
    - type: arithmetic-processor
      name: Convert duration from ms to ns
      enabled: true
      expression: duration * 1000000
      target: duration
      replaceMissing: false
