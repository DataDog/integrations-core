id: postgresql
metric_id: postgres
backend_only: false
facets:
  - groups:
      - Database
    name: Database
    path: db.instance
    source: log
  - groups:
      - Database
    name: Operation Type
    path: db.operation
    source: log
  - groups:
      - Database
    name: User
    path: db.user
    source: log
  - facetType: range
    groups:
      - Measure
    name: Duration
    path: duration
    source: log
    type: double
    unit:
      family: time
      name: nanosecond
  - groups:
      - Database
    name: Session ID
    path: postgres.session_id
    source: log
pipeline:
  type: pipeline
  name: PostgreSQL
  enabled: true
  filter:
    query: source:postgresql
  processors:
    - type: grok-parser
      name: Parse PostgreSQL logs
      enabled: true
      source: message
      samples:
        - '2017-11-08 18:11:35.727 UTC [5237] postgres psql postgres [local] 5a0348cd.1475 LOG:  statement: SELECT * FROM playground;'
        - '2026-08-17 20:45:23.980 UTC:172.17.0.1(54222):pgllp_user@pgllp_db:[107]:10:00000:2026-08-17 20:45:23 UTC:4/5:0:6a8372e3.6b:pgllp_app:LOG:  statement: SELECT 2 AS c02;'
        - 'custom-prefix|host=db1|LOG:  statement: SELECT 99;'
      grok:
        supportRules: |
          _pg_pid %{integer:pid}
          _pg_line_num %{integer:line_num}
          _pg_txid %{integer:txid}
          _pg_session_id %{regex("[0-9a-f]+\\.[0-9a-f]+"):session_id}
          _pg_vxid (?:%{regex("[0-9]+/[0-9]+"):vxid})?
          _pg_state_code %{regex("[A-Z0-9]{5}"):state_code:nullIf("00000")}
          _pg_timestamp %{regex("[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)? (?:[0-9A-Za-z+-]+)?"):timestamp}
          _pg_session_start %{regex("[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)? (?:[0-9A-Za-z+-]+)?"):session_start}
          _pg_remote (?:(?:%{ipOrHost:remote_host}\(%{integer:remote_port}\))|%{regex("\\[local\\]"):remote_host}|%{ipOrHost:remote_host})?
          _pg_user %{regex("\\S*"):user:nullIf("[unknown]")}
          _pg_dbname %{regex("\\S*"):dbname:nullIf("[unknown]")}
          _pg_app_name %{data:application_name:nullIf("[unknown]")}
          _pg_remote_host %{regex("\\S*"):remote_host}
          # Text cannot distinguish cursorpos from internalpos, so consume but do not publish it.
          _pg_body %{word:error_severity}:  (?:%{regex("[A-Z0-9]{5}"):state_code:nullIf("00000")}: )?%{data:message}(?: at character \d+)?
          # When %e already captures SQLSTATE, consume its verbose-body copy without creating an array.
          _pg_body_with_prefix_state %{word:error_severity}:  (?:%{regex("[A-Z0-9]{5}")}: )?%{data:message}(?: at character \d+)?
        matchRules: |
          # log_line_prefix = '%m [%p] %d %a %u %h %c '
          pgprefix_dd_docs %{_pg_timestamp} \[%{_pg_pid}\] %{_pg_dbname} %{_pg_app_name} %{_pg_user} %{_pg_remote_host} %{_pg_session_id} %{_pg_body}

          # log_line_prefix = '%m [%p] ' (PostgreSQL's built-in default)
          default_format %{_pg_timestamp} \[%{_pg_pid}\] %{_pg_body}

          # log_line_prefix = '%m:%r:%u@%d:[%p]:%l:%e:%s:%v:%x:%c:%q%a:' (RDS with the enhanced-logging fields enabled)
          pgprefix_rds_enhanced %{_pg_timestamp}:%{_pg_remote}:%{_pg_user}@%{_pg_dbname}:\[%{_pg_pid}\]:%{_pg_line_num}:%{_pg_state_code}:%{_pg_session_start}:%{_pg_vxid}:%{_pg_txid}:%{_pg_session_id}:(?:%{_pg_app_name}:)?%{_pg_body_with_prefix_state}

          # log_line_prefix = '%t '
          pgprefix_timestamp_only %{_pg_timestamp} %{_pg_body}

          # Keep last: matchRules are first-match-wins.
          pgprefix_unparsed %{data:message}
    - type: message-remapper
      name: Define `message` as the official message of the log
      enabled: true
      sources:
        - message
    - type: grok-parser
      name: Parse `timestamp` into `db.date`
      enabled: true
      source: timestamp
      grok:
        supportRules: |
        matchRules: |
          pg_date_ms %{date("yyyy-MM-dd HH:mm:ss.SSS z"):db.date}

          pg_date %{date("yyyy-MM-dd HH:mm:ss z"):db.date}
      samples:
        - 2026-08-17 20:45:57.031 UTC
        - 2026-08-17 20:45:45 UTC
    - type: grok-parser
      name: Extract query details from `message`
      enabled: true
      source: message
      grok:
        supportRules: |
        matchRules: |
          pg_duration_statement duration:\s+%{number:duration}\s+ms\s+statement:\s+(?=%{word:db.operation}(?:\s|$))%{data:db.statement}

          pg_duration duration:\s+%{number:duration}\s+ms%{data}

          pg_statement statement:\s+(?=%{word:db.operation}(?:\s|$))%{data:db.statement}
      samples:
        - 'duration: 0.140 ms  statement: SELECT * FROM playground;'
        - 'duration: 0.003 ms  execute <unnamed>: INSERT INTO t VALUES (1);'
        - 'duration: 12.345 ms'
        - "duration: 0.5 ms  plan:\n\t{\"Query Text\": \"SELECT 1 -- duration: 99 ms and more\"}"
        - "statement: SELECT 'duration: 99 ms'"
        - 'checkpoint starting: shutdown immediate'
        - "execute <unnamed>: INSERT INTO t VALUES ('statement: DELETE FROM x')"
    - type: attribute-remapper
      name: Map `remote_host` to `network.client.ip`
      enabled: true
      sources:
        - remote_host
      target: network.client.ip
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
    - type: date-remapper
      name: Define `db.date` as the official date of the log
      enabled: true
      sources:
        - db.date
    - type: arithmetic-processor
      name: Convert duration from ms to ns
      enabled: true
      expression: duration * 1000000
      target: duration
      replaceMissing: false
    - type: attribute-remapper
      name: Map `dbname` to `db.instance`
      enabled: true
      sources:
        - dbname
      target: db.instance
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
    - type: attribute-remapper
      name: Map attribute `db.instance` to tag `db`
      enabled: true
      sources:
        - db.instance
      target: db
      targetType: tag
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
    - type: attribute-remapper
      name: Map `user` to `db.user`
      enabled: true
      sources:
        - user
      target: db.user
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
    - type: attribute-remapper
      name: Map `error_severity` to `db.severity`
      enabled: true
      sources:
        - error_severity
      target: db.severity
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
    - type: grok-parser
      name: Parse `session_start` into `db.backend_start`
      enabled: true
      source: session_start
      grok:
        supportRules: |
        matchRules: |
          pg_backend_start_ms %{date("yyyy-MM-dd HH:mm:ss.SSS z"):db.backend_start}

          pg_backend_start %{date("yyyy-MM-dd HH:mm:ss z"):db.backend_start}
      samples:
        - 2025-09-15 19:02:57 UTC
        - 2026-08-17 20:45:57.031 UTC
    - type: status-remapper
      name: Define `db.severity` as the official status of the log
      enabled: true
      sources:
        - db.severity
    - type: string-builder-processor
      name: Map `pid` to `postgres.proc_id`
      enabled: true
      template: '%{pid}'
      target: postgres.proc_id
      replaceMissing: false
    - type: string-builder-processor
      name: Map `txid` to `postgres.xid`
      enabled: true
      template: '%{txid}'
      target: postgres.xid
      replaceMissing: false
    - type: attribute-remapper
      name: Map `vxid` to `postgres.vxid`
      enabled: true
      sources:
        - vxid
      target: postgres.vxid
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
    - type: attribute-remapper
      name: Map `line_num` to `session_lineno`
      enabled: true
      sources:
        - line_num
      target: session_lineno
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
    - type: attribute-remapper
      name: Map `remote_port` to `network.client.port`
      enabled: true
      sources:
        - remote_port
      target: network.client.port
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
    - type: attribute-remapper
      name: Map `state_code` to `sql_state`
      enabled: true
      sources:
        - state_code
      target: sql_state
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
    - type: attribute-remapper
      name: Map `session_id` to `postgres.session_id`
      enabled: true
      sources:
        - session_id
      target: postgres.session_id
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
    - type: attribute-remapper
      name: Map `application_name` to `postgres.appname`
      enabled: true
      sources:
        - application_name
      target: postgres.appname
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
      sourceType: attribute
