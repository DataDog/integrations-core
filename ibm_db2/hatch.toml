[env.collectors.datadog-checks]
base-package-features = ["deps", "db", "json"]

[[envs.default.matrix]]
python = ["3.13"]
version = ["11.1.4.7", "11.5.5.1", "12.1.5.0"]

[[envs.default.matrix]]
python = ["3.13"]
version = ["11.1.4.7", "11.5.5.1", "12.1.5.0"]
topology = ["hadr"]

[envs.default.env-vars]
IBM_DB_INSTALLER_URL = "https://agent-integrations-ci-fixtures.s3.us-east-1.amazonaws.com/fixtures/ibm-db2/"

[envs.default.overrides]
matrix.topology.platforms = [{ value = "linux", if = ["hadr"] }]
matrix.topology.e2e-env = { value = false, if = ["hadr"] }
matrix.topology.env-vars = [
  { key = "DB2_HADR", value = "true", if = ["hadr"] },
]
matrix.version.env-vars = [
  { key = "DB2_VERSION", value = "{matrix:version}" },
  { key = "DB2_IMAGE", value = "registry.ddbuild.io/ibm-db2:v146571149-45cdad2-11.1.4.7", if = ["11.1.4.7"] },
  { key = "DB2_IMAGE", value = "icr.io/db2_community/db2:{matrix:version}", if = ["11.5.5.1", "12.1.5.0"] },
]

[envs.default]
dependencies = [
  "ibm_db==3.0.1; python_version < '3.0'",
  "ibm_db==3.2.6; python_version > '3.0'",
]

[envs.bench]
