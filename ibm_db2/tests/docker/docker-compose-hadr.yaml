x-db2: &db2
  image: ${DB2_IMAGE}
  platform: linux/amd64
  privileged: true
  shm_size: 1g
  environment:
    LICENSE: accept
    DB2INST1_PASSWORD: db2inst1-pwd
  volumes:
    - backup:/hadr

services:
  primary:
    <<: *db2
    hostname: primary
  standby:
    <<: *db2
    hostname: standby

volumes:
  backup:
