pipeline:
  type: pipeline
  name: Automox
  enabled: true
  filter:
    query: source:automox
  processors:
  - type: grok-parser
    name: Parse a console event's `create_time`, which is UTC without a zone
    enabled: true
    source: create_time
    samples:
    - '2026-09-20 00:20:26.280007'
    grok:
      supportRules: ''
      matchRules: 'micros %{date("yyyy-MM-dd HH:mm:ss.SSSSSS"):automox.event_time}

        seconds %{date("yyyy-MM-dd HH:mm:ss"):automox.event_time}

        '
  - type: date-remapper
    name: Define `time` or `automox.event_time` as the official date of the log
    enabled: true
    sources:
    - time
    - automox.event_time
  - type: category-processor
    name: evt.category
    enabled: true
    categories:
    - filter:
        query: '@time:*'
      name: audit
    - filter:
        query: '@create_time:*'
      name: events
    target: evt.category
  - type: pipeline
    name: Audit Trail
    enabled: true
    filter:
      query: '@evt.category:audit'
    processors:
    - type: grok-parser
      name: Copy the Automox message to `evt.name`
      enabled: true
      source: message
      samples:
      - Policy Created
      grok:
        supportRules: ''
        matchRules: 'event_name %{data:evt.name}'
    - type: grok-parser
      name: Parse `raw_data` into `automox.raw`
      enabled: true
      source: raw_data
      samples:
      - '{"action":"remediateAll"}'
      grok:
        supportRules: ''
        matchRules: raw_json %{data:automox.raw:json}
  - type: pipeline
    name: 'Audit Trail > Drop secrets: a 2FA verification code or the enrollment key'
    enabled: true
    filter:
      query: '@evt.category:audit (@evt.name:("User Account 2FA Enabled for Email" OR "User Account 2FA Enabled for Mobile"
        OR "User Account 2FA Disabled" OR "User Profile Password Change") OR @automox.raw.token:* OR @automox.raw.orgs.access_key:*)'
    processors:
    - type: exclude-attribute
      name: Remove `raw_data`, which can hold a verification code or the enrollment key
      enabled: true
      attributeToExclude: raw_data
  - type: pipeline
    name: Audit Trail > Split a Splashtop error into its code and detail
    enabled: true
    filter:
      query: '@evt.category:audit @automox.raw.error_code:*'
    processors:
    - type: grok-parser
      name: Parse `automox.raw.error_code`
      enabled: true
      source: automox.raw.error_code
      samples:
      - '-1: Session failed to start'
      grok:
        supportRules: ''
        matchRules: 'code_and_detail %{regex("-?[0-9]+"):automox.error.code}: %{data:automox.error.detail}

          detail_only %{data:automox.error.detail}

          '
  - type: pipeline
    name: Audit Trail > Take the actor from the observables when Automox sent no actor object
    enabled: true
    filter:
      query: '@evt.category:audit -@actor.user.uid:* -@actor.user.email_addr:* -@unmapped.actor.user.uid:*'
    processors:
    - type: array-processor
      name: Extract the email observable
      enabled: true
      operation:
        source: observables
        target: automox.observed.email
        filter: type_id:5
        valueToExtract: value
        type: select
    - type: array-processor
      name: Extract the organization id observable
      enabled: true
      operation:
        source: observables
        target: automox.observed.org_uid
        filter: type:"Organization ID"
        valueToExtract: value
        type: select
    - type: array-processor
      name: Extract the organization name observable
      enabled: true
      operation:
        source: observables
        target: automox.observed.org_name
        filter: type:"Organization Name"
        valueToExtract: value
        type: select
  - type: pipeline
    name: Audit Trail > The email observable names the actor
    enabled: true
    filter:
      query: '@evt.category:audit -@actor.user.uid:* -@actor.user.email_addr:* -@unmapped.actor.user.uid:* @automox.observed.email:*
        -@automox.observed.email:""'
    processors:
    - type: attribute-remapper
      name: Map `automox.observed.email` to `automox.actor.user.email_addr`
      enabled: true
      sources:
      - automox.observed.email
      sourceType: attribute
      target: automox.actor.user.email_addr
      targetType: attribute
      preserveSource: true
      overrideOnConflict: true
    - type: attribute-remapper
      name: Map `automox.observed.org_uid` to `automox.actor.user.org.uid`
      enabled: true
      sources:
      - automox.observed.org_uid
      sourceType: attribute
      target: automox.actor.user.org.uid
      targetType: attribute
      preserveSource: true
      overrideOnConflict: true
  - type: pipeline
    name: Audit Trail > The organization name observable is set
    enabled: true
    filter:
      query: '@evt.category:audit -@actor.user.uid:* -@actor.user.email_addr:* -@unmapped.actor.user.uid:* @automox.observed.email:*
        -@automox.observed.email:"" @automox.observed.org_name:* -@automox.observed.org_name:""'
    processors:
    - type: attribute-remapper
      name: Map `automox.observed.org_name` to `automox.actor.user.org.name`
      enabled: true
      sources:
      - automox.observed.org_name
      sourceType: attribute
      target: automox.actor.user.org.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: true
  - type: pipeline
    name: Audit Trail > Outcome, status and user
    enabled: true
    filter:
      query: '@evt.category:audit'
    processors:
    - type: category-processor
      name: automox.outcome
      enabled: true
      categories:
      - filter:
          query: '@automox.error.code:*'
        name: failure
      - filter:
          query: '@status_id:2'
        name: failure
      - filter:
          query: '@status_id:1'
        name: success
      - filter:
          query: '*'
        name: unknown
      target: automox.outcome
    - type: attribute-remapper
      name: Map `automox.outcome` to `evt.outcome`
      enabled: true
      sources:
      - automox.outcome
      sourceType: attribute
      target: evt.outcome
      targetType: attribute
      preserveSource: false
      overrideOnConflict: true
    - type: category-processor
      name: automox.log_status
      enabled: true
      categories:
      - filter:
          query: '@evt.outcome:failure'
        name: warn
      - filter:
          query: '*'
        name: info
      target: automox.log_status
    - type: status-remapper
      name: Define `automox.log_status` as the official status of the log
      enabled: true
      sources:
      - automox.log_status
    - type: attribute-remapper
      name: Map `actor.user.email_addr`, `unmapped.actor.user.email_addr`, `automox.actor.user.email_addr` to `usr.email`
      enabled: true
      sources:
      - actor.user.email_addr
      - unmapped.actor.user.email_addr
      - automox.actor.user.email_addr
      sourceType: attribute
      target: usr.email
      targetType: attribute
      preserveSource: true
      overrideOnConflict: true
    - type: attribute-remapper
      name: Map `actor.user.uid`, `unmapped.actor.user.uid` to `usr.id`
      enabled: true
      sources:
      - actor.user.uid
      - unmapped.actor.user.uid
      sourceType: attribute
      target: usr.id
      targetType: attribute
      preserveSource: true
      overrideOnConflict: true
  - type: pipeline
    name: OCSF pre transformations (Audit Trail)
    enabled: true
    ocsf:
      isOcsf: true
    filter:
      query: '@evt.category:audit'
    processors:
    - type: string-builder-processor
      name: Add product name
      enabled: true
      template: Automox
      target: ocsf.metadata.product.name
      replaceMissing: false
    - type: string-builder-processor
      name: Add product vendor
      enabled: true
      template: Automox
      target: ocsf.metadata.product.vendor_name
      replaceMissing: false
    - type: string-builder-processor
      name: Add log name
      enabled: true
      template: Audit Trail
      target: ocsf.metadata.log_name
      replaceMissing: false
    - type: string-builder-processor
      name: Add log provider
      enabled: true
      template: audit-service
      target: ocsf.metadata.log_provider
      replaceMissing: false
    - type: grok-parser
      name: Parse `message` to `ocsf.metadata.event_code`
      enabled: true
      source: message
      samples:
      - Policy Created
      grok:
        supportRules: ''
        matchRules: event_code %{data:ocsf.metadata.event_code}
    - type: attribute-remapper
      name: Map `metadata.product.version` to `ocsf.metadata.product.version`
      enabled: true
      sources:
      - metadata.product.version
      sourceType: attribute
      target: ocsf.metadata.product.version
      targetType: attribute
      preserveSource: true
      overrideOnConflict: true
    - type: attribute-remapper
      name: Map `metadata.uid` to `ocsf.metadata.uid`
      enabled: true
      sources:
      - metadata.uid
      sourceType: attribute
      target: ocsf.metadata.uid
      targetType: attribute
      preserveSource: true
      overrideOnConflict: true
    - type: string-builder-processor
      name: Add the original time
      enabled: true
      template: '%{time}'
      target: ocsf.metadata.original_time
      replaceMissing: false
    - type: attribute-remapper
      name: Map `time` to `ocsf.time`
      enabled: true
      sources:
      - time
      sourceType: attribute
      target: ocsf.time
      targetType: attribute
      preserveSource: true
      overrideOnConflict: true
  - type: pipeline
    name: Audit Trail > Keep a tenant only when Automox sent one
    enabled: true
    filter:
      query: '@evt.category:audit @metadata.tenant_uid:* -@metadata.tenant_uid:""'
    processors:
    - type: attribute-remapper
      name: Map `metadata.tenant_uid` to `ocsf.metadata.tenant_uid`
      enabled: true
      sources:
      - metadata.tenant_uid
      sourceType: attribute
      target: ocsf.metadata.tenant_uid
      targetType: attribute
      preserveSource: true
      overrideOnConflict: true
  - type: pipeline
    name: OCSF sub pipeline for class Account Change [3001] (Audit Trail)
    enabled: true
    ocsf:
      isOcsf: true
    filter:
      query: '@evt.category:audit @class_uid:3001'
    processors:
    - type: schema-processor
      name: Apply OCSF schema for 3001
      enabled: true
      mappers:
      - type: schema-remapper
        name: Map `ocsf.metadata.product.name` to `ocsf.metadata.product.name`
        sources:
        - ocsf.metadata.product.name
        target: ocsf.metadata.product.name
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `ocsf.metadata.product.vendor_name` to `ocsf.metadata.product.vendor_name`
        sources:
        - ocsf.metadata.product.vendor_name
        target: ocsf.metadata.product.vendor_name
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `ocsf.metadata.product.version` to `ocsf.metadata.product.version`
        sources:
        - ocsf.metadata.product.version
        target: ocsf.metadata.product.version
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `ocsf.metadata.log_name` to `ocsf.metadata.log_name`
        sources:
        - ocsf.metadata.log_name
        target: ocsf.metadata.log_name
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `ocsf.metadata.log_provider` to `ocsf.metadata.log_provider`
        sources:
        - ocsf.metadata.log_provider
        target: ocsf.metadata.log_provider
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `ocsf.metadata.event_code` to `ocsf.metadata.event_code`
        sources:
        - ocsf.metadata.event_code
        target: ocsf.metadata.event_code
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `ocsf.metadata.uid` to `ocsf.metadata.uid`
        sources:
        - ocsf.metadata.uid
        target: ocsf.metadata.uid
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `ocsf.metadata.original_time` to `ocsf.metadata.original_time`
        sources:
        - ocsf.metadata.original_time
        target: ocsf.metadata.original_time
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `ocsf.metadata.tenant_uid` to `ocsf.metadata.tenant_uid`
        sources:
        - ocsf.metadata.tenant_uid
        target: ocsf.metadata.tenant_uid
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `ocsf.time` to `ocsf.time`
        sources:
        - ocsf.time
        target: ocsf.time
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `ocsf.metadata.event_code` to `ocsf.message`
        sources:
        - ocsf.metadata.event_code
        target: ocsf.message
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `count` to `ocsf.count`
        sources:
        - count
        target: ocsf.count
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `timezone_offset` to `ocsf.timezone_offset`
        sources:
        - timezone_offset
        target: ocsf.timezone_offset
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `automox.error.code`, `status_code` to `ocsf.status_code`
        sources:
        - automox.error.code
        - status_code
        target: ocsf.status_code
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `automox.error.detail`, `status_details` to `ocsf.status_detail`
        sources:
        - automox.error.detail
        - status_details
        target: ocsf.status_detail
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `actor`, `unmapped.actor`, `automox.actor` to `ocsf.actor`
        sources:
        - actor
        - unmapped.actor
        - automox.actor
        target: ocsf.actor
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `actor.user.email_addr`, `unmapped.actor.user.email_addr`, `automox.actor.user.email_addr` to `ocsf.actor.user.name`
        sources:
        - actor.user.email_addr
        - unmapped.actor.user.email_addr
        - automox.actor.user.email_addr
        target: ocsf.actor.user.name
        preserveSource: true
        overrideOnConflict: false
      - type: schema-remapper
        name: Map `user.email_addr` to `ocsf.user.email_addr`
        sources:
        - user.email_addr
        target: ocsf.user.email_addr
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `user.email_addr` to `ocsf.user.name`
        sources:
        - user.email_addr
        target: ocsf.user.name
        preserveSource: true
        overrideOnConflict: false
      - type: schema-remapper
        name: Map `user.uid` to `ocsf.user.uid_alt`
        sources:
        - user.uid
        target: ocsf.user.uid_alt
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `automox.raw.tfa_type` to `ocsf.unmapped.tfa_type`
        sources:
        - automox.raw.tfa_type
        target: ocsf.unmapped.tfa_type
        preserveSource: true
        overrideOnConflict: true
      - type: schema-remapper
        name: Map `raw_data` to `ocsf.raw_data`
        sources:
        - raw_data
        target: ocsf.raw_data
        preserveSource: true
        overrideOnConflict: true
      - type: schema-category-mapper
        name: ocsf.activity_id
        categories:
        - filter:
            query: '@ocsf.metadata.event_code:"User Account 2FA Enabled for Email"'
          name: MFA Factor Enable
          id: 10
        - filter:
            query: '@ocsf.metadata.event_code:"User Account 2FA Enabled for Mobile"'
          name: MFA Factor Enable
          id: 10
        - filter:
            query: '@ocsf.metadata.event_code:"User Account 2FA Disabled"'
          name: MFA Factor Disable
          id: 11
        - filter:
            query: '@type_uid:300101'
          name: Create
          id: 1
        - filter:
            query: '@type_uid:300102'
          name: Enable
          id: 2
        - filter:
            query: '@type_uid:300103'
          name: Password Change
          id: 3
        - filter:
            query: '@type_uid:300104'
          name: Password Reset
          id: 4
        - filter:
            query: '@type_uid:300105'
          name: Disable
          id: 5
        - filter:
            query: '@type_uid:300106'
          name: Delete
          id: 6
        - filter:
            query: '@type_uid:300107'
          name: Attach Policy
          id: 7
        - filter:
            query: '@type_uid:300108'
          name: Detach Policy
          id: 8
        - filter:
            query: '@type_uid:300109'
          name: Lock
          id: 9
        - filter:
            query: '@type_uid:300110'
          name: MFA Factor Enable
          id: 10
        - filter:
            query: '@type_uid:300111'
          name: MFA Factor Disable
          id: 11
        - filter:
            query: '@type_uid:300112'
          name: Unlock
          id: 12
        - filter:
            query: '@activity_id:1'
          name: Create
          id: 1
        - filter:
            query: '@activity_id:2'
          name: Enable
          id: 2
        - filter:
            query: '@activity_id:3'
          name: Password Change
          id: 3
        - filter:
            query: '@activity_id:4'
          name: Password Reset
          id: 4
        - filter:
            query: '@activity_id:5'
          name: Disable
          id: 5
        - filter:
            query: '@activity_id:6'
          name: Delete
          id: 6
        - filter:
            query: '@activity_id:7'
          name: Attach Policy
          id: 7
        - filter:
            query: '@activity_id:8'
          name: Detach Policy
          id: 8
        - filter:
            query: '@activity_id:9'
          name: Lock
          id: 9
        - filter:
            query: '@activity_id:10'
          name: MFA Factor Enable
          id: 10
        - filter:
            query: '@activity_id:11'
          name: MFA Factor Disable
          id: 11
        - filter:
            query: '@activity_id:12'
          name: Unlock
          id: 12
        - filter:
            query: '@ocsf.metadata.event_code:*'
          name: Other
          id: 99
        targets:
          name: ocsf.activity_name
          id: ocsf.activity_id
        fallback:
          values:
            ocsf.activity_id: '99'
            ocsf.activity_name: Other
          sources:
            ocsf.activity_name:
            - ocsf.metadata.event_code
      - type: schema-category-mapper
        name: ocsf.status_id
        categories:
        - filter:
            query: '@automox.error.code:*'
          name: Failure
          id: 2
        - filter:
            query: '@status_id:1'
          name: Success
          id: 1
        - filter:
            query: '@status_id:2'
          name: Failure
          id: 2
        - filter:
            query: '@status_id:99'
          name: Other
          id: 99
        - filter:
            query: '*'
          name: Unknown
          id: 0
        targets:
          name: ocsf.status
          id: ocsf.status_id
        fallback:
          values:
            ocsf.status_id: '99'
            ocsf.status: Other
          sources:
            ocsf.status:
            - status
      - type: schema-category-mapper
        name: ocsf.severity_id
        categories:
        - filter:
            query: '@severity_id:1'
          name: Informational
          id: 1
        - filter:
            query: '@severity_id:2'
          name: Low
          id: 2
        - filter:
            query: '@severity_id:3'
          name: Medium
          id: 3
        - filter:
            query: '@severity_id:4'
          name: High
          id: 4
        - filter:
