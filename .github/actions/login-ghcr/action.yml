name: 'Log in to GHCR'
description: 'Pinned docker/login-action wrapper; the pin lives here so bumping it does not flip the resolution inputs hashed by .builders/inputs_hash.py'
runs:
  using: composite
  steps:
    - name: Log in to GitHub Packages
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
