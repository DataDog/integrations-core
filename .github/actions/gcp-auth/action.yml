name: 'Authenticate to GCP'
description: 'Pinned google-github-actions/auth wrapper; the pin lives here so bumping it does not flip the resolution inputs hashed by .builders/inputs_hash.py'
outputs:
  credentials_file_path:
    description: 'Path of the written credentials file'
    value: ${{ steps.auth.outputs.credentials_file_path }}
runs:
  using: composite
  steps:
    - name: Get credentials
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        project_id: datadog-agent-int-build
        workload_identity_provider: projects/574011472402/locations/global/workloadIdentityPools/github/providers/integrations-core
