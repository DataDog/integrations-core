name: 'Set dependency-wheel-promotion status'
description: 'Pinned actions/github-script wrapper; the pin lives here so bumping it does not flip the resolution inputs hashed by .builders/inputs_hash.py'
inputs:
  needs-resolution:
    description: "Whether the gate decided dependency resolution must run ('true'/'false')"
    required: true
runs:
  using: composite
  steps:
    - name: Set dependency-wheel-promotion status
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const needsResolution = '${{ inputs.needs-resolution }}' === 'true';
          const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
          });

          const openPullRequests = prs.filter(pr => pr.state === 'open');
          let hasResolutionOutput = false;
          for (const pr of openPullRequests) {
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            if (files.some(file => file.filename.startsWith('.deps/'))) {
              hasResolutionOutput = true;
              break;
            }
          }

          const promotionRequired = needsResolution || hasResolutionOutput;
          const promoteTarget = openPullRequests[0]?.html_url ?? '<PR_URL>';
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: promotionRequired ? 'pending' : 'success',
            context: 'dependency-wheel-promotion',
            description: promotionRequired
              ? `Wheels must be promoted to stable before merge. Run: ddev dep promote ${promoteTarget}`
              : 'No dependency resolution needed; promotion not required.',
          });
