name: 'Download artifact'
description: 'Pinned actions/download-artifact wrapper; the pin lives here so bumping it does not flip the resolution inputs hashed by .builders/inputs_hash.py'
inputs:
  name:
    description: 'Artifact name; empty downloads per pattern or all artifacts'
    required: false
    default: ''
  path:
    description: 'Download destination'
    required: true
  pattern:
    description: 'Glob pattern matching artifact names to download'
    required: false
    default: ''
  merge-multiple:
    description: 'Merge multiple matching artifacts into one directory'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Download artifacts
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        pattern: ${{ inputs.pattern }}
        merge-multiple: ${{ inputs.merge-multiple }}
