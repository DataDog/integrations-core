# Runs the Dispatcher end to end on a real pull request, against the real `test-batch.yml`: plan,
# dispatch, poll, download artifacts, correlate, comment.
#
# Restricted to this branch's pull requests, because it exists to observe the round trip rather than
# to test anything. It is deleted once the production `test-dispatch` workflow exists (AI-7129).
#
# Everything the run needs comes from an octo-sts token, so the exchange itself is exercised rather
# than left to the production workflow. The policy is `self.dispatch-poc.pull-request`, scoped to this
# file and granting nothing this job's own `permissions:` block does not already hold.
name: ZZ Dispatch POC

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/zz-dispatch-poc.yml
      # The planner selects targets from changed files, and a workflow file selects none, so the
      # pull request has to touch a target for there to be a batch at all.
      - disk/**

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  dispatch:
    name: dispatch
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      actions: write # dispatch the batch workflow, then read its runs, jobs and artifacts
      statuses: write # the run's aggregate status, posted and settled by this workflow
      pull-requests: write # the run's comment
      contents: read
      id-token: write # the octo-sts exchange
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The planner compares the tested commit against the target branch, so it needs history.
          fetch-depth: 0
          persist-credentials: false

      - name: Get a scoped token
        id: octo-sts
        uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        with:
          scope: DataDog/integrations-core
          policy: self.dispatch-poc.pull-request

      # The run's aggregate result: one per run, whatever the batch count, so it is the one that can
      # eventually be required. A batch's own check cannot be, because `batch-03` only exists on a
      # diff large enough to plan three, and a required check that never reports leaves a small pull
      # request blocked forever.
      #
      # A commit status rather than a check run, because `target_url` is honoured while a check run's
      # `details_url` is overwritten when the run is created from inside a workflow: GitHub points it
      # at the check's own page, which says only that the check started. `Details` here lands on this
      # job, which is where the plan, the batch list and the failure actually are.
      #
      # Posted here and settled by an `if: always()` step rather than by the Dispatcher: GitHub
      # re-evaluates `if` on cancellation and exempts `always()` steps, giving them the server-side
      # cancellation window, while the Dispatcher process is signalled and then killed.
      # On the ambient token, not the octo-sts one: the POC policy grants `checks: write` and this
      # needs `statuses: write`. The production policy takes `statuses: write` in its place, since the
      # Dispatcher no longer writes check runs at all.
      # `.../actions/runs/<id>/job/<job_id>` opens this job with its log, where the run summary needs
      # another click to get to. The numeric job id is not in any context, so it is looked up by name;
      # falling back to the run itself keeps a lookup failure from costing the status its link.
      - name: Resolve this job's URL
        id: job_url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_NAME: ${{ github.job }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
            --jq "[.jobs[] | select(.name == \"${JOB_NAME}\") | .html_url] | first // empty")
          echo "url=${url:-$RUN_URL}" >> "$GITHUB_OUTPUT"

      - name: Mark the run pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOB_URL: ${{ steps.job_url.outputs.url }}
        run: |
          set -euo pipefail
          # The production context is `tests`, which is what branch protection would require. Prefixed
          # here so it cannot be mistaken for it while the POC runs alongside the existing checks.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f "context=zz-dispatch-poc/tests" \
            -f "state=pending" \
            -f "description=Planning and dispatching batches" \
            -f "target_url=${JOB_URL}" \
            --jq '"posted \(.context) as \(.state), pointing at \(.target_url)"'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: ./.github/actions/setup-ddev
        with:
          install-mode: local
          cache-profile: local-ddev-base

      - name: Configure ddev
        run: |
          ddev config set upgrade_check false
          ddev config override

      # `--pr` alone is enough: the head commit, its branch, the base branch and the diff are all read
      # from the API. The batch workflow and its ref default to `test-batch.yml` @ `master`.
      #
      # One target keeps the observed run readable. `disk` plans 2 jobs, one per platform.
      - name: Show the plan
        env:
          DD_GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ddev ci dispatch-tests --pr "$PR_NUMBER" --dry-run

      - name: Dispatch the batches
        id: dispatch
        env:
          DD_GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ddev ci dispatch-tests --pr "$PR_NUMBER" --output-dir dispatcher-output

      # From the dispatch step's own outcome, which is its exit code and already accounts for every
      # batch. Nothing is read from a file: a second source of truth could disagree with the exit
      # code, and a run that wrote `success` and then died would report green.
      - name: Settle the run's aggregate result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          JOB_URL: ${{ steps.job_url.outputs.url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          # A status has no `cancelled`, so a cancelled run reports `failure`: it did not finish, and
          # `pending` would leave the pull request waiting on a run that is already gone.
          case "$DISPATCH_OUTCOME" in
            success) state=success;  description="All batches passed" ;;
            failure) state=failure;  description="A batch failed" ;;
            *)       state=failure;  description="The run did not finish" ;;
          esac

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f "context=zz-dispatch-poc/tests" \
            -f "state=${state}" \
            -f "description=${description}" \
            -f "target_url=${JOB_URL}" \
            --jq '"settled \(.context) as \(.state), pointing at \(.target_url)"'

      - name: Show what the run produced
        if: always()
        run: |
          if [[ -d dispatcher-output ]]; then
            find dispatcher-output -type f | sort
          else
            echo "no output directory"
          fi

      - name: Upload the run's output
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dispatcher-output
          path: dispatcher-output
          if-no-files-found: warn
