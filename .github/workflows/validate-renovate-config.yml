name: Validate Renovate config

on:
  pull_request:
    paths:
      - 'renovate.json'
  push:
    branches:
      - master
    paths:
      - 'renovate.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Renovate config
        run: npx --yes --package renovate renovate-config-validator --strict renovate.json
