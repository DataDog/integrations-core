name: Save GitHub event

on:
  workflow_call:
    inputs:
      retention-days:
        required: false
        default: 1
        type: number

jobs:
  save-event:
    name: Save event
    runs-on: ubuntu-22.04

    steps:
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: github-event
        path: ${{ github.event_path }}
        retention-days: ${{ inputs.retention-days }}
