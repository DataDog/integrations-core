name: Dependency Wheel Promotion Gate

on:
  pull_request_target:
    branches:
    - master
    - 7.*.*
  merge_group:
    types: [checks_requested]

# Comment upserts are not atomic, so gate runs for one PR must be serialized.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Set dependency-wheel-promotion status
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-22.04
    permissions:
      statuses: write
      contents: read
      pull-requests: write
    env:
      PROMOTION_GATE_STATE: ${{ runner.temp }}/dependency-wheel-promotion-gate.json
    steps:
    # This job has write permissions, so only execute the event's trusted base code.
    - name: Checkout trusted gate tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        persist-credentials: false
        sparse-checkout: |
          .builders/dependency_inputs.py
          .builders/dependency_wheel_promotion_gate.py
          .builders/promote.py
        sparse-checkout-cone-mode: false

    - name: Assess the pull request
      id: assess
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 .builders/dependency_wheel_promotion_gate.py assess

    # The PR checkout is parsed as lockfile data and is never imported or executed.
    - name: Checkout the pull request's lockfiles
      id: lockfiles
      if: steps.assess.outputs.evaluate == 'true' && steps.assess.outputs.check_promotion == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: pr
        persist-credentials: false
        sparse-checkout: .deps/resolved
        sparse-checkout-cone-mode: false

    - name: Check whether the wheels are already promoted
      id: verify
      if: steps.lockfiles.outcome == 'success'
      env:
        PROMOTE_LOCKFILE_DIR: pr/.deps/resolved
      run: python3 .builders/promote.py --verify

    - name: Publish the promotion state
      if: always() && steps.assess.outcome == 'success' && steps.assess.outputs.evaluate == 'true'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        LOCKFILES_OUTCOME: ${{ steps.lockfiles.outcome }}
        VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        PROMOTED: ${{ steps.verify.outputs.promoted }}
      run: python3 .builders/dependency_wheel_promotion_gate.py finish

  merge-queue:
    name: Set dependency-wheel-promotion status for merge queue
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-22.04
    permissions:
      statuses: write
      contents: read
    steps:
    - name: Checkout trusted gate tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.merge_group.base_sha }}
        persist-credentials: false
        sparse-checkout: |
          .builders/dependency_inputs.py
          .builders/dependency_wheel_promotion_gate.py
        sparse-checkout-cone-mode: false

    # Entry into the queue means the required context already passed on every PR head.
    - name: Set dependency-wheel-promotion status to success
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 .builders/dependency_wheel_promotion_gate.py merge-queue
