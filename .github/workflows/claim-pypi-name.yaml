# This workflow claims package names on PyPI for our integrations by publishing placeholder packages whose
# README and only module point to the Agent integration-management docs:
# https://docs.datadoghq.com/agent/guide/integration-management/?tab=linux#install
# The working packages can be found here:
# https://dd-integrations-core-wheels-build-stable.datadoghq.com/targets/simple/index.html
# This is a work-around until PyPI adds support for namespaces and we claim an entire namespace for Datadog.
name: Build Placeholder PyPI Packages

on:
  schedule:
    # At 3AM UTC
    # Running this every night strikes a good balance between claiming names fast without spamming PyPI with requests.
    - cron: "0 3 * * *"

env:
  PYTHON_VERSION: "3.13"

defaults:
  run:
    shell: bash


jobs:
  find-new-integrations:
    name: Find packages to publish
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      packages: ${{ steps.find.outputs.packages }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "${{ env.PYTHON_VERSION }}"

    - name: Find new and outdated packages
      id: find
      run: |
        python - <<'EOF'
        import json
        import os
        import pathlib
        import sys
        import tomllib
        import urllib.error
        import urllib.request

        packages = []
        for pyproject in sorted(pathlib.Path('.').glob('*/pyproject.toml')):
            if pyproject.parent.name.startswith('.'):
                continue
            name = tomllib.loads(pyproject.read_text())['project']['name']
            try:
                with urllib.request.urlopen(f'https://pypi.org/pypi/{name}/json', timeout=30) as response:
                    latest = json.load(response)['info']['version']
            except urllib.error.HTTPError as error:
                if error.code == 404:
                    latest = None
                else:
                    print(f'PyPI returned unexpected HTTP status {error.code} for package {name}. Please re-run this job.', file=sys.stderr)
                    sys.exit(1)
            if latest in (None, '0.0.1'):
                packages.append(name)

        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'packages={json.dumps(packages)}\n')
        EOF

  publish:
    name: Publish ${{ matrix.package }}
    needs: find-new-integrations
    if: needs.find-new-integrations.outputs.packages != '[]'
    runs-on: ubuntu-latest

    environment: publish-pypi

    permissions:
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.find-new-integrations.outputs.packages) }}

    steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "${{ env.PYTHON_VERSION }}"

    - name: Install Build Deps
      run: pip install -U build[virtualenv] hatchling

    - name: Build Package
      env:
        PACKAGE_NAME: ${{ matrix.package }}
      run: |
        MODULE_NAME=$(echo "${PACKAGE_NAME}" | tr - _)
        mkdir -p dist "pkg_placeholder/${MODULE_NAME}"
        cat > pkg_placeholder/README.md << EOF
        This package is a placeholder. It exists only to reserve the name on PyPI and contains no functional code.

        Datadog integrations are installed and managed with the Datadog Agent, not with pip:
        https://docs.datadoghq.com/agent/guide/integration-management/?tab=linux#install
        EOF
        cat > "pkg_placeholder/${MODULE_NAME}/__init__.py" << EOF
        print("This package is a placeholder. Install Datadog integrations with the Datadog Agent: https://docs.datadoghq.com/agent/guide/integration-management/?tab=linux#install")
        EOF
        cat > pkg_placeholder/pyproject.toml << EOF
        [build-system]
        requires = ["hatchling"]
        build-backend = "hatchling.build"
        [project]
        name = "${PACKAGE_NAME}"
        version = "0.0.2"
        readme = "README.md"
        [tool.hatch.build.targets.wheel]
        only-include = ["${MODULE_NAME}"]
        EOF
        python -m build --no-isolation --wheel pkg_placeholder
        mv pkg_placeholder/dist/* dist/

    - name: Push Python artifacts to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        verbose: true
        skip-existing: true
