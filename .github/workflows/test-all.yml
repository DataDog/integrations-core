name: Test all

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string

      python-version:
        required: false
        default: ""
        type: string
      standard:
        required: false
        default: false
        type: boolean
      latest:
        required: false
        default: false
        type: boolean
      minimum-base-package:
        required: false
        default: false
        type: boolean
      test-py2:
        required: false
        default: false
        type: boolean
      test-py3:
        required: false
        default: true
        type: boolean
      agent-image:
        required: false
        default: "registry.datadoghq.com/agent-dev:master-py3"
        type: string
      agent-image-py2:
        required: false
        default: "registry.datadoghq.com/agent:6-rc"
        type: string
      agent-image-windows:
        required: false
        default: "registry.datadoghq.com/agent:7-rc-servercore"
        type: string
      agent-image-windows-py2:
        required: false
        default: "datadog/agent-dev:master-py2-win-servercore"
        type: string
      pytest-args:
        description: "Arguments to pass to pytest"
        required: false
        type: string
        default: ""
      skip-ddev-tests:
        required: false
        default: false
        type: boolean
      context:
        required: false
        default: "standard"
        type: string

permissions:
  # needed for compute-matrix in test-target.yml
  contents: read
  # needed for dd-sts in test-target.yml
  id-token: write

jobs:
  jd316aba:
    uses: DataDog/integrations-core/.github/workflows/test-target.yml@master
    with:
      job-name: ddev on Linux
      target: ddev
      platform: linux
      runner: '["ubuntu-22.04"]'
      repo: "${{ inputs.repo }}"
      context: ${{ inputs.context }}
      python-version: "${{ inputs.python-version }}"
      latest: ${{ inputs.latest }}
      agent-image: "${{ inputs.agent-image }}"
      agent-image-py2: "${{ inputs.agent-image-py2 }}"
      agent-image-windows: "${{ inputs.agent-image-windows }}"
      agent-image-windows-py2: "${{ inputs.agent-image-windows-py2 }}"
      test-py2: ${{ inputs.test-py2 }}
      test-py3: ${{ inputs.test-py3 }}
      setup-env-vars: "${{ inputs.setup-env-vars }}"
    secrets: inherit
    if: ${{ inputs.skip-ddev-tests == false }}
  jb232c8c:
    uses: DataDog/integrations-core/.github/workflows/test-target.yml@master
    with:
      job-name: Datadog Checks Base on Linux
