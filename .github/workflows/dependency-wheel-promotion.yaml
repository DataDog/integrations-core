name: Dependency Wheel Promotion
run-name: "Promote wheels for PR #${{ inputs.pr_number }} (${{ github.actor }})"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to promote wheels for
        required: true
        type: number
      head_sha:
        description: Head SHA of the PR branch
        required: true
        type: string

env:
  DOCS_URL: https://datadoghq.atlassian.net/wiki/spaces/AI/pages/6182240746/Dependency+Updates
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}
  # Shared with dependency-wheel-promotion-gate.yaml, and keyed on the PR rather
  # than the commit, so this run updates the notice that workflow posts when the
  # check first goes pending instead of adding another comment.
  PROMOTION_COMMENT_MARKER: <!-- dependency-wheel-promotion pr=${{ inputs.pr_number }} -->

jobs:
  promote:
    name: Promote dependency wheels from dev to stable
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      statuses: write
      pull-requests: write

    steps:
    # Promoting a commit that is no longer the PR head cannot turn the head's
    # check green, so the operator has to promote again either way. Failing here
    # tells them that instead of reporting a green run that changed nothing.
    - name: Check the promoted commit is the PR head
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr_number }}
        HEAD_SHA: ${{ inputs.head_sha }}
        PROMOTE_COMMAND: ddev dep promote ${{ env.PR_URL }}
      run: |
        set -euo pipefail
        current=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)
        if [[ "${current}" != "${HEAD_SHA}" ]]; then
          echo "::error::${HEAD_SHA} is no longer the head of PR #${PR_NUMBER} (now ${current}). Promote the current head instead: ${PROMOTE_COMMAND}"
          exit 1
        fi
        echo "${HEAD_SHA} is the current head of PR #${PR_NUMBER}."

    - name: Checkout trusted code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Find existing lifecycle comment
      id: find_comment
      uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
      with:
        issue-number: ${{ inputs.pr_number }}
        comment-author: 'github-actions[bot]'
        body-includes: ${{ env.PROMOTION_COMMENT_MARKER }}

    - name: Post lifecycle comment (started)
      id: started_comment
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.pr_number }}
        comment-id: ${{ steps.find_comment.outputs.comment-id }}
        edit-mode: replace
        body: |
          ${{ env.PROMOTION_COMMENT_MARKER }}
          > [!WARNING]
          > **Wheel promotion is running. Do not merge until `dependency-wheel-promotion` is green.**
          >
          > Promoting wheels from `dev` to `stable` for commit `${{ inputs.head_sha }}`, started by @${{ github.actor }}. Follow the [workflow run](${{ env.RUN_URL }}).
          >
          > <sub>Full process: [Dependency Updates](${{ env.DOCS_URL }}).</sub>

    - name: Checkout PR lockfiles only
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ inputs.head_sha }}
        path: pr
        sparse-checkout: |
          .deps/resolved
        sparse-checkout-cone-mode: false

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: pip install -r .builders/deps/host_dependencies.txt

    - name: Get credentials
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        project_id: datadog-agent-int-build
        workload_identity_provider: projects/574011472402/locations/global/workloadIdentityPools/github/providers/integrations-core

    - name: Promote wheels
      env:
        PROMOTE_LOCKFILE_DIR: pr/.deps/resolved
      run: python .builders/promote.py

    - name: Clean up credentials
      if: always()
      run: rm -f ${{ steps.auth.outputs.credentials_file_path }}

    # The head can move while the wheels are being copied, and by then the gate
    # has rewritten the shared comment for the new head. Editing it from here
    # would replace that warning with the outcome for a commit that is no longer
    # being merged, so the comment steps below stand down instead.
    - name: Check the promoted commit is still the PR head
      id: still_head
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr_number }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        set -euo pipefail
        current=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)
        if [[ "${current}" == "${HEAD_SHA}" ]]; then
          echo "value=true" >> "${GITHUB_OUTPUT}"
        else
          echo "value=false" >> "${GITHUB_OUTPUT}"
          echo "::notice::${HEAD_SHA} is no longer the head of PR #${PR_NUMBER} (now ${current}). Leaving the PR comment alone."
        fi

    - name: Set dependency-wheel-promotion status to success
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        HEAD_SHA: ${{ inputs.head_sha }}
      with:
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: process.env.HEAD_SHA,
            state: 'success',
            context: 'dependency-wheel-promotion',
            description: 'Wheels promoted to stable storage.',
            target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
          });

    - name: Update lifecycle comment (success)
      if: success() && steps.still_head.outputs.value == 'true'
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.pr_number }}
        comment-id: ${{ steps.started_comment.outputs.comment-id }}
        edit-mode: replace
        body: |
          ${{ env.PROMOTION_COMMENT_MARKER }}
          Wheels promoted to stable storage for commit `${{ inputs.head_sha }}` by @${{ github.actor }} in this [workflow run](${{ env.RUN_URL }}).

          `dependency-wheel-promotion` is green for that commit. Pushing again sends the check back to pending, and the new head has to be promoted before merging.

          <sub>Full process: [Dependency Updates](${{ env.DOCS_URL }}).</sub>

    - name: Set dependency-wheel-promotion status to error
      if: failure() && steps.still_head.outputs.value == 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        HEAD_SHA: ${{ inputs.head_sha }}
      with:
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: process.env.HEAD_SHA,
            state: 'error',
            context: 'dependency-wheel-promotion',
            description: 'Wheel promotion failed. Check the Actions tab for details.',
            target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
          });

    - name: Update lifecycle comment (failure)
      if: failure() && steps.still_head.outputs.value == 'true'
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.pr_number }}
        comment-id: ${{ steps.started_comment.outputs.comment-id }}
        edit-mode: replace
        body: |
          ${{ env.PROMOTION_COMMENT_MARKER }}
          > [!CAUTION]
          > **Wheel promotion failed. Do not merge: `dependency-wheel-promotion` will not go green until a promotion succeeds.**
          >
          > Promotion of commit `${{ inputs.head_sha }}`, started by @${{ github.actor }}, failed in this [workflow run](${{ env.RUN_URL }}).
          >
          > Check the logs, then retry with:
          > ```
          > ddev dep promote ${{ env.PR_URL }}
          > ```
          >
          > <sub>Full process: [Dependency Updates](${{ env.DOCS_URL }}).</sub>
