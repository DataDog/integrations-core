name: Test Agent release

on:
  workflow_dispatch:
    inputs:
      test-py3:
        required: false
        description: Run Python 3 tests
        default: true
        type: boolean
      agent-image:
        required: false
        description: Agent 7 image
        default: "registry.datadoghq.com/agent:7-rc"
        type: string
      agent-image-windows:
        required: false
        description: Agent 7 image on Windows
        default: "registry.datadoghq.com/agent:7-rc-servercore"
        type: string
      test-py2:
        required: false
        description: Run Python 2 tests
        default: false
        type: boolean
      agent-image-py2:
        required: false
        description: Agent 6 image
        default: "registry.datadoghq.com/agent:6-rc"
        type: string
      agent-image-windows-py2:
        required: false
        description: Agent 6 image on Windows
        default: "datadog/agent-dev:master-py2-win-servercore"
        type: string
      target:
        required: false
        description: Integration to test through the Dispatcher, e.g. "ntp". By default tests all
        default: ""
        type: string

jobs:
  test:
    uses: ./.github/workflows/test-all.yml
    with:
      repo: core

      # Options
      test-py2: ${{ inputs.test-py2 }}
      test-py3: ${{ inputs.test-py3 }}
      agent-image: "${{ inputs.agent-image }}"
      agent-image-py2: "${{ inputs.agent-image-py2 }}"
      agent-image-windows: "${{ inputs.agent-image-windows }}"
      agent-image-windows-py2: "${{ inputs.agent-image-windows-py2 }}"
      skip-ddev-tests: true
      context: "test-agent"
    secrets: inherit
    permissions:
       # needed for compute-matrix in test-target.yml
       contents: read
       # needed for dd-sts in test-target.yml
       id-token: write

  # Shadow mode: the same images tested through the Dispatcher, alongside the legacy job above. It
  # reports only its own `Dispatcher (test-agent)` statuses, and `blocking: false` keeps its failures
  # from failing this workflow.
  dispatcher:
    uses: DataDog/integrations-core/.github/workflows/test-dispatch.yml@master
    with:
      # A tag supplies its own commit, so exactly one of the two is passed.
      checkout_sha: ${{ github.ref_type == 'branch' && github.sha || '' }}
      head-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      # `all` and `targets` are incompatible, so an explicit target replaces the full run.
      all: ${{ inputs.target == '' }}
      targets: ${{ inputs.target }}
      exclude-targets: ${{ inputs.target == '' && 'ddev' || '' }}
      context: test-agent
      agent-image: ${{ inputs.agent-image }}
      agent-image-windows: ${{ inputs.agent-image-windows }}
      blocking: false
    permissions:
      contents: read
      # The Dispatcher's octo-sts and dd-sts exchanges
      id-token: write
