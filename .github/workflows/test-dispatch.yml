# The Dispatcher executes trusted master code while the planner and test-batch jobs read the PR's merge tree.
name: Test Dispatch

on:
  push:
    branches:
      - master

  workflow_run:
    workflows:
      - Test Dispatch Trigger
    types:
      - completed

  # Callers reference this file at `@master`, so a caller on a release branch or tag runs master's
  # Dispatcher against its own commit. Caller and callee must not share a concurrency group string, or
  # the run cancels itself.
  workflow_call:
    inputs:
      commit:
        description: "Full SHA of the commit to test"
        required: true
        type: string
      all:
        description: "Test every eligible target. Cannot be combined with `targets`"
        required: false
        default: false
        type: boolean
      targets:
        description: "Comma-separated targets to test, with all their environments"
        required: false
        default: ""
        type: string
      exclude-targets:
        description: "Comma-separated targets to remove from the selection"
        required: false
        default: ""
        type: string
      pytest-args:
        description: "Arguments every job appends to pytest"
        required: false
        default: '-m "not flaky"'
        type: string
      context:
        description: "What the run is for, such as `nightly` or `test-agent`. Keeps runs on one commit apart"
        required: true
        type: string
      agent-image:
        description: "Agent image for every Linux E2E job"
        required: false
        default: ""
        type: string
      agent-image-windows:
        description: "Agent image for every Windows E2E job"
        required: false
        default: ""
        type: string
      blocking:
        description: "Whether a failing run fails the caller. `false` in shadow mode"
        required: false
        default: true
        type: boolean

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  dispatch:
    name: dispatch
    runs-on: ubuntu-22.04
    # Allow cleanup after the Dispatcher's three-hour ceiling.
    timeout-minutes: 185
    permissions:
      contents: read
      id-token: write # the octo-sts exchange; every write happens with the scoped token
    # `inputs` is empty unless the workflow is called, and `github.event_name` is then the caller's
    # event, so `toJSON(inputs) != '{}'` identifies a called run wherever the `CALLED` variable is not
    # available. An empty `context` therefore still counts as called, and the validation step rejects it.
    # A caller cannot set `continue-on-error` on a job that calls a reusable workflow, so shadow-mode
    # callers ask for it here.
    continue-on-error: ${{ toJSON(inputs) != '{}' && !inputs.blocking }}

    # One source branch maps to one PR. Include the repository for forks and omit the SHA so a new
    # revision cancels the previous Dispatcher. Master pushes and called runs keep independent runs.
    # Keep concurrency at job level: workflow_run also fires for canceled triggers, whose skipped
    # jobs must not cancel newer triggers.
    concurrency:
      group: test-dispatch-${{
        toJSON(inputs) != '{}' && format('{0}-{1}', inputs.context, github.run_id) ||
        github.event_name == 'workflow_run' && format('pr-{0}/{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) ||
        format('master-{0}', github.run_id) }}
      cancel-in-progress: true

    env:
      CALLED: ${{ toJSON(inputs) != '{}' }}
      # The PR status keeps one stable name because it becomes a required check at takeover. Other runs
      # are named by context, so runs on one commit do not overwrite each other's status.
      STATUS_CONTEXT: ${{
        toJSON(inputs) == '{}' && github.event_name == 'workflow_run' && 'Dispatcher / tests (beta, non-blocking)' ||
        format('Dispatcher ({0}) / tests (beta, non-blocking)', inputs.context || 'master') }}
      HEAD_SHA: ${{
        toJSON(inputs) != '{}' && inputs.commit ||
        github.event_name == 'workflow_run' && github.event.workflow_run.head_sha ||
        github.sha }}

    if: >-
      github.repository == 'DataDog/integrations-core'
      && (
        toJSON(inputs) != '{}'
        || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        || (
          github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'pull_request'
        )
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run and called runs execute current trusted code. A push tests that exact master revision.
          ref: ${{ (env.CALLED == 'true' || github.event_name == 'workflow_run') && 'refs/heads/master' || github.sha }}
          fetch-depth: ${{ (env.CALLED == 'true' || github.event_name == 'workflow_run') && 1 || 2 }}
          persist-credentials: false

      # Commit resolution records the local branch, but checking out a SHA leaves it detached.
      - name: Attribute the pushed checkout to master
        if: github.event_name == 'push' && env.CALLED != 'true'
        run: git checkout -B master

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up ddev
        uses: ./.github/actions/setup-ddev
        with:
          install-mode: local
          cache-profile: local-ddev-base

      - name: Configure the trusted checkout
        run: |
          set -euo pipefail
          ddev config set upgrade_check false
          ddev config override

      # Reject a malformed context before anything is checked out, credentialed, posted or dispatched.
      # It is forwarded as a single `context:VALUE` tag, and it names the run's statuses and concurrency.
      - name: Validate the called run's inputs
        if: env.CALLED == 'true'
        env:
          RUN_CONTEXT: ${{ inputs.context }}
        run: ddev ci tests validate-inputs --context "$RUN_CONTEXT"

      # Data for trusted ddev to parse; its code is executed only by test-batch. Depth 2 holds the
      # first parent, which a change-based run diffs against.
      - name: Check out the tested commit
        if: env.CALLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          path: dispatcher-planning-repo
          fetch-depth: 2
          persist-credentials: false

      # Commit resolution records the local branch, so results are attributed to the caller's ref.
      - name: Attribute the tested commit to the caller's ref
        if: env.CALLED == 'true'
        env:
          CALLER_REF: ${{ github.ref_name }}
        run: git -C dispatcher-planning-repo checkout -q -B "$CALLER_REF"

      - name: Get a scoped token
        id: octo-sts
        uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        with:
          scope: DataDog/integrations-core
          policy: self.test-dispatch

      - name: Mark the run pending
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Refusing to post the pending status: no scoped token or full SHA."
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f "context=${STATUS_CONTEXT}" \
            -f "state=pending" \
            -f "description=Planning and dispatching batches" \
            -f "target_url=${RUN_URL}" \
            --jq '"posted \(.context) as \(.state), pointing at \(.target_url)"'

      - name: Resolve the run
        env:
          DD_GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PUSH_SHA: ${{ github.sha }}
          COMMIT: ${{ inputs.commit }}
          ALL_TARGETS: ${{ inputs.all }}
          TARGETS: ${{ inputs.targets }}
          EXCLUDE_TARGETS: ${{ inputs.exclude-targets }}
          RUN_CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          args=(
            ci dispatch-tests
            --resolve-only
            --repo DataDog/integrations-core
            --output-dir "$GITHUB_WORKSPACE/dispatcher-output"
          )
          if [[ "$CALLED" == true ]]; then
            # Resolve from the tested tree, whose branch is the caller's ref.
            cd "$GITHUB_WORKSPACE/dispatcher-planning-repo"
            ddev config override
            args+=(--commit "$COMMIT" --tags "context:${RUN_CONTEXT}")
            if [[ "$ALL_TARGETS" == true ]]; then
              args+=(--all)
            fi
            if [[ -n "$TARGETS" ]]; then
              args+=(--targets "$TARGETS")
            fi
            if [[ -n "$EXCLUDE_TARGETS" ]]; then
              args+=(--exclude-targets "$EXCLUDE_TARGETS")
            fi
          elif [[ "$EVENT_NAME" == workflow_run ]]; then
            args+=(
              --pr-head-repo "$HEAD_REPO"
              --pr-head-branch "$HEAD_BRANCH"
              --pr-head-sha "$HEAD_SHA"
            )
          else
            args+=(--commit "$PUSH_SHA")
          fi
          ddev "${args[@]}"

      - name: Read the resolved run
        id: resolved
        run: |
          set -euo pipefail
          manifest=$GITHUB_WORKSPACE/dispatcher-output/run.json
          if [[ ! -f "$manifest" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          repository=$(jq -er '.repository' "$manifest")
          checkout_sha=$(jq -er '.checkout_sha' "$manifest")
          head_sha=$(jq -er '.head_sha' "$manifest")
          head_branch=$(jq -er '.head_branch' "$manifest")
          pr_number=$(jq -r '.pr_number // empty' "$manifest")
          base_branch=$(jq -r '.base_branch // empty' "$manifest")
          base_sha=$(jq -r '.base_sha // empty' "$manifest")
          context=$(jq -er '.context' "$manifest")

          echo "Resolved run:"
          jq . "$manifest"

          {
            echo "available=true"
            echo "checkout_sha=$checkout_sha"
            echo "head_sha=$head_sha"
            echo "head_branch=$head_branch"
            echo "pr_number=$pr_number"
            echo "base_branch=$base_branch"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Resolved run"
            echo
            if [[ -n "$pr_number" ]]; then
              echo "- Run type: Pull request"
              echo "- Pull request: <${GITHUB_SERVER_URL}/${repository}/pull/${pr_number}>"
            else
              echo "- Run type: Commit (\`${context}\`)"
            fi
            echo "- Head branch: \`${head_branch}\`"
            echo "- Head SHA: [\`${head_sha}\`](${GITHUB_SERVER_URL}/${repository}/commit/${head_sha})"
            echo "- Checkout SHA: [\`${checkout_sha}\`](${GITHUB_SERVER_URL}/${repository}/commit/${checkout_sha})"
            if [[ -n "$base_branch" ]]; then
              echo "- Base branch: \`${base_branch}\`"
              echo "- Base SHA: [\`${base_sha}\`](${GITHUB_SERVER_URL}/${repository}/commit/${base_sha})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the planning tree
        if: steps.resolved.outputs.pr_number != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Data for trusted ddev to parse; its code is executed only by test-batch. Depth 2 holds
          # the merge's first parent, which the run's diff is computed against.
          ref: ${{ steps.resolved.outputs.checkout_sha }}
          path: dispatcher-planning-repo
          fetch-depth: 2
          persist-credentials: false

      - name: Get Datadog credentials
        id: dd-sts
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: integrations-dispatcher-api-key

      - name: Configure Datadog
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
        run: |
          set -euo pipefail
          # The key and site are stored for future Dispatcher monitoring; dispatching does not use them.
          ddev config set orgs.default.api_key "$DD_API_KEY"
          ddev config set orgs.default.site datadoghq.com

      - name: Plan and dispatch the batches
        id: dispatch
        env:
          DD_GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          RESOLVED: ${{ steps.resolved.outputs.available }}
          PR_NUMBER: ${{ steps.resolved.outputs.pr_number }}
          PYTEST_ARGS: ${{ inputs.pytest-args }}
          AGENT_IMAGE: ${{ inputs.agent-image }}
          AGENT_IMAGE_WINDOWS: ${{ inputs.agent-image-windows }}
        run: |
          set -euo pipefail
          if [[ "$RESOLVED" != true ]]; then
            echo "No run remains to test."
            exit 0
          fi

          planning_repo=$GITHUB_WORKSPACE
          if [[ -n "$PR_NUMBER" || "$CALLED" == true ]]; then
            planning_repo=$GITHUB_WORKSPACE/dispatcher-planning-repo
          fi
          cd "$planning_repo"
          ddev config override

          if [[ "$CALLED" != true ]]; then
            PYTEST_ARGS='-m "not flaky"'
          fi
          args=(
            ci dispatch-tests
            --run-manifest "$GITHUB_WORKSPACE/dispatcher-output/run.json"
            --repo DataDog/integrations-core
            --workflow test-batch.yml
            --workflow-ref master
            --output-dir "$GITHUB_WORKSPACE/dispatcher-output"
            --minimum-base-package
          )
          if [[ -n "$PYTEST_ARGS" ]]; then
            args+=(--pytest-args "$PYTEST_ARGS")
          fi
          if [[ -n "$AGENT_IMAGE" ]]; then
            args+=(--agent-image "$AGENT_IMAGE")
          fi
          if [[ -n "$AGENT_IMAGE_WINDOWS" ]]; then
            args+=(--agent-image-windows "$AGENT_IMAGE_WINDOWS")
          fi
          # Deliver cancellation signals directly to ddev's cleanup handler.
          exec ddev "${args[@]}"

      # Settle pending statuses even after cancellation or setup failure.
      - name: Settle the run's aggregate result
        if: always()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Refusing to settle the status: no scoped token or full SHA."
            exit 1
          fi
          state=failure
          description="Test dispatch did not complete"
          if [[ "$DISPATCH_OUTCOME" == success ]]; then
            state=success
            description="Test dispatch completed"
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f "context=${STATUS_CONTEXT}" \
            -f "state=${state}" \
            -f "description=${description}" \
            -f "target_url=${RUN_URL}" \
            --jq '"settled \(.context) as \(.state), pointing at \(.target_url)"'

      - name: Prepare coverage upload
        id: coverage
        if: always() && steps.resolved.outputs.available == 'true'
        continue-on-error: true
        env:
          CHECKOUT_SHA: ${{ steps.resolved.outputs.checkout_sha }}
          PR_NUMBER: ${{ steps.resolved.outputs.pr_number }}
        run: |
          set -euo pipefail
          coverage_dir=$GITHUB_WORKSPACE/dispatcher-output/results/coverage
          if [[ ! -d "$coverage_dir" ]] || [[ -z "$(find "$coverage_dir" -type f -name '*.xml' -print -quit)" ]]; then
            exit 0
          fi
          if [[ -n "$PR_NUMBER" || "$CALLED" == true ]]; then
            # The uploader reads repository metadata, so use the same tree that produced the reports.
            git fetch --no-tags --depth=2 origin "$CHECKOUT_SHA"
            git checkout --detach "$CHECKOUT_SHA"
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Datadog
        if: always() && steps.coverage.outputs.available == 'true'
        continue-on-error: true
        uses: DataDog/coverage-upload-github-action@6c4bd935248daa6f0ef94e3e6ba71ad5ad079998 # v1.0.3
        env:
          DD_GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          DD_GIT_COMMIT_SHA: ${{ steps.resolved.outputs.checkout_sha }}
          DD_GIT_COMMIT_HEAD_SHA: ${{ steps.resolved.outputs.pr_number != '' && steps.resolved.outputs.head_sha || '' }}
          DD_GIT_BRANCH: ${{ steps.resolved.outputs.head_branch }}
          DD_GIT_PULL_REQUEST_BASE_BRANCH: ${{ steps.resolved.outputs.base_branch }}
          DD_GIT_PULL_REQUEST_BASE_BRANCH_SHA: ${{ steps.resolved.outputs.base_sha }}
          DD_PR_NUMBER: ${{ steps.resolved.outputs.pr_number }}
        with:
          api_key: ${{ steps.dd-sts.outputs.api_key }}
          files: dispatcher-output/results/coverage
          format: cobertura

      - name: Show what the run produced
        if: always()
        run: |
          if [[ -d dispatcher-output ]]; then
            find dispatcher-output -type f | sort
          else
            echo "no output directory"
          fi

      - name: Upload the run's output
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dispatcher-output
          path: dispatcher-output
          if-no-files-found: warn
