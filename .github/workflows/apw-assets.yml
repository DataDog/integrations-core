name: APW asset release

on:
  pull_request:
    paths:
      - .github/workflows/apw-assets.yml
      - scripts/apw/**
  workflow_dispatch:
  schedule:
    # Every 15 minutes, offset from the busiest start-of-hour period.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: apw-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      packaged: ${{ steps.export.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test packaging and release handling
        run: python3 -m unittest discover -s scripts/apw -p 'test_*apw_assets.py' -v
      - name: Check for a complete release
        id: release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/apw/release_apw_assets.py check --commit "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Export committed assets
        id: export
        if: steps.release.outputs.package != 'false'
        run: python3 scripts/apw/package_apw_assets.py --commit "$GITHUB_SHA" --output dist
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: steps.export.outcome == 'success'
        with:
          name: apw-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    # Only scheduled runs and manual dispatches from reviewed master can publish.
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master' && needs.package.outputs.packaged == 'true'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: apw-assets
          path: dist
      - name: Verify and publish asset release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/apw/release_apw_assets.py publish --commit "$GITHUB_SHA" --directory dist
