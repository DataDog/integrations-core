name: Trigger Wheel Builds

# The GitLab release-auto job owns tag creation. This receiver delegates
# detection, validation, and wheel dispatch to release-dispatch.yml.
# Equivalent trigger workflows exist in integrations-extras and marketplace.

on:
  # Automatic push triggering is intentionally disabled so that GitLab is the only
  # tag writer. The GitLab release-auto job dispatches this workflow with the exact
  # tagged SHA after pushing all tags (.gitlab/tagger/dispatch-wheel-publishing.sh).
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Packages to release. JSON array (e.g. '["postgres","datadog_checks_base"]'),
          or omit to auto-detect from tags pointing at the specified ref.
        required: false
        type: string
      source-repo-ref:
        description: "Commit SHA or ref to build from"
        required: true
        type: string
      source-repo-branch:
        description: "Branch that contains source-repo-ref, used to determine stable vs pre-release behavior"
        required: true
        type: string
      dry-run:
        description: "Print what would be released without starting builds"
        required: false
        type: boolean
        default: false
      ddev-version:
        description: "ddev version, pinned by default."
        required: false
        type: string

concurrency:
  group: release-${{ inputs.source-repo-ref }}
  cancel-in-progress: false

jobs:
  context:
    name: Detect release context
    runs-on: ubuntu-latest
    outputs:
      is-stable-release: ${{ steps.detect.outputs.is-stable-release }}
    steps:
      - id: detect
        # Stable for master/X.Y.x, pre-release for alpha/beta/rc branches.
        # Uses source-repo-branch instead of GITHUB_REF so the release behavior
        # follows the branch that contains source-repo-ref.
        env:
          RELEASE_BRANCH: ${{ inputs.source-repo-branch }}
        run: |
          branch="${RELEASE_BRANCH#refs/heads/}"
          if [[ "$branch" =~ ^(master|[0-9]+\.[0-9]+\.x)$ ]]; then
            echo "is-stable-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-stable-release=false" >> "$GITHUB_OUTPUT"
          fi

  notify:
    name: Notify release starting
    needs: context
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # federate a Datadog app key via dd-sts
      contents: read
    steps:
      - name: Checkout notification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .github/workflows/scripts
      - name: Get Datadog credentials
        id: dd-sts
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: integrations-core-release-notifications
      # dd-sts mints a new application key per run, and using it within ~1s is
      # often rejected with HTTP 403 by the workflow API. agent-integrations-tuf
      # uses the same workflow and an equivalent policy, posts 4-10s after
      # minting (setup-uv + uv sync in between), and has never failed.
      - name: Wait for Datadog application key to become usable
        run: sleep 10
      - name: Notify release starting via Datadog workflow
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          DD_APP_KEY: ${{ steps.dd-sts.outputs.app_key }}
          DD_WORKFLOW_ID: 8f4e31b8-8a2a-4e46-a0c3-9a25c989108e
          SOURCE_REPO: integrations-core
          REF: ${{ inputs.source-repo-ref }}
          PACKAGES: ${{ inputs.packages || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/workflows/scripts/notify_release.py

  dispatch:
    name: Release
    needs: context
    uses: ./.github/workflows/release-dispatch.yml
    with:
      source-repo: integrations-core
      packages: ${{ inputs.packages || '' }}
      source-repo-ref: ${{ inputs.source-repo-ref }}
      source-repo-branch: ${{ inputs.source-repo-branch }}
      create-tags: false
      dry-run: ${{ inputs.dry-run || false }}
      ddev-version: ${{ inputs.ddev-version || '' }}
      is-stable-release: ${{ needs.context.outputs.is-stable-release }}
    permissions:
      id-token: write
      contents: read
