name: Test Dispatch Trigger

# Completion signal for the Test Dispatch receiver, which watches for successful completed
# runs of this workflow by name and then plans and runs the pull request's tests. Reruns
# start another attempt. This workflow carries no privileges and runs nothing from the PR.

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

# Shares the PR concurrency group with Test Dispatch so a new revision queues this trigger
# and immediately cancels the superseded Dispatcher run, instead of waiting for the trigger's
# own runner assignment.
concurrency:
  group: test-dispatch-${{
    format('pr-{0}/{1}', github.event.pull_request.head.repo.full_name, github.event.pull_request.head.ref) }}
  cancel-in-progress: true

jobs:
  trigger:
    name: Trigger the test dispatch
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Trigger only
        run: echo "The Test Dispatch receiver runs from this workflow's completion."
