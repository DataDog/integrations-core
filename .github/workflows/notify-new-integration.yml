name: Notify New Integration

on:
  push:
    branches:
      - master
    paths:
      - "*/pyproject.toml"

env:
  PYTHON_VERSION: "3.13"

jobs:
  notify:
    name: Notify Slack on new integration check
    runs-on: ubuntu-latest
    environment: publish-pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Detect new integration checks
        id: detect
        run: |
          for pyproject in $(git diff --diff-filter=A --name-only HEAD~1 HEAD -- '*/pyproject.toml'); do
            check_name=$(python -c "import tomllib, pathlib; data = tomllib.loads(pathlib.Path('${pyproject}').read_text()); print(data['project']['name'])")
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "name=$check_name" >> "$GITHUB_OUTPUT"
            exit 0
          done

          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        if: steps.detect.outputs.found == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.NEW_INTEGRATION_SLACK_WEBHOOK_URL }}
          NAME: ${{ steps.detect.outputs.name }}
          COMMIT: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg name "$NAME" \
              --arg commit "$COMMIT" \
              '{name: $name, commit: $commit}')"
