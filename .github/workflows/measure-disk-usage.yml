name: Measure Disk Usage

# Runs on the completion of Measure Disk Usage Trigger, which exists only to fire this workflow from
# a commit.
#
# Running on workflow_run means this always executes the version of this file on the default branch,
# so the commit being measured cannot alter it. That is not the same as the measured code being
# trusted: this job checks that code out, so the credential is still taken only for push, where the
# code is master's. A pull request run measures its own branch's code and is left without a key,
# which is also why it does not send anything.
#
# The commit and the triggering event both come from the workflow_run event: head_sha is the head
# commit on a pull request and the pushed commit on a push, and event distinguishes the two. Nothing
# has to be handed over from the trigger.

on:
  workflow_run:
    workflows:
      - 'Measure Disk Usage Trigger'
    types: [completed]

env:
  PYTHON_VERSION: "3.13"
  INTEGRATIONS_WHEELS_STORAGE: "dev"

jobs:
  measure-disk-usage:
    # Fork pull requests are not measured. The trigger is skipped for them, so no successful run
    # should reach here, but this job is the one that can hold a credential so it checks too.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.fork == false
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # needed for dd-sts
      id-token: write
    steps:
      # `ddev size status` measures the tree it is run from, so the measured commit is what gets
      # checked out. On workflow_run the default would be the default branch instead.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get Datadog credentials
        id: dd-sts
        if: github.event.workflow_run.event == 'push'
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: integrations-core-api-key

      - name: Install ddev
        uses: ./.github/actions/setup-ddev
        with:
          install-mode: local
          cache-profile: local-ddev-base

      - name: Configure ddev
        run: ddev config override

      - name: Measure disk usage (Uncompressed)
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SEND: ${{ github.event.workflow_run.event == 'push' }}
        run: |
          args=(-v size status --format json)
          if [ "$SEND" = "true" ]; then
            args+=(--commit "$SHA" --to-dd-key "$DD_API_KEY")
          fi
          ddev "${args[@]}"

      - name: Measure disk usage (Compressed)
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SEND: ${{ github.event.workflow_run.event == 'push' }}
        run: |
          args=(-v size status --format json --compressed)
          if [ "$SEND" = "true" ]; then
            args+=(--commit "$SHA" --to-dd-key "$DD_API_KEY")
          fi
          ddev "${args[@]}"

      - name: Upload JSON uncompressed sizes artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: status_uncompressed.json
          path: status_uncompressed.json
          if-no-files-found: error

      - name: Upload JSON compressed sizes artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: status_compressed.json
          path: status_compressed.json
          if-no-files-found: error
