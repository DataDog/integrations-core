name: Measure Disk Usage

# Triggered by Measure Disk Usage Trigger.

on:
  workflow_run:
    workflows:
      - 'Measure Disk Usage Trigger'
    types: [completed]

env:
  PYTHON_VERSION: "3.13"
  INTEGRATIONS_WHEELS_STORAGE: "dev"

jobs:
  measure-disk-usage:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.fork == false
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # needed for dd-sts
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get Datadog credentials
        id: dd-sts
        if: github.event.workflow_run.event == 'push'
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: integrations-core-api-key

      - name: Install ddev
        uses: ./.github/actions/setup-ddev
        with:
          install-mode: local
          cache-profile: local-ddev-base

      - name: Configure ddev
        run: ddev config override

      - name: Measure disk usage (Uncompressed)
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SEND: ${{ github.event.workflow_run.event == 'push' }}
        run: |
          args=(-v size status --format json)
          if [ "$SEND" = "true" ]; then
            args+=(--commit "$SHA" --to-dd-key "$DD_API_KEY")
          fi
          ddev "${args[@]}"

      - name: Measure disk usage (Compressed)
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SEND: ${{ github.event.workflow_run.event == 'push' }}
        run: |
          args=(-v size status --format json --compressed)
          if [ "$SEND" = "true" ]; then
            args+=(--commit "$SHA" --to-dd-key "$DD_API_KEY")
          fi
          ddev "${args[@]}"

      - name: Resolve the commit to diff against
        id: base
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          if [ "$EVENT" = "push" ]; then
            base_sha=$(git rev-parse "${SHA}^1")
          else
            base_sha=$(git merge-base origin/master "$SHA")
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "Diffing $SHA against $base_sha"

      - name: Measure disk usage difference (Uncompressed)
        id: diff-uncompressed
        continue-on-error: true
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          SEND: ${{ github.event.workflow_run.event == 'push' }}
        run: |
          args=(-v size diff "$BASE_SHA" "$SHA" --format markdown)
          if [ "$SEND" = "true" ]; then
            args+=(--to-dd-key "$DD_API_KEY")
          fi
          ddev "${args[@]}"

      - name: Measure disk usage difference (Compressed)
        id: diff-compressed
        continue-on-error: true
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          SEND: ${{ github.event.workflow_run.event == 'push' }}
        run: |
          args=(-v size diff "$BASE_SHA" "$SHA" --format markdown --compressed)
          if [ "$SEND" = "true" ]; then
            args+=(--to-dd-key "$DD_API_KEY")
          fi
          ddev "${args[@]}"

      - name: Resolve the pull request number
        id: pr
        if: github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.state == "open")][0].number // empty')
          if [ -z "$number" ]; then
            echo "No open pull request matches $SHA; nothing to comment on."
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Build the size difference comment
        if: github.event.workflow_run.event == 'pull_request' && steps.pr.outputs.number != ''
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UNCOMPRESSED_OUTCOME: ${{ steps.diff-uncompressed.outcome }}
          COMPRESSED_OUTCOME: ${{ steps.diff-compressed.outcome }}
        run: |
          section() {
            local title=$1 file=$2 outcome=$3
            printf '<details>\n<summary><strong>%s</strong></summary>\n\n' "$title"
            if [ -f "$file" ]; then
              tail -n +3 "$file"
            elif [ "$outcome" = "success" ]; then
              printf 'No integration or dependency changed size.\n'
            else
              printf ':warning: The %s measurement failed, so no size difference is available. ' "${title,,}"
              printf 'See [the workflow run](%s).\n' "$RUN_URL"
            fi
            printf '\n</details>\n\n'
          }

          {
            printf '## Disk usage change\n\n'
            printf 'Commit `%s` compared against `%s`.\n\n' "${SHA:0:7}" "${BASE_SHA:0:7}"
            section 'Uncompressed' diff_uncompressed.md "$UNCOMPRESSED_OUTCOME"
            section 'Compressed' diff_compressed.md "$COMPRESSED_OUTCOME"
          } > size_diff_comment.md

      - name: Find the previous size difference comment
        if: github.event.workflow_run.event == 'pull_request' && steps.pr.outputs.number != ''
        id: find-comment
        continue-on-error: true
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: github-actions[bot]
          body-includes: Disk usage change

      - name: Comment the size difference on the pull request
        if: github.event.workflow_run.event == 'pull_request' && steps.pr.outputs.number != ''
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.number }}
          body-path: size_diff_comment.md
          edit-mode: replace

      - name: Upload JSON uncompressed sizes artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: status_uncompressed.json
          path: status_uncompressed.json
          if-no-files-found: error

      - name: Upload JSON compressed sizes artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: status_compressed.json
          path: status_compressed.json
          if-no-files-found: error
