name: Measure Disk Usage

# Triggered by Measure Disk Usage Trigger. workflow_run runs the default-branch copy of this file, so
# the measured commit cannot alter it, but this job does check that commit out: the Datadog
# credential is therefore still taken only for push, where the code is master's.
#
# head_sha is the commit to measure, and event says whether it came from a push or a pull request.

on:
  workflow_run:
    workflows:
      - 'Measure Disk Usage Trigger'
    types: [completed]

env:
  PYTHON_VERSION: "3.13"
  INTEGRATIONS_WHEELS_STORAGE: "dev"

jobs:
  measure-disk-usage:
    # Fork pull requests are not measured. Guarded here because this is the job that checks out the
    # measured code and can hold a credential.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.fork == false
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # needed for dd-sts
      id-token: write
    steps:
      # ddev size status measures the tree it runs from, so the measured commit is checked out rather
      # than the default branch.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get Datadog credentials
        id: dd-sts
        if: github.event.workflow_run.event == 'push'
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: integrations-core-api-key

      - name: Install ddev
        uses: ./.github/actions/setup-ddev
        with:
          install-mode: local
          cache-profile: local-ddev-base

      - name: Configure ddev
        run: ddev config override

      - name: Measure disk usage (Uncompressed)
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SEND: ${{ github.event.workflow_run.event == 'push' }}
        run: |
          args=(-v size status --format json)
          if [ "$SEND" = "true" ]; then
            args+=(--commit "$SHA" --to-dd-key "$DD_API_KEY")
          fi
          ddev "${args[@]}"

      - name: Measure disk usage (Compressed)
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SEND: ${{ github.event.workflow_run.event == 'push' }}
        run: |
          args=(-v size status --format json --compressed)
          if [ "$SEND" = "true" ]; then
            args+=(--commit "$SHA" --to-dd-key "$DD_API_KEY")
          fi
          ddev "${args[@]}"

      - name: Upload JSON uncompressed sizes artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: status_uncompressed.json
          path: status_uncompressed.json
          if-no-files-found: error

      - name: Upload JSON compressed sizes artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: status_compressed.json
          path: status_compressed.json
          if-no-files-found: error
