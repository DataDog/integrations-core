name: Measure Disk Usage

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  PYTHON_VERSION: "3.13"
  INTEGRATIONS_WHEELS_STORAGE: "dev"

jobs:
  measure-disk-usage:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # needed for dd-sts
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get Datadog credentials
        id: dd-sts
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: integrations-core-api-key

      - name: Install ddev
        uses: ./.github/actions/setup-ddev
        with:
          install-mode: local
          cache-profile: local-ddev-base

      - name: Configure ddev
        run: ddev config override

      - name: Resolve measurement context
        id: ctx
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Measure disk usage (Uncompressed)
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          SHA: ${{ steps.ctx.outputs.sha }}
          SEND: ${{ steps.ctx.outputs.send }}
        run: |
          args=(-v size status --commit "$SHA" --format json)
          if [ "$SEND" = "true" ]; then
            args+=(--to-dd-key "$DD_API_KEY")
          fi
          ddev "${args[@]}"

      - name: Measure disk usage (Compressed)
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          SHA: ${{ steps.ctx.outputs.sha }}
          SEND: ${{ steps.ctx.outputs.send }}
        run: |
          args=(-v size status --commit "$SHA" --format json --compressed)
          if [ "$SEND" = "true" ]; then
            args+=(--to-dd-key "$DD_API_KEY")
          fi
          ddev "${args[@]}"

      - name: Upload JSON uncompressed sizes artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: status_uncompressed.json
          path: status_uncompressed.json
          if-no-files-found: error

      - name: Upload JSON compressed sizes artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: status_compressed.json
          path: status_compressed.json
          if-no-files-found: error
