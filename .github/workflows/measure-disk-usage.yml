name: Measure Disk Usage

# Triggered by Measure Disk Usage Trigger.

on:
  workflow_run:
    workflows:
      - 'Measure Disk Usage Trigger'
    types: [completed]

env:
  PYTHON_VERSION: "3.13"
  INTEGRATIONS_WHEELS_STORAGE: "dev"

jobs:
  measure-disk-usage:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.fork == false
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # needed for dd-sts
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get Datadog credentials
        id: dd-sts
        if: github.event.workflow_run.event == 'push'
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: integrations-core-api-key

      - name: Install ddev
        uses: ./.github/actions/setup-ddev
        with:
          install-mode: local
          cache-profile: local-ddev-base

      - name: Configure ddev
        run: ddev config override

      - name: Measure disk usage (Uncompressed)
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SEND: ${{ github.event.workflow_run.event == 'push' }}
        run: |
          args=(-v size status --format json)
          if [ "$SEND" = "true" ]; then
            args+=(--commit "$SHA" --to-dd-key "$DD_API_KEY")
          fi
          ddev "${args[@]}"

      - name: Measure disk usage (Compressed)
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SEND: ${{ github.event.workflow_run.event == 'push' }}
        run: |
          args=(-v size status --format json --compressed)
          if [ "$SEND" = "true" ]; then
            args+=(--commit "$SHA" --to-dd-key "$DD_API_KEY")
          fi
          ddev "${args[@]}"

      - name: Upload JSON uncompressed sizes artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: status_uncompressed.json
          path: status_uncompressed.json
          if-no-files-found: error

      - name: Upload JSON compressed sizes artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: status_compressed.json
          path: status_compressed.json
          if-no-files-found: error
