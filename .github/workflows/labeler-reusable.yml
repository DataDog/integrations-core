# This workflow cannot create labels! It assumes the labels it attaches already exist.
# Please reach out to @DataDog/agent-integrations if you need to create a new label.
name: Reusable Labeler Workflow

on:
  workflow_call:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for dd-octo-sts OIDC token exchange
      pull-requests: write
    steps:
      - name: Get token via dd-octo-sts
        uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        id: token-generator
        with:
          scope: DataDog/integrations-core
          policy: self.labeler.pull-request
      - name: Add labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/workflows/config/labeler.yml
          repo-token: "${{ steps.token-generator.outputs.token }}"
          sync-labels: true
      # Same-repository pull requests are authored by Datadog employees and are
      # eligible for automatic staling (see stale.yml). Pull requests from forks
      # never get this label and are only staled when explicitly marked as
      # waiting on their author.
      - name: Add the internal label
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: gh pr edit "$NUMBER" --add-label internal
        env:
          GITHUB_TOKEN: "${{ steps.token-generator.outputs.token }}"
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.number }}
      - name: Add team labels
        run: |
          jq -r '.event.pull_request.requested_teams[].name' <<< "$GITHUB_CONTEXT" | while read -r team; do
            team_normalized=$(echo "$team" | sed 's/ /-/g')
            gh pr edit $NUMBER --add-label "team/$team_normalized"
          done
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
          GITHUB_TOKEN: "${{ steps.token-generator.outputs.token }}"
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.number }}
