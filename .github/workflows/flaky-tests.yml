name: Daily Flaky Tests (every 8 hours)

on:
  workflow_dispatch:
  schedule:
  # 4 AM, 12 PM, 8 PM UTC
  - cron: "0 4,12,20 * * *"

jobs:
  test:
    uses: ./.github/workflows/test-all.yml
    with:
      repo: core

      pytest-args: '-m flaky'
      context: "flaky-tests"
    secrets: inherit

    permissions:
       # needed for compute-matrix in test-target.yml
       contents: read
       # needed for dd-sts in test-target.yml
       id-token: write
