name: Compute matrix

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
    outputs:
      matrix:
        value: ${{ jobs.compute.outputs.data }}

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.13"
  MATRIX_SCRIPT: "ddev/src/ddev/utils/scripts/ci_matrix.py"

jobs:
  compute:
    name: Compute matrix
    runs-on: ubuntu-22.04
    outputs:
      data: "${{ steps.compute.outputs.data }}"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: "${{ github.event.pull_request.head.sha }}"

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "${{ env.PYTHON_VERSION }}"

    - name: Fetch merge base
      env:
        GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        BASE_REF: "${{ github.event.pull_request.base.ref }}"
        HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
      run: |-
        # Compare against the base branch *name* rather than the event payload's cached
        # `base.sha`, which goes stale (and produces an overly broad diff) whenever the base
        # branch is a moving/stacked branch that advances without a new push to this PR's head.
        encoded_base_ref=$(jq -rn --arg ref "$BASE_REF" '$ref | @uri')
        merge_base=$(gh api \
          "repos/${{ github.repository }}/compare/${encoded_base_ref}...${HEAD_SHA}" \
          --jq '.merge_base_commit.sha')
        echo "MERGE_BASE=$merge_base" >> "$GITHUB_ENV"
        git -c protocol.version=2 fetch --no-tags --no-recurse-submodules --filter=blob:none origin "$merge_base"

    - name: Fetch computation script
      if: inputs.repo != 'core'
      run: |-
        mkdir -p $(dirname ${{ env.MATRIX_SCRIPT }})
        curl -sLo ${{ env.MATRIX_SCRIPT }} https://raw.githubusercontent.com/DataDog/integrations-core/master/${{ env.MATRIX_SCRIPT }}

    - name: Compute
      id: compute
      run: |-
        python ${{ env.MATRIX_SCRIPT }} -v --ref "$MERGE_BASE" --exact >> /tmp/matrix.json
        echo "data=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"

    - name: Show matrix
      run: |-
        import json
        from pathlib import Path
        from pprint import pprint

        pprint(json.loads(Path('/tmp/matrix.json').read_text(encoding='utf-8')))
      shell: python
