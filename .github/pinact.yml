# Configuration file for pinact used to validate that no
# GitHub actions are left unpined: .github/workflows/validate-pinned-actions.yml
# Used to exclude specific actions from the pin check
version: 3

# pinact requires every action to be pinned to a SHA with a version comment.
# The actions below are exempt, each for the reason given.
rules:
  # Only publishes the `v1` tag; every other ref is a branch, so the pin tracks
  # a `master` commit and there is no version to name.
  - ignore: true
    conditions:
      - expr: ActionRepoFullName == "dtolnay/rust-toolchain"
  # Tagged as `action/v2.0.3`, and pinact does not recognise prefixed tags as
  # version comments.
  - ignore: true
    conditions:
      - expr: ActionRepoFullName == "DataDog/commit-headless"
  # Dispatcher callers reference `test-dispatch.yml@master` on purpose: a caller
  # on a release branch or tag must run master's Dispatcher, and its octo-sts
  # policy only accepts `test-dispatch.yml` from `refs/heads/master`. A SHA pin
  # would freeze it and fail the token exchange. Only that exact call is exempt.
  - ignore: true
    conditions:
      - expr: ActionName == "DataDog/integrations-core/.github/workflows/test-dispatch.yml" && ActionVersion == "master"
