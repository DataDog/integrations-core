# Trust policy for the stale workflow in DataDog/integrations-core
#
# This policy grants the stale workflow permission to label and close stale
# issues and pull requests, as configured in .github/workflows/stale.yml.
#
# Naming convention:
#   self:         Only this repository (DataDog/integrations-core) can use this policy
#   stale:        Grants permissions to manage stale issues and pull requests
#   manage-stale: Intended for the scheduled stale workflow
#
# Security model:
#   - Workflow runs on schedule or manual dispatch from the protected master branch only
#   - job_workflow_ref is pinned to stale.yml committed to master
#
# Permissions granted:
#   - issues: write        - Mark issues stale and close them
#   - pull_requests: write - Mark pull requests stale and close them
#
# Usage in workflows:
#   - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
#     with:
#       scope: DataDog/integrations-core
#       policy: self.stale.manage-stale

issuer: https://token.actions.githubusercontent.com

subject: repo:DataDog/integrations-core:ref:refs/heads/master

claim_pattern:
  event_name: (schedule|workflow_dispatch)
  ref: refs/heads/master
  ref_protected: "true"
  job_workflow_ref: DataDog/integrations-core/\.github/workflows/stale\.yml@refs/heads/master
  repository: DataDog/integrations-core

permissions:
  issues: write
  pull_requests: write
