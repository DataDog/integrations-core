# Only the APW producer on reviewed master may create source tags.
issuer: https://token.actions.githubusercontent.com
subject: repo:DataDog/integrations-core:ref:refs/heads/master

claim_pattern:
  event_name: (schedule|workflow_dispatch)
  job_workflow_ref: DataDog/integrations-core/\.github/workflows/apw-assets\.yml@refs/heads/master
  ref: refs/heads/master
  ref_protected: "true"
  repository: DataDog/integrations-core

permissions:
  contents: write
