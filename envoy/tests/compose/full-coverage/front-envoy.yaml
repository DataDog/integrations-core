# Front proxy for the envoy-full evalya fixture. Every non-default piece below
# exists to drive a dashboard or monitor metric; see ../../README.md.
node:
  cluster: e2e-test-cluster
  id: e2e-test-id

admin:
  address:
    socket_address: {address: 0.0.0.0, port_value: 8001}

layered_runtime:
  layers:
  - name: static
    static_layer:
      # Caps the `limited` listener at one connection so a second concurrent
      # client increments listener.downstream_cx_overflow.
      envoy.resource_limits.listener.limited.connection_limit: 1
  # The seed nests this directory deeper than Envoy's runtime walk limit, so a
  # snapshot load fails and increments runtime.load_error; activity-gen parks the
  # tree on alternate reloads so runtime.load_success moves too.
  - name: too_deep
    disk_layer: {symlink_root: /var/run/envoy-dynamic/runtime}
  # Target of the workload's /runtime_modify calls (runtime.admin_overrides_active,
  # runtime.load_success).
  - name: admin
    admin_layer: {}

# Moving a 1 into the pressure file trips reject_incoming_connections, which drives
# listener.downstream_cx_overload_reject; the workload resets it to 0 right away.
overload_manager:
  refresh_interval: 0.25s
  resource_monitors:
  - name: envoy.resource_monitors.injected_resource
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.resource_monitors.injected_resource.v3.InjectedResourceConfig
      filename: /var/run/envoy-dynamic/pressure
  actions:
  - name: envoy.overload_actions.reject_incoming_connections
    triggers:
    - name: envoy.resource_monitors.injected_resource
      threshold: {value: 0.9}

dynamic_resources:
  # LDS over ADS against the shipped xds control plane: the ADS mux is what
  # reports control_plane.connected_state (1 while the stream is up).
  ads_config:
    api_type: GRPC
    transport_api_version: V3
    grpc_services:
    - envoy_grpc: {cluster_name: xds_cluster}
    set_node_on_first_message_only: true
  lds_config:
    resource_api_version: V3
    ads: {}
  # File CDS: the workload re-publishes it, and its cluster uses a deprecated
  # field, so each reload increments runtime.deprecated_feature_use.
  cds_config:
    resource_api_version: V3
    path_config_source: {path: /var/run/envoy-dynamic/cds.yaml}

static_resources:
  listeners:
  - name: ingress
    address:
      socket_address: {address: 0.0.0.0, port_value: 80}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          codec_type: AUTO
          stat_prefix: ingress_http
          # Compose-network clients are RFC 1918 addresses, so requests are marked
          # internal (cluster.internal.upstream_rq_xx).
          use_remote_address: true
          # A slowly uploaded body exceeds this (http.downstream_rq_timeout).
          request_timeout: 2s
          upgrade_configs:
          - upgrade_type: websocket
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match: {prefix: /service/1}
                route: {cluster: service1}
              - match: {prefix: /service/2}
                route: {cluster: service2}
              - match: {prefix: /slow}
                route: {cluster: backend, timeout: 60s}
              - match: {prefix: /timeout}
                route: {cluster: backend, prefix_rewrite: /slow, timeout: 0.25s}
              - match: {prefix: /status/}
                route: {cluster: backend}
              - match: {prefix: /ws}
                route: {cluster: backend}
              - match: {prefix: /panic}
                route: {cluster: panic}
              - match: {prefix: /blackhole}
                route: {cluster: blackhole}
              - match: {prefix: /nocluster}
                route: {cluster_header: x-target-cluster}
              # No catch-all route: any other path increments http.no_route.
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  - name: limited
    address:
      socket_address: {address: 0.0.0.0, port_value: 82}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: limited_http
          route_config:
            virtual_hosts:
            - name: limited
              domains: ["*"]
              routes:
              - match: {prefix: /}
                route: {cluster: backend, timeout: 60s}
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: service1
    connect_timeout: 0.25s
    type: STRICT_DNS
    typed_extension_protocol_options: &h2
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http2_protocol_options: {}}
    load_assignment:
      cluster_name: service1
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: service1, port_value: 80}}}
  - name: service2
    connect_timeout: 0.25s
    type: STRICT_DNS
    typed_extension_protocol_options: *h2
    load_assignment:
      cluster_name: service2
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: service2, port_value: 80}}}
  - name: backend
    connect_timeout: 0.25s
    type: STRICT_DNS
    load_assignment:
      cluster_name: backend
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: backend, port_value: 8080}}}
  # Its only host always fails the health check, so the cluster is below the
  # healthy-panic threshold and every request is routed in panic mode
  # (cluster.lb_healthy_panic).
  - name: panic
    connect_timeout: 0.25s
    type: STRICT_DNS
    health_checks:
    - timeout: 1s
      interval: 2s
      unhealthy_threshold: 1
      healthy_threshold: 1
      http_health_check: {path: /healthz}
    load_assignment:
      cluster_name: panic
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: backend, port_value: 8080}}}
  # Non-routable address: connection attempts time out (cluster.upstream_cx_connect_timeout).
  - name: blackhole
    connect_timeout: 0.25s
    type: STATIC
    load_assignment:
      cluster_name: blackhole
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: 10.255.255.1, port_value: 80}}}
  - name: xds_cluster
    connect_timeout: 1s
    type: LOGICAL_DNS
    typed_extension_protocol_options: *h2
    load_assignment:
      cluster_name: xds_cluster
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: xds, port_value: 8080}}}
