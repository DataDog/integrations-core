          target: ocsf.privilege
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: array-processor
          name: Move privilege into privileges array
          enabled: true
          operation:
            source: ocsf.privilege
            target: ocsf.privileges
            preserveSource: false
            type: append
        - type: attribute-remapper
          name: Map `role_id` to `ocsf.resource.uid`
          enabled: true
          sources:
            - role_id
          sourceType: attribute
          target: ocsf.resource.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: string-builder-processor
          name: Add resource type
          enabled: true
