# bypass-global-no-service-config-checks
id: keeper
metric_id: keeper
backend_only: false
facets:
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - User
    name: User Email
    path: usr.email
    source: log
  - groups:
      - OCSF
    name: Activity ID
    path: ocsf.activity_id
    source: log
    type: integer
  - groups:
      - OCSF
    name: Activity Name
    path: ocsf.activity_name
    source: log
  - groups:
      - OCSF
    name: Category
    path: ocsf.category_name
    source: log
  - groups:
      - OCSF
    name: Category ID
    path: ocsf.category_uid
    source: log
    type: integer
  - groups:
      - OCSF
    name: Class
    path: ocsf.class_name
    source: log
  - groups:
      - OCSF
    name: Class ID
    path: ocsf.class_uid
    source: log
    type: integer
  - groups:
      - OCSF
    name: Type ID
    path: ocsf.type_uid
    source: log
    type: integer
  - groups:
      - OCSF
    name: Severity ID
    path: ocsf.severity_id
    source: log
    type: integer
  - groups:
      - OCSF
    name: Status
    path: ocsf.status
    source: log
  - groups:
      - OCSF
    name: Status ID
    path: ocsf.status_id
    source: log
    type: integer
  - groups:
      - OCSF
    name: Event Code
    path: ocsf.metadata.event_code
    source: log
  - groups:
      - OCSF
    name: Product Name
    path: ocsf.metadata.product.name
    source: log
  - groups:
      - OCSF
    name: Vendor Name
    path: ocsf.metadata.product.vendor_name
    source: log
  - groups:
      - OCSF
    name: Email Address
    path: ocsf.actor.user.email_addr
    source: log
  - groups:
      - OCSF
    name: Source IP Address
    path: ocsf.src_endpoint.ip
    source: log
pipeline:
  type: pipeline
  name: Keeper
  enabled: true
  filter:
    query: source:keeper
  processors:
    - type: grok-parser
      name: Extract timestamp and JSON from message
      enabled: true
      source: message
      samples:
        - <165>1 2025-06-11T05:27:24.000Z keepersecurity.com keeper - - -
          {"record_uid":"Dm_l4bk34Rj62ef-XUPv3g","audit_event":"copy_password","remote_address":"10.10.10.10","category":"usage","client_version":"Web
          App.17.2.2","username":"xakemaukubri-2168@company.com","enterprise_id":260753}
        - <165>1 2025-6-1T5:7:4.123Z keepersecurity.com keeper - - -
          {"record_uid":"Dm_l4bk34Rj62ef-XUPv3g"}
        - <165>1 2025-6-1T5:7:4.123Z keepersecurity.com keeper - 1234 -
          {"record_uid":"Dm_l4bk34Rj62ef-XUPv3g"}
      grok:
        supportRules: ""
        matchRules: extract_event_time_and_json <%{integer}>%{integer}
          %{date("yyyy-M-d'T'H:m:s.SSSZ"):timestamp} %{notSpace} %{notSpace}
          %{notSpace} %{notSpace} - %{data::json}
    - type: service-remapper
      name: Define `service` as the official service of the log
      enabled: true
      sources:
        - service
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      enabled: true
      sources:
        - timestamp
    - type: attribute-remapper
      name: Map `audit_event` to `evt.name`
      enabled: true
      sources:
        - audit_event
      sourceType: attribute
      target: evt.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `category` to `evt.category`
      enabled: true
      sources:
        - category
      sourceType: attribute
      target: evt.category
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `remote_address` to `network.client.ip`
      enabled: true
      sources:
        - remote_address
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: geo-ip-parser
      name: Extract geolocation information from `network.client.ip`
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - type: attribute-remapper
      name: Map `username` to `usr.email`
      enabled: true
      sources:
        - username
      sourceType: attribute
      target: usr.email
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: pipeline
      name: Process external record sharing events
      enabled: true
      filter:
        query: "@evt.name:(ext_share_added OR ext_share_access OR ext_share_connected OR
          ext_share_expired OR ext_share_removed)"
      processors:
        - type: attribute-remapper
          name: Map `app_uid` to `record_uid`
          enabled: true
          sources:
            - app_uid
          sourceType: attribute
          target: record_uid
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
    - type: pipeline
      name: Process `pending_added_to_role` and `pending_removed_from_role` events
      enabled: true
      filter:
        query: "@evt.name:(pending_added_to_role OR pending_removed_from_role)"
      processors:
        - type: attribute-remapper
          name: Map `value` to `to_username`
          enabled: true
          sources:
            - value
          sourceType: attribute
          target: to_username
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
    - type: pipeline
      name: Process `vault_transferred` event
      enabled: true
      filter:
        query: "@evt.name:vault_transferred"
      processors:
        - type: attribute-remapper
          name: Map `email` to `from_user`
          enabled: true
          sources:
            - email
          sourceType: attribute
          target: from_user
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `to_username` to `to_user`
          enabled: true
          sources:
            - to_username
          sourceType: attribute
          target: to_user
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
    - type: string-builder-processor
      name: "Reset `additionalProperties` attribute "
      enabled: true
      template: "%{resolve_to_empty_string}"
      target: additionalProperties
      replaceMissing: true
    - type: pipeline
      name: OCSF pre transformations
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "*"
      processors:
        - type: string-builder-processor
          name: Add product name
          enabled: true
          template: "Keeper"
          target: ocsf.metadata.product.name
          replaceMissing: false
        - type: string-builder-processor
          name: Add product vendor
          enabled: true
          template: "Keeper Security"
          target: ocsf.metadata.product.vendor_name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `audit_event` to `ocsf.metadata.event_code`
          enabled: true
          sources:
            - audit_event
          sourceType: attribute
          target: ocsf.metadata.event_code
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: attribute-remapper
          name: Map `client_version` to `ocsf.metadata.product.version`
          enabled: true
          sources:
            - client_version
          sourceType: attribute
          target: ocsf.metadata.product.version
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: attribute-remapper
          name: Map `enterprise_id` to `ocsf.metadata.tenant_uid`
          enabled: true
          sources:
            - enterprise_id
          sourceType: attribute
          target: ocsf.metadata.tenant_uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: attribute-remapper
          name: Map `timestamp` to `ocsf.time`
          enabled: true
          sources:
            - timestamp
          sourceType: attribute
          target: ocsf.time
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
    - type: pipeline
      name: OCSF sub pipeline for class Detection Finding [2004]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@ocsf.metadata.event_code:(bw_record_high_risk OR audit_alert_sent OR bw_record_ignored OR bw_record_resolved OR reused_password OR keeper_ai_critical_risk_level_detected OR keeper_ai_high_risk_level_detected OR keeper_ai_medium_risk_level_detected OR keeper_ai_session_locked_by_ai_critical OR keeper_ai_session_locked_by_ai_high OR keeper_ai_session_locked_by_ai_medium)"
      processors:
        - type: string-builder-processor
          name: Set is_alert to boolean true
          enabled: true
          template: "true"
          target: ocsf.is_alert
          replaceMissing: false
        - type: grok-parser
          name: Convert ocsf.is_alert string to boolean
          enabled: true
          source: ocsf.is_alert
          samples:
            - "true"
          grok:
            supportRules: ""
            matchRules: "to_bool %{boolean(\"true\",\"false\"):ocsf.is_alert}"
        - type: schema-processor
          name: Apply OCSF schema for 2004
          enabled: true
          mappers:
            - type: schema-remapper
              name: Map `ocsf.metadata.product.name` to `ocsf.metadata.product.name`
              sources:
                - ocsf.metadata.product.name
              target: ocsf.metadata.product.name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.product.vendor_name` to `ocsf.metadata.product.vendor_name`
              sources:
                - ocsf.metadata.product.vendor_name
              target: ocsf.metadata.product.vendor_name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.event_code` to `ocsf.metadata.event_code`
              sources:
                - ocsf.metadata.event_code
              target: ocsf.metadata.event_code
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.product.version` to `ocsf.metadata.product.version`
              sources:
                - ocsf.metadata.product.version
              target: ocsf.metadata.product.version
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.tenant_uid` to `ocsf.metadata.tenant_uid`
              sources:
                - ocsf.metadata.tenant_uid
              target: ocsf.metadata.tenant_uid
              preserveSource: true
              overrideOnConflict: true
              targetFormat: string
            - type: schema-remapper
              name: Map `ocsf.time` to `ocsf.time`
              sources:
                - ocsf.time
              target: ocsf.time
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `audit_event` to `ocsf.finding_info.title`
              sources:
                - audit_event
              target: ocsf.finding_info.title
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `record_uid` to `ocsf.finding_info.uid`
              sources:
                - record_uid
              target: ocsf.finding_info.uid
              preserveSource: true
              overrideOnConflict: true
              targetFormat: string
            - type: schema-category-mapper
              name: ocsf.activity_id
              categories:
                - filter:
                    query: "*"
                  name: Create
                  id: 1
              targets:
                name: ocsf.activity_name
                id: ocsf.activity_id
            - type: schema-category-mapper
              name: ocsf.severity_id
              categories:
                - filter:
                    query: "@ocsf.metadata.event_code:(keeper_ai_critical_risk_level_detected OR keeper_ai_session_locked_by_ai_critical)"
                  name: Critical
                  id: 5
                - filter:
                    query: "@ocsf.metadata.event_code:(bw_record_high_risk OR keeper_ai_high_risk_level_detected OR keeper_ai_session_locked_by_ai_high)"
                  name: High
                  id: 4
                - filter:
                    query: "@ocsf.metadata.event_code:(reused_password OR keeper_ai_medium_risk_level_detected OR keeper_ai_session_locked_by_ai_medium)"
                  name: Medium
                  id: 3
                - filter:
                    query: "@ocsf.metadata.event_code:bw_record_resolved"
                  name: Low
                  id: 2
                - filter:
                    query: "@ocsf.metadata.event_code:*"
                  name: Informational
                  id: 1
              targets:
                name: ocsf.severity
                id: ocsf.severity_id
              fallback:
                values:
                  ocsf.severity: Other
                  ocsf.severity_id: "99"
                sources:
                  ocsf.severity:
                    - audit_event
            - type: schema-remapper
              name: Map `ocsf.is_alert` to `ocsf.is_alert`
              sources:
                - ocsf.is_alert
              target: ocsf.is_alert
              preserveSource: true
              overrideOnConflict: true
            - type: schema-category-mapper
              name: ocsf.risk_level_id
              categories:
                - filter:
                    query: "@ocsf.metadata.event_code:(keeper_ai_critical_risk_level_detected OR keeper_ai_session_locked_by_ai_critical)"
                  name: Critical
                  id: 4
                - filter:
                    query: "@ocsf.metadata.event_code:(bw_record_high_risk OR keeper_ai_high_risk_level_detected OR keeper_ai_session_locked_by_ai_high)"
                  name: High
                  id: 3
                - filter:
                    query: "@ocsf.metadata.event_code:(reused_password OR keeper_ai_medium_risk_level_detected OR keeper_ai_session_locked_by_ai_medium)"
                  name: Medium
                  id: 2
                - filter:
                    query: "@ocsf.metadata.event_code:*"
                  name: Info
                  id: 0
              targets:
                name: ocsf.risk_level
                id: ocsf.risk_level_id
            - type: schema-category-mapper
              name: ocsf.status_id
              categories:
                - filter:
                    query: "@ocsf.metadata.event_code:bw_record_resolved"
                  name: Resolved
                  id: 4
                - filter:
                    query: "@ocsf.metadata.event_code:bw_record_ignored"
                  name: Suppressed
                  id: 3
                - filter:
                    query: "@ocsf.metadata.event_code:*"
                  name: New
                  id: 1
              targets:
                name: ocsf.status
                id: ocsf.status_id
          schema:
            schemaType: ocsf
            version: 1.5.0
            className: Detection Finding
            classUid: 2004
            extensions: []
            profiles: []
    - type: pipeline
      name: OCSF sub pipeline for class Account Change [3001]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@ocsf.metadata.event_code:(accept_invitation OR account_recovery OR account_recovery_decline OR account_recovery_setup OR add_security_key OR alias_added OR auto_invite_user OR change_email OR change_master_password OR change_security_question OR clear_security_data OR create_user OR decline_invitation OR delete_pending_user OR delete_security_key OR delete_user OR device_user_passkey_add OR device_user_passkey_remove OR enable_user OR send_invitation OR set_alternate_master_password OR set_biometric_access OR set_two_factor_off OR set_two_factor_on)"
      processors:
        - type: schema-processor
          name: Apply OCSF schema for 3001
          enabled: true
          mappers:
            - type: schema-remapper
              name: Map `ocsf.metadata.product.name` to `ocsf.metadata.product.name`
              sources:
                - ocsf.metadata.product.name
              target: ocsf.metadata.product.name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.product.vendor_name` to `ocsf.metadata.product.vendor_name`
              sources:
                - ocsf.metadata.product.vendor_name
              target: ocsf.metadata.product.vendor_name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.event_code` to `ocsf.metadata.event_code`
              sources:
                - ocsf.metadata.event_code
              target: ocsf.metadata.event_code
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.product.version` to `ocsf.metadata.product.version`
              sources:
                - ocsf.metadata.product.version
              target: ocsf.metadata.product.version
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.tenant_uid` to `ocsf.metadata.tenant_uid`
              sources:
                - ocsf.metadata.tenant_uid
              target: ocsf.metadata.tenant_uid
              preserveSource: true
              overrideOnConflict: true
              targetFormat: string
            - type: schema-remapper
              name: Map `ocsf.time` to `ocsf.time`
              sources:
                - ocsf.time
              target: ocsf.time
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `username` to `ocsf.actor.user.email_addr`
              sources:
                - username
              target: ocsf.actor.user.email_addr
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `username` to `ocsf.actor.user.name`
              sources:
                - username
              target: ocsf.actor.user.name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `remote_address` to `ocsf.src_endpoint.ip`
              sources:
                - remote_address
              target: ocsf.src_endpoint.ip
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: "Map `to_username`, `username` to `ocsf.user.email_addr`"
              sources:
                - to_username
                - username
              target: ocsf.user.email_addr
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: "Map `to_username`, `username` to `ocsf.user.name`"
              sources:
                - to_username
                - username
              target: ocsf.user.name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-category-mapper
              name: ocsf.user.type_id
              categories:
                - filter:
                    query: "*"
                  name: User
                  id: 1
              targets:
                name: ocsf.user.type
                id: ocsf.user.type_id
            - type: schema-category-mapper
              name: ocsf.activity_id
              categories:
                - filter:
                    query: "@ocsf.metadata.event_code:create_user"
                  name: Create
                  id: 1
                - filter:
                    query: "@ocsf.metadata.event_code:enable_user"
                  name: Enable
                  id: 2
                - filter:
                    query: "@ocsf.metadata.event_code:(change_master_password OR set_alternate_master_password)"
                  name: Password Change
                  id: 3
                - filter:
                    query: "@ocsf.metadata.event_code:(delete_pending_user OR delete_user)"
                  name: Delete
                  id: 6
                - filter:
                    query: "@ocsf.metadata.event_code:(add_security_key OR device_user_passkey_add OR set_two_factor_on)"
                  name: MFA Factor Enable
                  id: 10
                - filter:
                    query: "@ocsf.metadata.event_code:(set_two_factor_off OR device_user_passkey_remove OR delete_security_key)"
                  name: MFA Factor Disable
                  id: 11
                - filter:
                    query: "@ocsf.metadata.event_code:*"
                  name: Other
                  id: 99
              targets:
                name: ocsf.activity_name
                id: ocsf.activity_id
              fallback:
                values:
                  ocsf.activity_name: Other
                  ocsf.activity_id: "99"
                sources:
                  ocsf.activity_name:
                    - audit_event
            - type: schema-category-mapper
              name: ocsf.severity_id
              categories:
                - filter:
                    query: "*"
                  name: Informational
                  id: 1
              targets:
                name: ocsf.severity
                id: ocsf.severity_id
            - type: schema-category-mapper
              name: ocsf.status_id
              categories:
                - filter:
                    query: "*"
                  name: Success
                  id: 1
              targets:
                name: ocsf.status
                id: ocsf.status_id
          schema:
            schemaType: ocsf
            version: 1.5.0
            className: Account Change
            classUid: 3001
            extensions: []
            profiles: []
    - type: pipeline
      name: OCSF sub pipeline for class Authentication [3002]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@ocsf.metadata.event_code:(device_admin_loggedout OR device_user_loggedout OR login OR login_console OR login_failed_console OR login_failed_ip_whitelist OR login_failure OR reauthentication_reprompt_success OR reauthentication_reprompt_throttle OR two_factor_code_invalid OR two_factor_disabled_by_support)"
      processors:
        - type: schema-processor
          name: Apply OCSF schema for 3002
          enabled: true
          mappers:
            - type: schema-remapper
              name: Map `ocsf.metadata.product.name` to `ocsf.metadata.product.name`
              sources:
                - ocsf.metadata.product.name
              target: ocsf.metadata.product.name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.product.vendor_name` to `ocsf.metadata.product.vendor_name`
              sources:
                - ocsf.metadata.product.vendor_name
              target: ocsf.metadata.product.vendor_name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.event_code` to `ocsf.metadata.event_code`
              sources:
                - ocsf.metadata.event_code
              target: ocsf.metadata.event_code
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.product.version` to `ocsf.metadata.product.version`
              sources:
                - ocsf.metadata.product.version
              target: ocsf.metadata.product.version
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.tenant_uid` to `ocsf.metadata.tenant_uid`
              sources:
                - ocsf.metadata.tenant_uid
              target: ocsf.metadata.tenant_uid
              preserveSource: true
              overrideOnConflict: true
              targetFormat: string
            - type: schema-remapper
              name: Map `ocsf.time` to `ocsf.time`
              sources:
                - ocsf.time
              target: ocsf.time
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `username` to `ocsf.actor.user.email_addr`
              sources:
                - username
              target: ocsf.actor.user.email_addr
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `username` to `ocsf.actor.user.name`
              sources:
                - username
              target: ocsf.actor.user.name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `hostname` to `ocsf.dst_endpoint.hostname`
              sources:
                - hostname
              target: ocsf.dst_endpoint.hostname
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `remote_address` to `ocsf.src_endpoint.ip`
              sources:
                - remote_address
              target: ocsf.src_endpoint.ip
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `username` to `ocsf.user.email_addr`
              sources:
                - username
              target: ocsf.user.email_addr
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `username` to `ocsf.user.name`
              sources:
                - username
              target: ocsf.user.name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-category-mapper
              name: ocsf.activity_id
              categories:
                - filter:
