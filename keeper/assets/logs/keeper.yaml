            - type: schema-category-mapper
              name: ocsf.activity_id
              categories:
                - filter:
                    query: "@ocsf.metadata.event_code:pending_added_to_role"
                  name: Assign Privileges
                  id: 1
                - filter:
                    query: "@ocsf.metadata.event_code:pending_removed_from_role"
                  name: Revoke Privileges
                  id: 2
                - filter:
                    query: "@ocsf.metadata.event_code:*"
                  name: Other
                  id: 99
              targets:
                name: ocsf.activity_name
                id: ocsf.activity_id
              fallback:
                values:
                  ocsf.activity_name: Other
                  ocsf.activity_id: "99"
                sources:
                  ocsf.activity_name:
                    - audit_event
