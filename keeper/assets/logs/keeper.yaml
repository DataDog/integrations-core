          target: ocsf.resource.type
          replaceMissing: false
        - type: array-processor
          name: Move resource into resources array
          enabled: true
          operation:
            source: ocsf.resource
            target: ocsf.resources
            preserveSource: false
            type: append
        - type: schema-processor
