              sources:
                - client_version
              target: ocsf.metadata.product.version
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `enterprise_id` to `ocsf.metadata.tenant_uid`
              sources:
                - enterprise_id
              target: ocsf.metadata.tenant_uid
              preserveSource: true
              overrideOnConflict: true
              targetFormat: string
            - type: schema-remapper
              name: Map `timestamp` to `ocsf.time`
              sources:
                - timestamp
              target: ocsf.time
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `username` to `ocsf.actor.user.email_addr`
              sources:
                - username
              target: ocsf.actor.user.email_addr
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `username` to `ocsf.actor.user.name`
              sources:
                - username
              target: ocsf.actor.user.name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `hostname` to `ocsf.src_endpoint.hostname`
              sources:
                - hostname
              target: ocsf.src_endpoint.hostname
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `remote_address` to `ocsf.src_endpoint.ip`
              sources:
                - remote_address
              target: ocsf.src_endpoint.ip
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `from_user` to `ocsf.entity.user.email_addr`
              sources:
                - from_user
              target: ocsf.entity.user.email_addr
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `from_user` to `ocsf.entity.user.name`
              sources:
                - from_user
              target: ocsf.entity.user.name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `from_username` to `ocsf.entity.user.uid`
              sources:
                - from_username
              target: ocsf.entity.user.uid
              preserveSource: true
              overrideOnConflict: true
              targetFormat: string
            - type: schema-remapper
              name: Map `to_user` to `ocsf.entity_result.user.email_addr`
              sources:
                - to_user
              target: ocsf.entity_result.user.email_addr
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `to_user` to `ocsf.entity_result.user.name`
              sources:
                - to_user
              target: ocsf.entity_result.user.name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-category-mapper
              name: ocsf.entity.type_id
              categories:
                - filter:
                    query: "*"
                  name: Vault
                  id: 99
              targets:
                name: ocsf.entity.type
                id: ocsf.entity.type_id
            - type: schema-category-mapper
              name: ocsf.entity_result.type_id
              categories:
                - filter:
                    query: "*"
                  name: Vault
                  id: 99
              targets:
                name: ocsf.entity_result.type
                id: ocsf.entity_result.type_id
            - type: schema-category-mapper
              name: ocsf.activity_id
              categories:
                - filter:
                    query: "*"
                  name: Move
                  id: 5
              targets:
                name: ocsf.activity_name
                id: ocsf.activity_id
            - type: schema-category-mapper
              name: ocsf.severity_id
              categories:
                - filter:
                    query: "*"
                  name: Medium
                  id: 3
              targets:
                name: ocsf.severity
                id: ocsf.severity_id
            - type: schema-category-mapper
              name: ocsf.status_id
              categories:
                - filter:
                    query: "*"
                  name: Success
                  id: 1
              targets:
                name: ocsf.status
                id: ocsf.status_id
          schema:
            schemaType: ocsf
            version: 1.5.0
            className: Entity Management
            classUid: 3004
            extensions: []
            profiles: []
    - type: pipeline
      name: OCSF sub pipeline for class User Access Management [3005]
      enabled: true
      ocsf:
        isOcsf: true
