              sources:
                - ocsf.metadata.event_code
              target: ocsf.metadata.event_code
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `client_version` to `ocsf.metadata.product.version`
              sources:
                - client_version
              target: ocsf.metadata.product.version
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `enterprise_id` to `ocsf.metadata.tenant_uid`
              sources:
                - enterprise_id
              target: ocsf.metadata.tenant_uid
              preserveSource: true
              overrideOnConflict: true
              targetFormat: string
            - type: schema-remapper
              name: Map `timestamp` to `ocsf.time`
              sources:
                - timestamp
              target: ocsf.time
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `username` to `ocsf.actor.user.email_addr`
              sources:
                - username
              target: ocsf.actor.user.email_addr
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `username` to `ocsf.actor.user.name`
              sources:
                - username
              target: ocsf.actor.user.name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `hostname` to `ocsf.src_endpoint.hostname`
              sources:
                - hostname
              target: ocsf.src_endpoint.hostname
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `remote_address` to `ocsf.src_endpoint.ip`
              sources:
                - remote_address
              target: ocsf.src_endpoint.ip
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `to_username` to `ocsf.user.email_addr`
              sources:
                - to_username
              target: ocsf.user.email_addr
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `to_username` to `ocsf.user.name`
              sources:
