---
.build-agent-tpl:
  variables:
    # Pass these to triggered agent build job.
    RELEASE_VERSION_6: "nightly"
    RELEASE_VERSION_7: "nightly-a7"
    BUCKET_BRANCH: "dev"
    DEPLOY_AGENT: "false"
    INTEGRATIONS_CORE_VERSION: ${CI_COMMIT_SHA}
    INTEGRATIONS_WHEELS_STORAGE: "dev"
    RUN_E2E_TESTS: "on"
    # disable kitchen tests
    RUN_KITCHEN_TESTS: "false"
  stage: build
  trigger:
    project: DataDog/datadog-agent
    branch: main
    # It's more convenient to directly show if downstream pipeline succeeded.
    strategy: depend

build-agent-auto:
  extends: .build-agent-tpl
  rules:
    # Do not run on tags
    - if: $CI_COMMIT_TAG
      when: never
    # Do not run on release branches
    - if: $CI_COMMIT_BRANCH =~ /^7\.\d+\.x$/
      when: never
    # Do not run on Github Merge Queue branches
    - if: $CI_COMMIT_BRANCH =~ /^gh-readonly-queue.*/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - .deps/**/*
          - .gitlab/build_agent.yaml
    # Without compare_to, branch pipelines diff against the previous push, so rebasing a stale
    # branch onto master picks up master's dependency changes and triggers a build.
    # `ddev release branch create` points compare_to at the release branch, so branches cut from it
    # compare against the release instead of master.
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        compare_to: refs/heads/master
        paths:
          - .deps/**/*
          - .gitlab/build_agent.yaml

build-agent-manual-release:
  extends: .build-agent-tpl
  allow_failure: true
  trigger:
    branch: $CI_COMMIT_BRANCH
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^7\.\d+\.x$/
      when: manual

# Always have the option to run manually the agent build manually against the agent's main
build-agent-manual:
  extends: .build-agent-tpl
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^7\.\d+\.x$/
      when: never
    - when: manual
