[env.collectors.datadog-checks]
# Type checking is scoped to the backend-neutral HTTP contract and its implementations.
# follow-imports=silent confines reporting to mypy-files rather than the whole import graph.
check-types = true
mypy-args = ["--follow-imports=silent"]
mypy-files = [
  "datadog_checks/base/utils/http_protocol.py",
  "datadog_checks/base/utils/requests_adapter.py",
  "datadog_checks/base/stubs/http.py",
]


[[envs.default.matrix]]
python = ["3.13"]

[envs.default]
features = ["db", "deps", "http", "json", "kube"]
dependencies = [
  "datadog_checks_tests_helper @ {root:uri}/../datadog_checks_tests_helper",
  "hypothesis",
]
e2e-env = false

[envs.default.env-vars]
PIP_EXTRA_INDEX_URL = "https://datadoghq.dev/ci-wheels/bin"
DDEV_SKIP_GENERIC_TAGS_CHECK = "true"

[envs.bench]
