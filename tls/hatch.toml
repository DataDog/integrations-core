[env.collectors.datadog-checks]

[envs.default]
dependencies = [
  "datadog_checks_tests_helper @ {root:uri}/../datadog_checks_tests_helper",
]

# Temporary soak only; do not merge into master or expand the generated nightly workflow.
# 50 environments x standard/MBP x legacy PR/Dispatcher = 200 planned unit/integration runs.
# No pytest repeat loop: each CI job must select exactly one environment.
[[envs.default.matrix]]
python = ["3.13"]
run = [
  "001", "002", "003", "004", "005", "006", "007", "008", "009", "010",
  "011", "012", "013", "014", "015", "016", "017", "018", "019", "020",
  "021", "022", "023", "024", "025", "026", "027", "028", "029", "030",
  "031", "032", "033", "034", "035", "036", "037", "038", "039", "040",
  "041", "042", "043", "044", "045", "046", "047", "048", "049", "050",
]
