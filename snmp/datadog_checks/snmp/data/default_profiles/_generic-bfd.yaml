# BFD session
# This table contains one entry per BFD session, and information about its state and timers.
metrics:
  - MIB: BFD-STD-MIB
    table:
      name: bfdSessTable
      OID: 1.3.6.1.2.1.222.1.2
    symbols:
      - name: bfdSessionByState
        constant_value_one: true
      - OID: 1.3.6.1.2.1.222.1.2.1.9
        name: bfdSessAdminStatus
      - OID: 1.3.6.1.2.1.222.1.2.1.10
        name: bfdSessOperStatus
      - OID: 1.3.6.1.2.1.222.1.2.1.11
        name: bfdSessState
      - OID: 1.3.6.1.2.1.222.1.2.1.13
        name: bfdSessDiag
      - OID: 1.3.6.1.2.1.222.1.2.1.25
        name: bfdSessDesiredMinTxInterval
      - OID: 1.3.6.1.2.1.222.1.2.1.26
        name: bfdSessReqMinRxInterval
      - OID: 1.3.6.1.2.1.222.1.2.1.28
        name: bfdSessDetectMult
      - OID: 1.3.6.1.2.1.222.1.2.1.29
        name: bfdSessNegotiatedInterval
    metric_tags:
      - tag: bfd_session_admin_status
        symbol:
          OID: 1.3.6.1.2.1.222.1.2.1.9
          name: bfdSessAdminStatus
        mapping:
          1: enabled
          2: disabled
          3: admin_down
          4: down
      - tag: bfd_session_oper_status
        symbol:
          OID: 1.3.6.1.2.1.222.1.2.1.10
          name: bfdSessOperStatus
        mapping:
          1: up
          2: down
          3: admin_down
      - tag: bfd_session_state
        symbol:
          OID: 1.3.6.1.2.1.222.1.2.1.11
          name: bfdSessState
        mapping:
          1: admin_down
          2: down
          3: init
          4: up
          5: failing
      - tag: bfd_session_diag
        symbol:
          OID: 1.3.6.1.2.1.222.1.2.1.13
          name: bfdSessDiag
        mapping:
          0: no_diagnostic
          1: control_detection_time_expired
          2: echo_function_failed
          3: neighbor_signaled_session_down
          4: forwarding_plane_reset
          5: path_down
          6: concatenated_path_down
          7: administratively_down
          8: reverse_concatenated_path_down
          9: mis_connectivity_defect
      - tag: neighbor
        symbol:
          OID: 1.3.6.1.2.1.222.1.2.1.22
          name: bfdSessDstAddr
      - tag: bfd_session_index
        index: 1

  - MIB: BFD-STD-MIB
    table:
      name: bfdSessPerfTable
      OID: 1.3.6.1.2.1.222.1.3
    symbols:
      - OID: 1.3.6.1.2.1.222.1.3.1.1
        name: bfdSessPerfCtrlPktIn
      - OID: 1.3.6.1.2.1.222.1.3.1.2
        name: bfdSessPerfCtrlPktOut
      - OID: 1.3.6.1.2.1.222.1.3.1.12
        name: bfdSessPerfSessUpCount
    metric_tags:
      - tag: bfd_session_index
        index: 1
