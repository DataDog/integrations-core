# Rules for stripping specific lines from wheel contents
# Each rule specifies a package pattern and line patterns to remove, `strip_docstrings = true`
# to empty Python docstrings (optionally retaining lines matching `keep_docstring_line_patterns`),
# or both

# Example: add another rule like this
# [[rules]]
# package_pattern = "some_foo*"
# file_pattern = "*.py"
# line_patterns = [
#     "^\\s*# bar:",
#     "^\\s*baz\\(",
# ]


[[rules]]
# pysnmp_mibs contains many MIB definition files with debug/documentation.
# These lines are not need because we never set loadTexts to True.
package_pattern = "pysnmp_mibs*"
file_pattern = "*.py"
line_patterns = [
    "^\\s*if mibBuilder\\.loadTexts:",
]

[[rules]]
# pymongo.asynchronous is removed in files_to_remove.toml; drop the eager imports of it.
package_pattern = "pymongo*"
file_pattern = "*.py"
# Keep runtime code and data; embedded API documentation is not used by the Agent.
strip_docstrings = true
line_patterns = [
    "^from pymongo\\.asynchronous\\.mongo_client import AsyncMongoClient$",
    "^from pymongo\\.asynchronous\\.helpers import _getaddrinfo$",
    "^\\s*\"AsyncMongoClient\",$",
]

[[rules]]
# Generated Kubernetes model classes do not read their docstrings at runtime.
package_pattern = "kubernetes-*"
file_pattern = "kubernetes/client/models/*.py"
strip_docstrings = true

[[rules]]
# kubernetes.watch.Watch parses only `:return:` and `:param bool follow:` from API docstrings.
# Retain those directive lines so Watch keeps working while dropping the rest of the prose.
package_pattern = "kubernetes-*"
file_pattern = "kubernetes/client/api/*.py"
strip_docstrings = true
keep_docstring_line_patterns = [
    "^\\s*:return:",
    "^\\s*:param bool follow:",
]

[[rules]]
# The generated Cloudera Manager API client does not read its docstrings at runtime.
package_pattern = "cm_client-*"
file_pattern = "*.py"
strip_docstrings = true

[[rules]]
# openstacksdk does not read its docstrings at runtime.
package_pattern = "openstacksdk-*"
file_pattern = "*.py"
strip_docstrings = true

[[rules]]
# ddtrace only reads the docstrings of user-defined LLM tools, never its own.
package_pattern = "ddtrace-*"
file_pattern = "*.py"
strip_docstrings = true

[[rules]]
# redis-py does not read its docstrings at runtime.
package_pattern = "redis-*"
file_pattern = "*.py"
strip_docstrings = true

[[rules]]
# The Hazelcast client does not read its docstrings at runtime.
package_pattern = "hazelcast_python_client-*"
file_pattern = "*.py"
strip_docstrings = true
