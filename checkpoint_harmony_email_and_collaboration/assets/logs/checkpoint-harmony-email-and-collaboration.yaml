pipeline:
  type: pipeline
  name: Check Point Harmony Email & Collaboration
  enabled: true
  filter:
    query: source:checkpoint-harmony-email-and-collaboration
  processors:
    - type: category-processor
      name: Category processor for creating `service` from SaaS Application
      enabled: true
      categories:
        - filter:
            query: "@event.security_event.entity_payload.saas:o*365_emails"
          name: office365_emails
        - filter:
            query: "@event.security_event.entity_payload.saas:g*mail"
          name: google_mail
        - filter:
            query: "@event.security_event.entity_payload.saas:o*365_onedrive"
          name: office365_onedrive
        - filter:
            query: "@event.security_event.entity_payload.saas:o*365_sharepoint"
          name: office365_sharepoint
        - filter:
            query: "@event.security_event.entity_payload.saas:dropbox*"
          name: dropbox
        - filter:
            query: "@event.security_event.entity_payload.saas:box*"
          name: box
        - filter:
            query: "@event.security_event.entity_payload.saas:g*drive"
          name: google_drive
        - filter:
            query: "@event.security_event.entity_payload.saas:sharefile*"
          name: sharefile
        - filter:
            query: "@event.security_event.entity_payload.saas:slack*"
          name: slack
        - filter:
            query: "@event.security_event.entity_payload.saas:ms_teams"
          name: ms_teams
      target: service
    - type: service-remapper
      name: Define `service` as the official service of the log
      enabled: true
      sources:
        - service
    - type: date-remapper
      name: Define `event.security_event.entity_info.entity_created` as the official
        date of the log
      enabled: true
      sources:
        - event.security_event.entity_info.entity_created
    - type: message-remapper
      name: Define `event.security_event.entity_payload.description_text` as the
        official message of the log
      enabled: true
      sources:
        - event.security_event.entity_payload.description_text
    - type: attribute-remapper
      name: Map `event.entity.entity_payload.sender_client_ip` to `network.client.ip`
      enabled: true
      sources:
        - event.entity.entity_payload.sender_client_ip
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: geo-ip-parser
      name: Extracting geolocation information from the client IP
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - name: Lookup on `event.security_event.entity_payload.matched_security_tool` to
        `matched_security_tool_name`
      enabled: true
      source: event.security_event.entity_payload.matched_security_tool
      target: matched_security_tool_name
      lookupTable: |-
        avanan_ap_scan,Smart-Phish
        cp_threat_extraction_info,Checkpoint Threat
        avanan_dlp,SmartDLP
        shadow_it_emails_scan,Shadow IT Emails
        avanan_url,URL Reputation
        checkpoint2,Check Point Sandblast
        ms_defender_scan,Microsoft 365 Defender
        clicktime_protection_scan,Click-Time Protection
      type: lookup-processor
    - name: Lookup on `service` to `saas_name`
      enabled: true
      source: service
      target: saas_name
      lookupTable: |-
        office365_emails,Office 365 Mail
        google_mail,Gmail
        office365_onedrive,Office 365 OneDrive
        office365_sharepoint,Office 365 Sharepoint
        ms_teams,Microsoft Teams
        dropbox,Dropbox
        google_drive,Google Drive
        box,Box
        slack,Slack
        sharefile,Citrix ShareFile
      type: lookup-processor
    - name: Lookup on `event.security_event.entity_payload.confidence_level` to
        `confidence_level`
      enabled: true
      source: event.security_event.entity_payload.confidence_level
      target: confidence_level
      lookupTable: |-
        1,Low
        2,Medium-Low
        3,Medium
        4,Medium-High
        5,High
      defaultLookup: N/A
      type: lookup-processor
    - name: Lookup on `event.security_event.entity_payload.severity` to `severity`
      enabled: true
      source: event.security_event.entity_payload.severity
      target: severity
      lookupTable: |-
        1,Very Low
        2,Low
        3,Medium
        4,High
        5,Critical
      type: lookup-processor
    - name: Lookup on `severity` to `status`
      enabled: true
      source: severity
      target: status
      lookupTable: |-
        Very Low,info
        Low,notice
        Medium,warning
        High,critical
        Critical,alert
      type: lookup-processor
    - type: status-remapper
      name: Define `status` as the official status of the log
      enabled: true
      sources:
        - status
    - type: url-parser
      name: Extracts information from `event.entity.entity_payload.download_url`
      enabled: true
      sources:
        - event.entity.entity_payload.download_url
      target: download_url_details
      normalizeEndingSlashes: false
    - type: pipeline
      name: "Processing for superman anomaly events"
      enabled: true
      filter:
        query: "@event.security_event.entity_payload.event_metadata.metadata_json.anoma\
          ly_type:superman_anomaly"
      processors:
        - type: grok-parser
          name: Extract user email from superman anomaly events
          enabled: true
          source: message
          samples:
            - "test.user@example.com performed geo-suspicious events: logged
              in from India (10.10.10.10) and after 49 seconds logged in from
              India (10.10.10.20)"
          grok:
            supportRules: ""
            matchRules: extract_user_email %{regex(".*(?= performed)"):usr.email} performed
              %{data}
    - type: pipeline
      name: OCSF pre transformations
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: '@event.security_event.entity_payload.category:*'
      processors:
        - type: string-builder-processor
          name: Add product name
          enabled: true
          template: Harmony Email & Collaboration
          target: ocsf.metadata.product.name
          replaceMissing: false
        - type: string-builder-processor
          name: Add product vendor
          enabled: true
          template: Check Point
          target: ocsf.metadata.product.vendor_name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `event.security_event.entity_payload.category` to `ocsf.metadata.event_code`
          enabled: true
          sources:
            - event.security_event.entity_payload.category
          sourceType: attribute
          target: ocsf.metadata.event_code
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: grok-parser
          name: Parse `event.security_event.time` to `ocsf.time`
          enabled: true
          source: event.security_event.time
          samples:
            - '2025-03-31T05:28:26.530183Z'
            - '2026-11-09T22:12:21.832445'
          grok:
            supportRules: ''
            matchRules: |
              zulu6 %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'","UTC"):ocsf.time}
              zulu0 %{date("yyyy-MM-dd'T'HH:mm:ss'Z'","UTC"):ocsf.time}
              naive6 %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSSS","UTC"):ocsf.time}
              naive0 %{date("yyyy-MM-dd'T'HH:mm:ss","UTC"):ocsf.time}
        - type: grok-parser
          name: Parse `message` to `ocsf.message`
          enabled: true
          source: message
          samples:
            - Phishing attempt detected in an email from user1@example.com - 'Example subject'
          grok:
            supportRules: ''
            matchRules: |
              msg %{regex("[\\s\\S]+"):ocsf.message}
    - type: pipeline
      name: OCSF sub pipeline for class Detection Finding [2004] (Email and File)
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: '@event.security_event.entity_payload.category:(phishing OR suspicious_phishing OR suspected_phishing OR user_reported_phishing OR spam OR graymail OR malware OR suspicious_malware OR suspected_malware OR malicious_url OR malicious_url_click OR alert OR shadow_it)'
      processors:
        - type: category-processor
          name: ocsf.is_alert
          enabled: true
          categories:
            - filter:
                query: '@event.security_event.entity_payload.category:(spam OR graymail)'
              name: 'false'
            - filter:
                query: '@event.security_event.entity_payload.category:*'
              name: 'true'
          target: ocsf.is_alert
        - type: grok-parser
          name: Parse `ocsf.is_alert` to boolean
          enabled: true
          source: ocsf.is_alert
          samples:
            - 'true'
            - 'false'
          grok:
            supportRules: ''
            matchRules: |
              to_bool %{boolean("true","false"):ocsf.is_alert}
        - type: array-processor
          name: Append `event.security_event.entity_payload.category` to `ocsf.finding_info.types`
          enabled: true
          operation:
            source: event.security_event.entity_payload.category
            target: ocsf.finding_info.types
            preserveSource: true
            type: append
        - type: array-processor
          name: Append `event.security_event.entity_payload.event_metadata.phishing_category` to `ocsf.finding_info.types`
          enabled: true
          operation:
            source: event.security_event.entity_payload.event_metadata.phishing_category
            target: ocsf.finding_info.types
            preserveSource: true
            type: append
        - type: grok-parser
          name: Parse `event.security_event.entity_info.entity_created` to `ocsf.finding_info.created_time`
          enabled: true
          source: event.security_event.entity_info.entity_created
          samples:
            - '2025-03-31T05:28:24.323007+00:00'
            - '2025-03-31T06:44:21+00:00'
          grok:
            supportRules: ''
            matchRules: |
              frac6 %{date("yyyy-MM-dd'T'HH:mm:ss.SSSSSSZZ"):ocsf.finding_info.created_time}
              frac0 %{date("yyyy-MM-dd'T'HH:mm:ssZZ"):ocsf.finding_info.created_time}
        - type: arithmetic-processor
          name: Compute `ocsf.finding_info.modified_time` in milliseconds from `event.security_event.entity_payload.latest_change_time`
          enabled: true
          expression: event.security_event.entity_payload.latest_change_time * 1000
          target: ocsf.finding_info.modified_time
          replaceMissing: false
        - type: string-builder-processor
          name: Add risk details
          enabled: true
          template: '%{event.security_event.entity_payload.event_metadata.ap_detection_reasons}'
          target: ocsf.risk_details
          replaceMissing: false
        - type: attribute-remapper
          name: Map `event.security_event.saas_info.entity_id` to `ocsf.resource.uid`
          enabled: true
          sources:
            - event.security_event.saas_info.entity_id
          sourceType: attribute
          target: ocsf.resource.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: attribute-remapper
          name: Map `event.security_event.saas_info.entity_type` to `ocsf.resource.type`
          enabled: true
          sources:
            - event.security_event.saas_info.entity_type
          sourceType: attribute
          target: ocsf.resource.type
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: attribute-remapper
          name: Map `event.entity.entity_payload.subject` to `ocsf.resource.name`
          enabled: true
          sources:
            - event.entity.entity_payload.subject
          sourceType: attribute
          target: ocsf.resource.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: array-processor
          name: Move SaaS entity into resources array
          enabled: true
          operation:
            source: ocsf.resource
            target: ocsf.resources
            preserveSource: false
            type: append
        - type: attribute-remapper
          name: Map `event.security_event.entity_payload.shadow_it_application` to `ocsf.resource_app.uid`
          enabled: true
          sources:
            - event.security_event.entity_payload.shadow_it_application
          sourceType: attribute
          target: ocsf.resource_app.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: attribute-remapper
          name: Map `event.security_event.entity_payload.shadow_it_app_display_name`, `event.security_event.entity_payload.shadow_it_application` to `ocsf.resource_app.name`
          enabled: true
          sources:
            - event.security_event.entity_payload.shadow_it_app_display_name
            - event.security_event.entity_payload.shadow_it_application
          sourceType: attribute
          target: ocsf.resource_app.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: array-processor
          name: Append `event.security_event.entity_payload.shadow_it_app_category` to `ocsf.resource_app.labels`
          enabled: true
          operation:
            source: event.security_event.entity_payload.shadow_it_app_category
            target: ocsf.resource_app.labels
            preserveSource: true
            type: append
        - type: array-processor
          name: Move shadow IT app into resources array
          enabled: true
          operation:
            source: ocsf.resource_app
            target: ocsf.resources
            preserveSource: false
            type: append
        - type: grok-parser
          name: Parse `event.entity.entity_payload.from_email` to `ocsf.evidence.email.from`
          enabled: true
          source: event.entity.entity_payload.from_email
          samples:
            - dummy@alerting-services.com
          grok:
            supportRules: ''
            matchRules: |
              email %{regex("[^@\\s]+@[^@\\s]+\\.[^@\\s]+"):ocsf.evidence.email.from}
        - type: attribute-remapper
          name: Map `event.entity.entity_payload.to` to `ocsf.evidence.email.to`
          enabled: true
          sources:
            - event.entity.entity_payload.to
          sourceType: attribute
          target: ocsf.evidence.email.to
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: attribute-remapper
          name: Map `event.entity.entity_payload.to` to `ocsf.evidence.email.to_mailboxes`
          enabled: true
          sources:
            - event.entity.entity_payload.to
          sourceType: attribute
          target: ocsf.evidence.email.to_mailboxes
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: array-processor
          name: Append `event.entity.entity_payload.orig_recipient` to `ocsf.evidence.email.delivered_to_list`
          enabled: true
          operation:
            source: event.entity.entity_payload.orig_recipient
            target: ocsf.evidence.email.delivered_to_list
            preserveSource: true
            type: append
        - type: attribute-remapper
          name: Map `event.entity.entity_payload.cc` to `ocsf.evidence.email.cc`
          enabled: true
          sources:
            - event.entity.entity_payload.cc
          sourceType: attribute
          target: ocsf.evidence.email.cc
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: array-processor
          name: Append `event.entity.entity_payload.reply_to_email` to `ocsf.evidence.email.reply_to_mailboxes`
          enabled: true
          operation:
            source: event.entity.entity_payload.reply_to_email
            target: ocsf.evidence.email.reply_to_mailboxes
            preserveSource: true
            type: append
        - type: attribute-remapper
          name: Map `event.entity.entity_payload.subject` to `ocsf.evidence.email.subject`
          enabled: true
          sources:
            - event.entity.entity_payload.subject
          sourceType: attribute
          target: ocsf.evidence.email.subject
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: attribute-remapper
          name: Map `event.entity.entity_payload.internet_message_id` to `ocsf.evidence.email.message_uid`
          enabled: true
          sources:
            - event.entity.entity_payload.internet_message_id
          sourceType: attribute
          target: ocsf.evidence.email.message_uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: attribute-remapper
          name: Map `event.security_event.saas_info.entity_id` to `ocsf.evidence.email.uid`
          enabled: true
          sources:
            - event.security_event.saas_info.entity_id
          sourceType: attribute
          target: ocsf.evidence.email.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: attribute-remapper
          name: Map `event.entity.entity_payload.size` to `ocsf.evidence.email.size`
          enabled: true
          sources:
            - event.entity.entity_payload.size
          sourceType: attribute
          target: ocsf.evidence.email.size
          targetType: attribute
          targetFormat: integer
          preserveSource: true
          overrideOnConflict: true
        - type: grok-parser
          name: Parse `event.entity.entity_payload.sender_client_ip` to `ocsf.tmp_xoip`
          enabled: true
          source: event.entity.entity_payload.sender_client_ip
          samples:
            - 203.0.113.107
            - 0.0.0.0
          grok:
            supportRules: ''
            matchRules: |
              sentinel 0\.0\.0\.0
              valid %{ip:ocsf.tmp_xoip}
        - type: array-processor
          name: Move sender client IP into x_originating_ip array
          enabled: true
          operation:
            source: ocsf.tmp_xoip
            target: ocsf.evidence.email.x_originating_ip
            preserveSource: false
            type: append
        - type: array-map-processor
          name: Map `event.entity.entity_payload.email_links` to `ocsf.evidence.email.urls`
          enabled: true
          source: event.entity.entity_payload.email_links
          target: ocsf.evidence.email.urls
          preserveSource: true
          processors:
            - type: attribute-remapper
              name: Map `$sourceElem` to `$targetElem.url_string`
              sources:
                - $sourceElem
              target: $targetElem.url_string
              preserveSource: true
              overrideOnConflict: false
        - type: array-map-processor
          name: Map `event.entity.entity_payload.attachments` to `ocsf.evidence.email.files`
          enabled: true
          source: event.entity.entity_payload.attachments
          target: ocsf.evidence.email.files
          preserveSource: true
          processors:
            - type: attribute-remapper
              name: Map `$sourceElem.name` to `$targetElem.name`
              sources:
                - $sourceElem.name
              target: $targetElem.name
              preserveSource: true
              overrideOnConflict: false
            - type: attribute-remapper
              name: Map `$sourceElem.size` to `$targetElem.size`
              sources:
                - $sourceElem.size
              target: $targetElem.size
              preserveSource: true
              overrideOnConflict: false
            - type: attribute-remapper
              name: Map `$sourceElem.mimetype` to `$targetElem.mime_type`
              sources:
                - $sourceElem.mimetype
              target: $targetElem.mime_type
              preserveSource: true
              overrideOnConflict: false
            - type: attribute-remapper
              name: Map `$sourceElem.entity_id` to `$targetElem.uid`
              sources:
                - $sourceElem.entity_id
              target: $targetElem.uid
              preserveSource: true
              overrideOnConflict: false
            - type: string-builder-processor
              name: Add file type id
              template: '1'
              target: $targetElem.type_id
              replaceMissing: false
            - type: string-builder-processor
