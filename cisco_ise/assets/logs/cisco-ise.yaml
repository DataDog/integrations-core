              mac_dotted %{regex("[0-9A-Fa-f][0-9A-Fa-f]"):cisco_ise.endpoint.mac_octets.o1:lowercase}%{regex("[0-9A-Fa-f][0-9A-Fa-f]"):cisco_ise.endpoint.mac_octets.o2:lowercase}\.%{regex("[0-9A-Fa-f][0-9A-Fa-f]"):cisco_ise.endpoint.mac_octets.o3:lowercase}%{regex("[0-9A-Fa-f][0-9A-Fa-f]"):cisco_ise.endpoint.mac_octets.o4:lowercase}\.%{regex("[0-9A-Fa-f][0-9A-Fa-f]"):cisco_ise.endpoint.mac_octets.o5:lowercase}%{regex("[0-9A-Fa-f][0-9A-Fa-f]"):cisco_ise.endpoint.mac_octets.o6:lowercase}
        - type: string-builder-processor
