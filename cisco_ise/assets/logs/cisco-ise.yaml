            tets.o4}:%{cisco_ise.endpoint.mac_octets.o5}:%{cisco_ise.endpoint.m\
            ac_octets.o6}"
          target: cisco_ise.endpoint.mac
          replaceMissing: false
        - type: grok-parser
          name: Parse TACACS+ command
          enabled: true
          source: cisco_ise.attributes.CmdSet
