      grok:
        supportRules: ""
        matchRules: cisco_ise_message <%{integer:syslog.priority}>(%{date("MMM  d
          HH:mm:ss")}|%{date("MMM d HH:mm:ss")}) %{notSpace:syslog.hostname}
          CISE_%{notSpace:cisco_ise.category} %{notSpace:cisco_ise.message_id}
          %{integer:cisco_ise.segment.total} %{integer:cisco_ise.segment.number}
          %{data:message}
    - type: message-remapper
      name: Define message
      enabled: true
      sources:
        - message
    - type: attribute-remapper
      name: Map ISE node to cisco_ise.node
      enabled: true
      sources:
        - syslog.hostname
      sourceType: attribute
      target: cisco_ise.node
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: category-processor
      name: Define severity from the syslog priority
      enabled: true
      categories:
        - filter:
            query: "@syslog.priority:(128 OR 136 OR 144 OR 152 OR 160 OR 168 OR 176 OR 184)"
          name: emergency
        - filter:
            query: "@syslog.priority:(129 OR 137 OR 145 OR 153 OR 161 OR 169 OR 177 OR 185)"
          name: alert
        - filter:
            query: "@syslog.priority:(130 OR 138 OR 146 OR 154 OR 162 OR 170 OR 178 OR 186)"
          name: critical
        - filter:
            query: "@syslog.priority:(131 OR 139 OR 147 OR 155 OR 163 OR 171 OR 179 OR 187)"
          name: error
        - filter:
            query: "@syslog.priority:(132 OR 140 OR 148 OR 156 OR 164 OR 172 OR 180 OR 188)"
          name: warning
        - filter:
            query: "@syslog.priority:(133 OR 141 OR 149 OR 157 OR 165 OR 173 OR 181 OR 189)"
          name: notice
        - filter:
            query: "@syslog.priority:(134 OR 142 OR 150 OR 158 OR 166 OR 174 OR 182 OR 190)"
          name: info
        - filter:
            query: "@syslog.priority:(135 OR 143 OR 151 OR 159 OR 167 OR 175 OR 183 OR 191)"
          name: debug
      target: syslog.severity
    - type: status-remapper
      name: Define status from the syslog priority
      enabled: true
      sources:
        - syslog.severity
