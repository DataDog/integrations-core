name: Cisco ISE
fleet_configurable: true
files:
- name: cisco_ise.yaml
  options:
  - template: logs
    example:
    # type: udp or tcp (both supported).
    - type: udp
      port: <PORT>
      source: cisco-ise
      # Mask what is typed after a secret keyword in TACACS+ commands before it leaves the Agent.
      log_processing_rules:
      - type: mask_sequences
        name: ise_tacacs_cmd_secret
        pattern: '(CmdAV=[^\]=]*?\b(?:secret|password|key|key-string|community|pre-shared-key|auth|priv) )(?:.*?(\s+<cr>\s*\])|[^\]<=]+?(\s*\])|[^\]]+$)'
        replace_placeholder: '${1}********${2}${3}'
      - type: mask_sequences
        name: ise_tacacs_cmdarg_secret
        pattern: '((?:CmdAV|CmdArgAV)=(?:[\w-]*-)?(?:secret|password|key|key-string|community|pre-shared-key|auth|priv) )(?:(?:CmdArgAV=[^ ]* )+?(CmdArgAV=<cr>)|(?:CmdArgAV=[^ <][^ ]* )+?(\])|[^\]]+$)'
        replace_placeholder: '${1}CmdArgAV=******** ${2}${3}'
