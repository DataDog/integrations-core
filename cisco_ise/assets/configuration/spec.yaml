name: Cisco ISE
fleet_configurable: true
files:
- name: cisco_ise.yaml
  options:
  - template: logs
    example:
    # type: udp or tcp (both supported; ISE ends each TCP message with a newline).
    - type: udp
      port: <PORT>
      source: cisco-ise
      # RFC Q1 (proposed answer): mask secrets typed in TACACS+ commands before they leave the Agent.
      # Verified on Agent 7.85.0 with real ISE 3.2 messages (3300, 5202, 5402).
      log_processing_rules:
      - type: mask_sequences
        name: ise_tacacs_cmd_secret
        pattern: '(CmdAV=[^\]=]*?\b(?:secret|password|key|key-string|community|pre-shared-key)(?: [0-9])? )[^ \]<][^ \]]*'
        replace_placeholder: '${1}********'
      - type: mask_sequences
        name: ise_tacacs_cmdarg_secret
        pattern: '(CmdArgAV=(?:secret|password|key|key-string|community|pre-shared-key) (?:CmdArgAV=[0-9] )?CmdArgAV=)[^ <][^ ]*'
        replace_placeholder: '${1}********'
