id: crowdstrike-fdr
metric_id: crowdstrike-fdr
backend_only: false
facets:
  - groups:
      - DNS
    name: Answer Name
    path: dns.answer.name
    source: log
  - groups:
      - DNS
    name: Question Name
    path: dns.question.name
    source: log
  - groups:
      - DNS
    name: Question Type
    path: dns.question.type
    source: log
  - groups:
      - Event
    name: Event Category
    path: evt.category
    source: log
  - groups:
      - Event
    name: Event Name
    path: evt.name
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Client IP
    path: network.client.ip
    source: log
  - groups:
      - Web Access
    name: Client Port
    path: network.client.port
    source: log
  - groups:
      - Geoip
    name: Destination City Name
    path: network.destination.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Destination Continent Code
    path: network.destination.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Destination Continent Name
    path: network.destination.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Destination Country ISO Code
    path: network.destination.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Destination Country Name
    path: network.destination.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Destination Subdivision ISO Code
    path: network.destination.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Destination Subdivision Name
    path: network.destination.geoip.subdivision.name
    source: log
  - groups:
      - Web Access
    name: Destination IP
    path: network.destination.ip
    source: log
  - groups:
      - Web Access
    name: Destination Port
    path: network.destination.port
    source: log
  - groups:
      - User
    name: User ID
    path: usr.id
    source: log
  - groups:
      - User
    name: User Name
    path: usr.name
    source: log
pipeline:
  type: pipeline
  name: CrowdStrike FDR
  enabled: true
  filter:
    query: source:crowdstrike-fdr
  processors:
    - type: category-processor
      name: Classify the CrowdStrike FDR dataset from the S3 object path
      enabled: true
      categories:
        - filter:
            query: "s3_key:*/data/*"
          name: sensor
        - filter:
            query: "s3_key:*/fdrv2/userinfo/*"
          name: userinfo
      target: crowdstrike_fdr.dataset
    - type: arithmetic-processor
      name: Convert `ContextTimeStamp` epoch to milliseconds epoch
      enabled: true
      expression: ContextTimeStamp * 1000
      target: ContextTimeStamp
      replaceMissing: false
    # `UTCTimestamp` is deliberately not scaled: on the detection feed it is
    # already an epoch in milliseconds, so multiplying it would push the log
    # thousands of years into the future.
    # `timestamp` is the last resort for event shapes that carry it. User inventory
    # may contain only older vendor timestamps such as `_time`; when no supported
    # event timestamp exists, retain intake time so newly ingested inventory remains
    # visible in recent searches.
    - type: date-remapper
      name: Define `ContextTimeStamp`, `UTCTimestamp`, `timestamp` as the official
        date of the log
      enabled: true
      sources:
        - ContextTimeStamp
        - UTCTimestamp
        - timestamp
    # Sensor telemetry carries `event_simpleName`. Detections arrive on the
    # secondary FDR feed, which has no `event_simpleName` and identifies the
    # payload with `ExternalApiType` instead, so normalize it onto the same field
    # before the remapper runs.
    - name: Lookup on `ExternalApiType` Field
      enabled: true
      source: ExternalApiType
      target: event_simpleName
      lookupTable: |-
        Event_DetectionSummaryEvent,DetectionSummaryEvent
        Event_EppDetectionSummaryEvent,DetectionSummaryEvent
      type: lookup-processor
    - type: attribute-remapper
      name: Map `event_simpleName` to `evt.name`
      enabled: true
      sources:
        - event_simpleName
      sourceType: attribute
      target: evt.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: category-processor
      name: Category processor for creating `evt.category`
      enabled: true
      categories:
        - filter:
            query: "@evt.name:ProcessRollup2"
          name: process
        - filter:
            query: "@evt.name:(NetworkConnectIP4 OR NetworkConnectIP6 OR NetworkConnectIP4Blocked OR NetworkConnectIP6Blocked OR NetworkConnectIP4DetectInfo OR NetworkConnectIP6DetectInfo)"
          name: network
        - filter:
            query: "@evt.name:(DnsRequest OR DnsRequestDetectInfo OR DNSRequestDetectInfo)"
          name: dns
        - filter:
            query: "@evt.name:(UserLogon OR UserIdentity)"
          name: authentication
        - filter:
            query: "@evt.name:DetectionSummaryEvent"
          name: detection
      target: evt.category
    - type: attribute-remapper
      name: Map `ContextProcessId`, `TargetProcessId` to `crowdstrike_fdr.process.id`
      enabled: true
      sources:
        - ContextProcessId
        - TargetProcessId
      sourceType: attribute
      target: crowdstrike_fdr.process.id
      targetType: attribute
      targetFormat: string
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `ParentProcessId` to `crowdstrike_fdr.process.parent.id`
      enabled: true
      sources:
        - ParentProcessId
      sourceType: attribute
      target: crowdstrike_fdr.process.parent.id
      targetType: attribute
      targetFormat: string
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `UserSid`, `UID`, `UserRid`, `OriginalUserSid` to `usr.id`
      enabled: true
      sources:
        - UserSid
        - UID
        - UserRid
        - OriginalUserSid
      sourceType: attribute
      target: usr.id
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `UserName`, `UserRealName`, `OriginalUserName`,
        `SourceAccountUserName`, `sAMAccountName` to `usr.name`
      enabled: true
      sources:
        - UserName
        - UserRealName
        - OriginalUserName
        - SourceAccountUserName
        - sAMAccountName
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: pipeline
      name: User Inventory
      enabled: true
      filter:
        query: "@crowdstrike_fdr.dataset:userinfo"
      processors:
        - type: attribute-remapper
          name: Map `UserSid_readable` to `usr.id`
          enabled: true
          sources:
            - UserSid_readable
          sourceType: attribute
          target: usr.id
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
    - type: attribute-remapper
      name: Map `LocalAddressIP4`, `LocalAddressIP6`, `SourceEndpointAddressIP4`,
        `SourceEndpointAddressIP6` to `network.client.ip`
      enabled: true
      sources:
        - LocalAddressIP4
        - LocalAddressIP6
        - SourceEndpointAddressIP4
        - SourceEndpointAddressIP6
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    # Kept at the top level rather than inside the network sub-pipeline: which
    # event shapes carry `TargetServerAddress*` is unverified until the sandbox
    # payloads land, and scoping it to a filter would silently drop the mapping
    # for every shape outside that guess.
    - type: attribute-remapper
      name: Map `TargetServerAddressIP4`, `TargetServerAddressIP6` to
        `network.destination.ip`
      enabled: true
      sources:
        - TargetServerAddressIP4
        - TargetServerAddressIP6
      sourceType: attribute
      target: network.destination.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: geo-ip-parser
      name: GeoIP Parser for `network.client.ip`
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - name: Lookup on `event_platform` Field
      enabled: true
      source: event_platform
      target: event_platform_value
      lookupTable: |-
        Win,Windows
        Lin,Linux
        Mac,Mac
        Android,Android
        iOS,iOS
      type: lookup-processor
    - type: pipeline
      name: Process Activity
      enabled: true
      filter:
        query: "@evt.name:ProcessRollup2"
      processors:
        - name: Lookup on `IntegrityLevel` Field
          enabled: true
          source: IntegrityLevel
          target: IntegrityLevelValue
          lookupTable: |-
            0,UNTRUSTED
            4096,LOW
            8192,MEDIUM
            8448,MEDIUM_PLUS
            12288,HIGH
            16384,SYSTEM
            20480,PROTECTED
          type: lookup-processor
        - name: Lookup on `TokenType` Field
          enabled: true
          source: TokenType
          target: TokenTypeValue
          lookupTable: |-
            1,PRIMARY
            2,IMPERSONATION
          type: lookup-processor
        - name: Lookup on `MachOSubType` Field
          enabled: true
          source: MachOSubType
          target: MachOSubTypeValue
          lookupTable: |-
            0,UNKNOWN
            1,EXECUTABLE64
            2,DYLIB64
            3,BUNDLE64
            4,KEXT64
            5,EXECUTABLE32
            6,DYLIB32
            7,BUNDLE32
          type: lookup-processor
    - type: pipeline
      name: Network Activity
      enabled: true
      filter:
        query: "@evt.name:(NetworkConnectIP4 OR NetworkConnectIP6 OR NetworkConnectIP4Blocked OR NetworkConnectIP6Blocked OR NetworkConnectIP4DetectInfo OR NetworkConnectIP6DetectInfo)"
      processors:
        - type: attribute-remapper
          name: Map `LocalPort` to `network.client.port`
          enabled: true
          sources:
            - LocalPort
          sourceType: attribute
          target: network.client.port
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `RemoteAddressIP4`, `RemoteAddressIP6` to
            `network.destination.ip`
          enabled: true
          sources:
            - RemoteAddressIP4
            - RemoteAddressIP6
          sourceType: attribute
          target: network.destination.ip
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `RemotePort` to `network.destination.port`
          enabled: true
          sources:
            - RemotePort
          sourceType: attribute
          target: network.destination.port
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - name: Lookup on `Protocol` Field
          enabled: true
          source: Protocol
          target: ProtocolValue
          lookupTable: |-
            0,IP
            1,ICMP
            2,IGMP
            6,TCP
            17,UDP
            41,IPV6
            47,GRE
            58,ICMPV6
            255,UNKNOWN
          type: lookup-processor
        - type: attribute-remapper
          name: Map `ProtocolValue` to `network.protocol`
          enabled: true
          sources:
            - ProtocolValue
          sourceType: attribute
          target: network.protocol
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - name: Lookup on `ConnectionDirection` Field
          enabled: true
          source: ConnectionDirection
          target: ConnectionDirectionValue
          lookupTable: |-
            0,DIRECTION_OUTBOUND
            1,DIRECTION_INBOUND
            2,DIRECTION_NEITHER
            3,DIRECTION_BOTH
            4,DIRECTION_UNKNOWN
          type: lookup-processor
        - name: Lookup on `ConnectionFlags` Field
          enabled: true
          source: ConnectionFlags
          target: ConnectionFlagsValue
          lookupTable: |-
            0,NONE
            1,RAW_SOCKET
            2,PROMISCUOUS_MODE_SIO_RCVALL
            4,PROMISCUOUS_MODE_SIO_RCVALL_IGMPMCAST
            8,PROMISCUOUS_MODE_SIO_RCVALL_MCAST
            16,IS_LOOPBACK
          type: lookup-processor
        - type: geo-ip-parser
          name: GeoIP Parser for `network.destination.ip`
          enabled: true
          sources:
            - network.destination.ip
          target: network.destination.geoip
          ip_processing_behavior: do-nothing
    - type: pipeline
      name: DNS Activity
      enabled: true
      filter:
        query: "@evt.name:(DnsRequest OR DnsRequestDetectInfo OR DNSRequestDetectInfo)"
      processors:
        - type: attribute-remapper
          name: Map `DomainName` to `dns.question.name`
          enabled: true
          sources:
            - DomainName
          sourceType: attribute
          target: dns.question.name
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - name: Lookup on `RequestType` Field
          enabled: true
          source: RequestType
          target: RequestTypeValue
          lookupTable: |-
            0,UNKNOWN
            1,A
            2,NS
            5,CNAME
            6,SOA
            12,PTR
            15,MX
            16,TXT
            28,AAAA
            33,SRV
            64,SVCB
            65,HTTPS
            255,ANY
          type: lookup-processor
        - type: attribute-remapper
          name: Map `RequestTypeValue` to `dns.question.type`
          enabled: true
          sources:
            - RequestTypeValue
          sourceType: attribute
          target: dns.question.type
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `FirstIP4Record`, `FirstIP6Record` to `dns.answer.name`
          enabled: true
          sources:
            - FirstIP4Record
            - FirstIP6Record
          sourceType: attribute
          target: dns.answer.name
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
    - type: pipeline
      name: Authentication Activity
      enabled: true
      filter:
        query: "@evt.name:(UserLogon OR UserIdentity)"
      processors:
        - name: Lookup on `LogonType` Field
          enabled: true
          source: LogonType
          target: LogonTypeValue
          lookupTable: |-
            0,SYSTEM
            2,INTERACTIVE
            3,NETWORK
            4,BATCH
            5,SERVICE
            6,PROXY
            7,UNLOCK
            8,NETWORK_CLEARTEXT
            9,NEW_CREDENTIALS
            10,REMOTE_INTERACTIVE
            11,CACHED_INTERACTIVE
            12,CACHED_REMOTE_INTERACTIVE
            13,CACHED_UNLOCK
          type: lookup-processor
        - name: Lookup on `UserIsAdmin` Field
          enabled: true
          source: UserIsAdmin
          target: UserIsAdminValue
          lookupTable: |-
            0,False
            1,True
          type: lookup-processor
        - name: Lookup on `UserLogonFlags` Field
          enabled: true
          source: UserLogonFlags
          target: UserLogonFlagsValue
          lookupTable: |-
            0,NONE
            1,LOGON_IS_SYNTHETIC
            2,USER_IS_ADMIN
            4,USER_IS_LOCAL
            8,USER_IS_BUILT_IN
            16,USER_IDENTITY_MISSING
          type: lookup-processor
    - type: pipeline
      name: Detections
      enabled: true
      filter:
        query: "@evt.name:DetectionSummaryEvent"
      processors:
        # `Event_DetectionSummaryEvent` grades `Severity` 0-5 while
        # `Event_EppDetectionSummaryEvent` grades it in steps of 20 from
        # Informational (10) to Critical (90); both feeds are normalized onto
        # `@evt.name:DetectionSummaryEvent`, so both scales are decoded here.
        - name: Lookup on `Severity` to `status`
          enabled: true
          source: Severity
          target: status
          lookupTable: |-
            0,Info
            1,Info
            2,Notice
            3,Warning
            4,Error
            5,Critical
            10,Info
            30,Notice
            50,Warning
            70,Error
            90,Critical
          type: lookup-processor
        - type: status-remapper
          name: Define `status` as the official status of the log
          enabled: true
          sources:
            - status
        - type: attribute-remapper
          name: Map `SHA256String` to `SHA256HashData`
          enabled: true
          sources:
            - SHA256String
          sourceType: attribute
          target: SHA256HashData
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `MD5String` to `MD5HashData`
          enabled: true
          sources:
            - MD5String
          sourceType: attribute
          target: MD5HashData
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
