pipeline:
  type: pipeline
  name: CrowdStrike FDR
  enabled: true
  filter:
    query: source:crowdstrike-fdr
  processors:
    - type: arithmetic-processor
      name: Convert `ContextTimeStamp` epoch to milliseconds epoch
      enabled: true
      expression: ContextTimeStamp * 1000
      target: ContextTimeStamp
      replaceMissing: false
    # `UTCTimestamp` is deliberately not scaled: on the detection feed it is
    # already an epoch in milliseconds, so multiplying it would push the log
    # thousands of years into the future.
    # `timestamp` is the last resort: it is the sensor upload time rather than the
    # time the activity occurred, and it is the only date field present on every
    # FDR event shape.
    - type: date-remapper
      name: Define `ContextTimeStamp`, `UTCTimestamp`, `timestamp` as the official
        date of the log
      enabled: true
      sources:
        - ContextTimeStamp
        - UTCTimestamp
        - timestamp
    # Sensor telemetry carries `event_simpleName`. Detections arrive on the
    # secondary FDR feed, which has no `event_simpleName` and identifies the
    # payload with `ExternalApiType` instead, so normalize it onto the same field
    # before the remapper runs.
    - name: Lookup on `ExternalApiType` Field
      enabled: true
      source: ExternalApiType
      target: event_simpleName
      lookupTable: |-
        Event_DetectionSummaryEvent,DetectionSummaryEvent
        Event_EppDetectionSummaryEvent,DetectionSummaryEvent
      type: lookup-processor
    - type: attribute-remapper
      name: Map `event_simpleName` to `evt.name`
      enabled: true
      sources:
        - event_simpleName
      sourceType: attribute
      target: evt.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: category-processor
      name: Category processor for creating `evt.category`
      enabled: true
      categories:
        - filter:
            query: "@evt.name:ProcessRollup2"
          name: process
        - filter:
            query: "@evt.name:(NetworkConnectIP4 OR NetworkConnectIP6)"
          name: network
        - filter:
            query: "@evt.name:DnsRequest"
          name: dns
        - filter:
            query: "@evt.name:(UserLogon OR UserIdentity)"
          name: authentication
        - filter:
            query: "@evt.name:DetectionSummaryEvent"
          name: detection
      target: evt.category
    - type: attribute-remapper
      name: Map `UserSid`, `UID`, `UserRid`, `OriginalUserSid` to `usr.id`
      enabled: true
      sources:
        - UserSid
        - UID
        - UserRid
        - OriginalUserSid
      sourceType: attribute
      target: usr.id
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `UserName`, `UserRealName`, `OriginalUserName`,
        `SourceAccountUserName`, `sAMAccountName` to `usr.name`
      enabled: true
      sources:
        - UserName
        - UserRealName
        - OriginalUserName
        - SourceAccountUserName
        - sAMAccountName
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    # `aip` is the sensor's public egress address as observed by the CrowdStrike
    # cloud, so it is the only routable address present on every event and the
    # only one worth geolocating. `LocalAddressIP4`/`LocalAddressIP6` are the
    # endpoint's private NIC addresses and are left unmapped.
    - type: attribute-remapper
      name: Map `aip` to `network.client.ip`
      enabled: true
      sources:
        - aip
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: geo-ip-parser
      name: GeoIP Parser for `network.client.ip`
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - name: Lookup on `event_platform` Field
      enabled: true
      source: event_platform
      target: event_platform_value
      lookupTable: |-
        Win,Windows
        Lin,Linux
        Mac,Mac
        Android,Android
        iOS,iOS
      type: lookup-processor
    - type: pipeline
      name: Process Activity
      enabled: true
      filter:
        query: "@evt.name:ProcessRollup2"
      processors:
        - name: Lookup on `IntegrityLevel` Field
          enabled: true
          source: IntegrityLevel
          target: IntegrityLevelValue
          lookupTable: |-
            0,UNTRUSTED
            4096,LOW
            8192,MEDIUM
            8448,MEDIUM_PLUS
            12288,HIGH
            16384,SYSTEM
            20480,PROTECTED
          type: lookup-processor
        - name: Lookup on `TokenType` Field
          enabled: true
          source: TokenType
          target: TokenTypeValue
          lookupTable: |-
            1,PRIMARY
            2,IMPERSONATION
          type: lookup-processor
        - name: Lookup on `MachOSubType` Field
          enabled: true
          source: MachOSubType
          target: MachOSubTypeValue
          lookupTable: |-
            0,UNKNOWN
            1,EXECUTABLE64
            2,DYLIB64
            3,BUNDLE64
            4,KEXT64
            5,EXECUTABLE32
            6,DYLIB32
            7,BUNDLE32
          type: lookup-processor
    - type: pipeline
      name: Network Activity
      enabled: true
      filter:
        query: "@evt.name:(NetworkConnectIP4 OR NetworkConnectIP6)"
      processors:
        - type: attribute-remapper
          name: Map `LocalPort` to `network.client.port`
          enabled: true
          sources:
            - LocalPort
          sourceType: attribute
          target: network.client.port
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `RemoteAddressIP4`, `RemoteAddressIP6` to
            `network.destination.ip`
          enabled: true
          sources:
            - RemoteAddressIP4
            - RemoteAddressIP6
          sourceType: attribute
          target: network.destination.ip
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `RemotePort` to `network.destination.port`
          enabled: true
          sources:
            - RemotePort
          sourceType: attribute
          target: network.destination.port
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - name: Lookup on `Protocol` Field
          enabled: true
          source: Protocol
          target: ProtocolValue
          lookupTable: |-
            0,IP
            1,ICMP
            2,IGMP
            6,TCP
            17,UDP
            41,IPV6
            47,GRE
            58,ICMPV6
            255,UNKNOWN
          type: lookup-processor
        - name: Lookup on `ConnectionDirection` Field
          enabled: true
          source: ConnectionDirection
          target: ConnectionDirectionValue
          lookupTable: |-
            0,DIRECTION_OUTBOUND
            1,DIRECTION_INBOUND
            2,DIRECTION_NEITHER
            3,DIRECTION_BOTH
            4,DIRECTION_UNKNOWN
          type: lookup-processor
        - name: Lookup on `ConnectionFlags` Field
          enabled: true
          source: ConnectionFlags
          target: ConnectionFlagsValue
          lookupTable: |-
            0,NONE
            1,RAW_SOCKET
            2,PROMISCUOUS_MODE_SIO_RCVALL
            4,PROMISCUOUS_MODE_SIO_RCVALL_IGMPMCAST
            8,PROMISCUOUS_MODE_SIO_RCVALL_MCAST
            16,IS_LOOPBACK
          type: lookup-processor
        - type: geo-ip-parser
          name: GeoIP Parser for `network.destination.ip`
          enabled: true
          sources:
            - network.destination.ip
          target: network.destination.geoip
          ip_processing_behavior: do-nothing
    - type: pipeline
      name: DNS Activity
      enabled: true
      filter:
        query: "@evt.name:DnsRequest"
      processors:
        - type: attribute-remapper
          name: Map `DomainName` to `dns.question.name`
          enabled: true
          sources:
            - DomainName
          sourceType: attribute
          target: dns.question.name
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - name: Lookup on `RequestType` Field
          enabled: true
          source: RequestType
          target: RequestTypeValue
          lookupTable: |-
            0,UNKNOWN
            1,A
            2,NS
            5,CNAME
            6,SOA
            12,PTR
            15,MX
            16,TXT
            28,AAAA
            33,SRV
            64,SVCB
            65,HTTPS
            255,ANY
          type: lookup-processor
        - type: attribute-remapper
          name: Map `RequestTypeValue` to `dns.question.type`
          enabled: true
          sources:
            - RequestTypeValue
          sourceType: attribute
          target: dns.question.type
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `FirstIP4Record`, `FirstIP6Record` to `dns.answer.name`
          enabled: true
          sources:
            - FirstIP4Record
            - FirstIP6Record
          sourceType: attribute
          target: dns.answer.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
    - type: pipeline
      name: Authentication Activity
      enabled: true
      filter:
        query: "@evt.name:(UserLogon OR UserIdentity)"
      processors:
        - name: Lookup on `LogonType` Field
          enabled: true
          source: LogonType
          target: LogonTypeValue
          lookupTable: |-
            0,SYSTEM
            2,INTERACTIVE
            3,NETWORK
            4,BATCH
            5,SERVICE
            6,PROXY
            7,UNLOCK
            8,NETWORK_CLEARTEXT
            9,NEW_CREDENTIALS
            10,REMOTE_INTERACTIVE
            11,CACHED_INTERACTIVE
            12,CACHED_REMOTE_INTERACTIVE
            13,CACHED_UNLOCK
          type: lookup-processor
        - name: Lookup on `UserIsAdmin` Field
          enabled: true
          source: UserIsAdmin
          target: UserIsAdminValue
          lookupTable: |-
            0,False
            1,True
          type: lookup-processor
        - name: Lookup on `UserLogonFlags` Field
          enabled: true
          source: UserLogonFlags
          target: UserLogonFlagsValue
          lookupTable: |-
            0,NONE
            1,LOGON_IS_SYNTHETIC
            2,USER_IS_ADMIN
            4,USER_IS_LOCAL
            8,USER_IS_BUILT_IN
            16,USER_IDENTITY_MISSING
          type: lookup-processor
    - type: pipeline
      name: Detections
      enabled: true
      filter:
        query: "@evt.name:DetectionSummaryEvent"
      processors:
        # `Event_DetectionSummaryEvent` grades `Severity` 0-5 while
        # `Event_EppDetectionSummaryEvent` grades it in steps of 20 from
        # Informational (10) to Critical (90); both feeds are normalized onto
        # `@evt.name:DetectionSummaryEvent`, so both scales are decoded here.
        - name: Lookup on `Severity` to `status`
          enabled: true
          source: Severity
          target: status
          lookupTable: |-
            0,Info
            1,Info
            2,Notice
            3,Warning
            4,Error
            5,Critical
            10,Info
            30,Notice
            50,Warning
            70,Error
            90,Critical
          type: lookup-processor
        - type: status-remapper
          name: Define `status` as the official status of the log
          enabled: true
          sources:
            - status
        - type: attribute-remapper
          name: Map `SHA256String` to `SHA256HashData`
          enabled: true
          sources:
            - SHA256String
          sourceType: attribute
          target: SHA256HashData
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `MD5String` to `MD5HashData`
          enabled: true
          sources:
            - MD5String
          sourceType: attribute
          target: MD5HashData
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
