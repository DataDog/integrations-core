[env.collectors.datadog-checks]
check-types = true
mypy-args = [
    "--explicit-package-bases",
]

[[envs.default.matrix]]
python = ["3.13"]
auth = ["password", "api-key"]

[envs.default.overrides]
matrix.auth.env-vars = "EDGECONNECT_E2E_AUTH"

[envs.lab]
python = "3.13"

[envs.lab.env-vars]
USE_EDGECONNECT_LAB = "True"

[envs.lab-api-key]
python = "3.13"

[envs.lab-api-key.env-vars]
USE_EDGECONNECT_LAB = "True"
EDGECONNECT_E2E_AUTH = "api-key"
