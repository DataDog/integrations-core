# One address for every endpoint the istio check scrapes in istio-full:
#   /istiod/metrics          -> live istiod (NodePort 31014 on the k3s node)
#   /mesh/stats/prometheus   -> live client sidecar, merged Envoy + pilot-agent stats (NodePort 31020)
#   /fixtures/<version>/<f>  -> the integration's recorded payloads (../../fixtures), as recorded
#   /replay/<version>/<f>    -> the same recordings with counters scaled per request (replay.js)
# Mounted as the whole nginx.conf because load_module is only valid at the top level.
load_module modules/ngx_http_js_module.so;

events {}

http {
    js_import replay from /etc/nginx/replay.js;
    js_shared_dict_zone zone=replay:1m type=number;

    server {
        listen 15014;

        location /istiod/ {
            proxy_pass http://k3s:31014/;
        }

        location /mesh/ {
            proxy_pass http://k3s:31020/;
        }

        location /fixtures/ {
            root /usr/share/nginx;
            default_type text/plain;
        }

        location /replay/ {
            js_content replay.serve;
        }
    }
}
