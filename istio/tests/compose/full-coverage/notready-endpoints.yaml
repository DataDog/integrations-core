# Rendered by ../../seed.sh and ../../activity-gen.sh with __IP__ set to the
# `notready` pod's IP. See the pilot_endpoint_not_ready drill in drills.yaml.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: notready-1
  namespace: mesh
  labels:
    kubernetes.io/service-name: notready
addressType: IPv4
ports:
  - name: http
    port: 80
    protocol: TCP
endpoints:
  - addresses: ["__IP__"]
    conditions:
      ready: false
      serving: false
      terminating: false
