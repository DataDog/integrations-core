id: intersystems_iris
metric_id: intersystems_iris
backend_only: false
facets:
  - groups:
      - Event
    name: IRIS Facility
    path: iris.facility
    source: log
  - groups:
      - Event
    name: IRIS Severity
    path: iris.severity
    source: log
pipeline:
  type: pipeline
  name: InterSystems IRIS
  enabled: true
  filter:
    query: source:intersystems_iris
  processors:
    - type: grok-parser
      name: Parsing InterSystems IRIS messages.log
      enabled: true
      source: message
      samples:
        - "08/06/26-13:55:02:627 (103291) 1 [Generic.Event] ECP: connection from 'PRIMARY:IP-10-1-57-213:IRISAPP' dropped (127.0.0.1:60308)"
        - "08/06/26-14:02:11:004 (44210) 2 [Utility.Event] License limit exceeded."
        - "08/06/26-14:02:11:050 (44210) 3 [Utility.Event] LMF Error: No valid license key found."
        - "08/07/26-00:30:00:075 (141266) 0 [Utility.Event] [MIRRORING] DELETE: /usr/irissys/mgr/journal/MIRROR-IRISLAB-20260804.001"
        - "08/05/26-14:38:42:383 (23153) 0 [Database.StartExpansion] Starting Expansion for database /usr/irissys/mgr/iristemp/. 10 MB requested."
      grok:
        supportRules: ""
        matchRules: |
          iris_rule %{date("MM/dd/yy-HH:mm:ss:SSS"):iris.timestamp} \(%{integer:iris.pid}\) %{integer:iris.severity} \[%{notSpace:iris.facility}\] %{data:iris.message}
    - type: category-processor
      name: Categorize IRIS severity into a log status
      enabled: true
      categories:
        - filter:
            query: "@iris.severity:0"
          name: info
        - filter:
            query: "@iris.severity:1"
          name: warning
        - filter:
            query: "@iris.severity:(2 OR 3)"
          name: error
      target: iris.status
    - type: status-remapper
      name: Define `iris.status` as the official status of the log
      enabled: true
      sources:
        - iris.status
    - type: date-remapper
      name: Define `iris.timestamp` as the official date of the log
      enabled: true
      sources:
        - iris.timestamp
    - type: message-remapper
      name: Define `iris.message` as the official message of the log
      enabled: true
      sources:
        - iris.message
