name: intersystems_iris
files:
- name: intersystems_iris.yaml
  options:
  - template: init_config
    options:
    - template: init_config/openmetrics
  - template: instances
    options:
    - template: instances/openmetrics
      overrides:
        openmetrics_endpoint.value.example: http://%%host%%:52773/api/monitor/metrics
        openmetrics_endpoint.description: |
          The URL of the IRIS built-in `/api/monitor/metrics` endpoint, which exposes
          OpenMetrics telemetry data. This endpoint is unauthenticated by default. If the endpoint
          has been secured, use the `auth_token`, `username` and `password`, or `headers` options
          below.

          Note: Interoperability metrics (`interop.*`) are only emitted once the "Record Statistics
          for SAM" (System Alerting and Monitoring) setting is enabled
          (`^Ens.Config("Stats","RecordSAM")=1`) in a namespace with a running production.
  - template: logs
    description: |
      Log Section

      type - required - Type of log input source (tcp / udp / file / windows_event).
      port / path / channel_path - required - Set port if type is tcp or udp.
                                              Set path if type is file.
                                              Set channel_path if type is windows_event.
      source  - required - Attribute that defines which integration sent the logs.
      encoding - optional - For file specifies the file encoding. Default is utf-8. Other
                            possible values are utf-16-le and utf-16-be.
      service - optional - The name of the service that generates the log.
                           Overrides any `service` defined in the `init_config` section.
      tags - optional - Add tags to the collected logs.

      Discover Datadog log collection: https://docs.datadoghq.com/logs/log_collection/

      IRIS emits log data in two formats and the log pipeline parses both, normalizing them
      to the same iris.* attributes. Use one of the two stanzas below.

      1. messages.log
        - Written by default, with no additional IRIS configuration. Entries span multiple
          lines, so the multi_line rule is required. Change `path` to match the instance
          installation directory; IRIS for Health typically uses
          /opt/irishealth/mgr/messages.log.
      2. Structured log
        - A superset of messages.log that also carries audit events. Enable structured
          logging with format JSON, then set `path` to the file passed to `irislogd -f`.
          Each entry is one JSON object per line, so no log_processing_rules are needed.
          The NVP format is not parsed. At log level INFO or lower the structured log
          includes audit events, which can contain PII or PHI.
        - See https://docs.intersystems.com/iris20262/csp/docbook/Doc.View.cls?KEY=GCM_structuredlog

      Neither format records a UTC offset, so the pipeline interprets timestamps as UTC.
      Run IRIS in UTC to keep log timestamps accurate.
    example:
    - type: file
      path: /usr/irissys/mgr/messages.log
      source: intersystems_iris
      service: <SERVICE>
      log_processing_rules:
        - type: multi_line
          name: new_log_start_with_date
          pattern: \d{2}/\d{2}/\d{2}-\d{2}:\d{2}:\d{2}
    - type: file
      path: /var/log/iris/structured.log
      source: intersystems_iris
      service: <SERVICE>
