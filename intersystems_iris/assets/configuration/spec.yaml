name: intersystems_iris
files:
- name: intersystems_iris.yaml
  options:
  - template: init_config
    options:
    - template: init_config/openmetrics
  - template: instances
    options:
    - template: instances/openmetrics
      overrides:
        openmetrics_endpoint.value.example: http://%%host%%:52773/api/monitor/metrics
        openmetrics_endpoint.description: |
          The URL of the IRIS built-in `/api/monitor/metrics` endpoint, which exposes
          Prometheus/OpenMetrics telemetry. This endpoint is unauthenticated by default; use the
          `auth_token`, `username`/`password`, or `headers` options below if the endpoint has been
          secured.

          Note: interoperability metrics (`interop.*`) are only emitted once the "Record Statistics
          for SAM" setting is enabled (`^Ens.Config("Stats","RecordSAM")=1`) in a namespace with a
          running production. The always-on interface-count family is served separately at
          `/api/monitor/interop/interfaces`; add a second instance pointing there to collect it.
  - template: logs
    example:
    - type: file
      path: /usr/irissys/mgr/messages.log
      source: intersystems_iris
      service: <SERVICE>
      log_processing_rules:
        - type: multi_line
          name: new_log_start_with_date
          pattern: \d{2}/\d{2}/\d{2}-\d{2}:\d{2}:\d{2}
