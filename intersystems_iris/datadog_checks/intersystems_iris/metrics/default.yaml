# Activity/daily-aggregate interoperability metrics. Emitted once activity monitoring is
# enabled for the namespace (`Ens.Util.Statistics.EnableSAMForNamespace()`) and the
# `Ens.SAM.GeneralMetrics.Collect()` task has run. `sample_count*`, `avg_processing_time`
# and `avg_queueing_time` are per-host activity gauges (labels `hosttype`/`host`/
# `messagetype`); the rest are per-production daily aggregates (label `id`/`production`,
# plus `days` on `header_count_older_than`) that accumulate across calendar days.
iris_interop_avg_processing_time: interop.avg_processing_time
iris_interop_avg_queueing_time: interop.avg_queueing_time
iris_interop_header_count_older_than: interop.header_count_older_than
iris_interop_namespace_storage_mb: interop.namespace_storage_mb
iris_interop_oldest_message_header_count: interop.oldest_message_header_count
iris_interop_oldest_message_header_days: interop.oldest_message_header_days
iris_interop_sample_count: interop.sample_count
iris_interop_sample_count_per_sec: interop.sample_count_per_sec
iris_interop_session_count: interop.session_count
iris_interop_session_storage_kb: interop.session_storage_kb

# HTTP/SOAP outbound transmission metrics. Emitted per business host only when an outbound
