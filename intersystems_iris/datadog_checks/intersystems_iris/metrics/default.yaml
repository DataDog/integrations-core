# ECP, global, journal-update and interoperability metrics.
# `*_conn`/`*_conn_max`, plus the app-server `latency`, always emit (0 on an idle instance).
# The granular per-operation families require an active ECP connection carrying traffic, so
# they are absent from an idle instance and from a point-in-time fixture.
# `iris_ecp_*` = this system acting as an ECP application server (client side);
# `iris_ecps_*` = this system acting as an ECP data server. `iris_ecp_clients`/
# `iris_ecp_servers` (IRIS 2025.3+) emit one label-bearing series per connection, reporting
# the peer and its connection state.
iris_ecp_conn: ecp.conn
iris_ecp_conn_max: ecp.conn_max
iris_ecp_latency: ecp.latency
iris_ecp_clients: ecp.clients
iris_ecp_servers: ecp.servers
iris_ecp_block_add_per_sec: ecp.block_add_per_sec
iris_ecp_block_purge_buff_per_sec: ecp.block_purge_buff_per_sec
iris_ecp_block_purge_svr_per_sec: ecp.block_purge_svr_per_sec
iris_ecp_byte_rcvd_per_sec: ecp.byte_rcvd_per_sec
iris_ecp_byte_sent_per_sec: ecp.byte_sent_per_sec
iris_ecp_glo_ref_per_sec: ecp.glo_ref_per_sec
