# Maps the raw `iris_*` metric names emitted by IRIS's built-in `/api/monitor/metrics`
# OpenMetrics endpoint to their namespace-relative submission names. The check's
# `__NAMESPACE__` ("intersystems_iris") is prepended by the base check on submission, so
# an entry like `iris_cpu_pct: cpu.pct` is submitted as `intersystems_iris.cpu.pct`.
#
# Keys are exactly what the exposition emits; do not add the namespace prefix here.

# CPU metrics
iris_cpu_pct: cpu.pct
iris_cpu_usage: cpu.usage

# Web Gateway (CSP), cache and database metrics
iris_csp_activity: csp.activity
iris_csp_actual_connections: csp.actual_connections
iris_csp_gateway_latency: csp.gateway_latency
iris_csp_in_use_connections: csp.in_use_connections
iris_csp_private_connections: csp.private_connections
iris_csp_sessions: csp.sessions
iris_cache_efficiency: cache_efficiency
iris_cached_query_by_ns: cached_query_by_ns
iris_db_expansion_size_mb: db.expansion_size_mb
iris_db_file_limit_percent: db.file_limit_percent
iris_db_free_space: db.free_space
iris_db_latency: db.latency
iris_db_max_size_mb: db.max_size_mb
iris_db_size_mb: db.size_mb
iris_directory_space: directory_space
iris_disk_percent_full: disk_percent_full

# Journal, license, object and physical I/O metrics
iris_jrn_block_per_sec: jrn.block_per_sec
iris_jrn_entry_per_sec: jrn.entry_per_sec
iris_jrn_free_space: jrn.free_space
iris_jrn_size: jrn.size
iris_license_available: license.available
iris_license_consumed: license.consumed
iris_license_days_remaining: license.days_remaining
iris_license_percent_used: license.percent_used
iris_log_reads_per_sec: log_reads_per_sec
# Mirroring metrics. `member_type` is emitted by every instance (2=Not-Member on a
# standalone or Community node). The rest require a licensed instance configured as a
# failover mirror member: `failover_ready`/`no_failover`/`status` are emitted on both the
# primary and the backup (`status` reports 2=PRIMARY vs 3=BACKUP), while the two
# `*_latency_time` families are BACKUP-ONLY — they measure the backup's replication delta
# from the primary. `journal_latency_bytes`/`journal_latency_files` are also backup-only
# and are emitted only transiently during an active journal-sync tick, so a point-in-time
# fixture will usually miss them.
iris_mirror_database_latency_bytes: mirror.database_latency_bytes
iris_mirror_database_latency_files: mirror.database_latency_files
iris_mirror_database_latency_time: mirror.database_latency_time
iris_mirror_failover_ready: mirror.failover_ready
iris_mirror_journal_latency_bytes: mirror.journal_latency_bytes
iris_mirror_journal_latency_files: mirror.journal_latency_files
iris_mirror_journal_latency_time: mirror.journal_latency_time
iris_mirror_member_type: mirror.member_type
iris_mirror_missing_databases: mirror.missing_databases
iris_mirror_no_failover: mirror.no_failover
iris_mirror_status: mirror.status
iris_obj_a_seize_per_sec: obj.a_seize_per_sec
iris_obj_del_per_sec: obj.del_per_sec
iris_obj_hit_per_sec: obj.hit_per_sec
iris_obj_load_per_sec: obj.load_per_sec
iris_obj_miss_per_sec: obj.miss_per_sec
iris_obj_new_per_sec: obj.new_per_sec
iris_obj_seize_per_sec: obj.seize_per_sec
iris_page_space_percent_used: page_space_percent_used
iris_phys_mem_percent_used: phys.mem_percent_used
iris_phys_reads_per_sec: phys.reads_per_sec
iris_phys_writes_per_sec: phys.writes_per_sec

# Shared memory, SQL, system and transaction metrics
iris_smh_available: smh.available
iris_smh_percent_full: smh.percent_full
iris_smh_total: smh.total
iris_smh_total_percent_full: smh.total_percent_full
iris_smh_used: smh.used
iris_sql_active_queries: sql.active_queries
iris_sql_active_queries_95_percentile: sql.active_queries_95_percentile
iris_sql_active_queries_99_percentile: sql.active_queries_99_percentile
iris_sql_commands_per_second: sql.commands_per_second
iris_sql_queries_avg_runtime: sql.queries_avg_runtime
iris_sql_queries_avg_runtime_std_dev: sql.queries_avg_runtime_std_dev
iris_sql_queries_per_second: sql.queries_per_second
iris_sql_row_count_per_second: sql.row_count_per_second
iris_system_alerts: system.alerts
iris_system_alerts_log: system.alerts_log
