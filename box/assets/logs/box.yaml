pipeline:
  type: pipeline
  name: Box
  enabled: true
  filter:
    query: source:box
  processors:
    - type: date-remapper
      name: Define `created_at` as the official date of the log
      enabled: true
      sources:
        - created_at
    - type: service-remapper
      name: Define `service` as the official service of the log
      enabled: true
      sources:
        - service
    - type: category-processor
      name: Category processor for defining `box_event_category` from log
      enabled: true
      categories:
        - filter:
            query: "@event_type:SHIELD*"
          name: shield
        - filter:
            query: "@source.type:user"
          name: user
        - filter:
            query: "@source.type:application"
          name: application
        - filter:
            query: "@source.item_type:file"
          name: file
        - filter:
            query: "@source.item_type:folder"
          name: folder
        - filter:
            query: -(@source.item_type:(file OR folder) OR @source.type:(user OR
              application) OR @event_type:SHIELD*)
          name: other
      target: box_event_category
    - type: attribute-remapper
      name:
        Map `additional_details.shield_alert.user.name`, `created_by.name` to
        `usr.name`
      enabled: true
      sources:
        - additional_details.shield_alert.user.name
        - created_by.name
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `additional_details.shield_alert.user.id`, `created_by.id` to `usr.id`
      enabled: true
      sources:
        - additional_details.shield_alert.user.id
        - created_by.id
      sourceType: attribute
      target: usr.id
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name:
        Map `additional_details.shield_alert.user.email`, `created_by.login` to
        `usr.email`
      enabled: true
      sources:
        - additional_details.shield_alert.user.email
        - created_by.login
      sourceType: attribute
      target: usr.email
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `event_type` to `evt.name`
      enabled: true
      sources:
        - event_type
      sourceType: attribute
      target: evt.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `ip_address` to `network.client.ip`
      enabled: true
      sources:
        - ip_address
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: category-processor
      name: Category processor for empty user email
      enabled: true
      categories:
        - filter:
            query: '@usr.email:""'
          name: Unknown User
      target: usr.email
    - type: pipeline
      name: Box Files
      enabled: true
      filter:
        query: "@box_event_category:file"
      processors:
        - type: grok-parser
          name: Extracting `file_type` from `source.item_name`
          enabled: true
          source: source.item_name
          samples:
            - milkyway.jpg
            - test.py
          grok:
            supportRules: ""
            matchRules: file_ext_rule %{regex(".*(?=\\.)"):}.%{data:file_type}
    - type: pipeline
      name: Shield Alerts
      enabled: true
      filter:
        query: "@evt.name:SHIELD_ALERT"
      processors:
        - name: Lookup on `additional_details.shield_alert.priority` to `status`
          enabled: true
          source: additional_details.shield_alert.priority
          target: status
          lookupTable: |-
            informational, info
            low, notice
            medium, warning
            high, critical
            critical, alert
          type: lookup-processor
        - name: Lookup on `additional_details.shield_alert.severity` to `status`
          enabled: true
          source: additional_details.shield_alert.severity
          target: status
          lookupTable: |-
            INFORMATIONAL, info
            LOW, notice
            MEDIUM, warning
            HIGH, critical
            CRITICAL, alert
          type: lookup-processor
        - type: status-remapper
          name: Define `status` as the official status of the log
          enabled: true
          sources:
            - status
    - type: geo-ip-parser
      name: Extracting geolocation information from `network.client.ip`
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - type: pipeline
      name: OCSF pre transformations
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@event_type:*"
      processors:
        - type: string-builder-processor
          name: Add product name
          enabled: true
          template: "Box"
          target: ocsf.metadata.product.name
          replaceMissing: false
        - type: string-builder-processor
          name: Add product vendor
          enabled: true
          template: "Box"
          target: ocsf.metadata.product.vendor_name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `event_type` to `ocsf.metadata.event_code`
          enabled: true
          sources:
            - event_type
          sourceType: attribute
          target: ocsf.metadata.event_code
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `event_id` to `ocsf.metadata.uid`
          enabled: true
          sources:
            - event_id
          sourceType: attribute
          target: ocsf.metadata.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `created_at` to `ocsf.time`
          enabled: true
          sources:
            - created_at
          sourceType: attribute
          target: ocsf.time
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: grok-parser
          name: Parse `ocsf.time` to `ocsf.time`
          enabled: true
          source: ocsf.time
          samples:
            - "2025-04-25T14:52:32+05:30"
            - "2025-04-22T01:25:51-07:00"
          grok:
            supportRules: ""
            matchRules: |
              parse_time %{date("yyyy-MM-dd'T'HH:mm:ssZZ"):ocsf.time}
    - type: pipeline
      name: OCSF sub pipeline for class Detection Finding [2004]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@ocsf.metadata.event_code:SHIELD_ALERT"
      processors:
        - type: string-builder-processor
          name: Add is_alert
          enabled: true
          template: "true"
          target: ocsf.is_alert
          replaceMissing: false
        - type: grok-parser
          name: Parse `ocsf.is_alert` to boolean
          enabled: true
          source: ocsf.is_alert
          samples:
            - "true"
          grok:
            supportRules: ""
            matchRules: |
              to_bool %{boolean("true","false"):ocsf.is_alert}
        - type: string-builder-processor
          name: Add finding types
          enabled: true
          template: "[%{additional_details.shield_alert.rule_category}]"
          target: ocsf.finding_info.types
          replaceMissing: false
        - type: grok-parser
          name: Parse `ocsf.finding_info.types` to array
          enabled: true
          source: ocsf.finding_info.types
          samples:
            - "[Suspicious Locations]"
          grok:
            supportRules: ""
            matchRules: |
              to_array %{data:ocsf.finding_info.types:array("[]",",")}
        - type: array-map-processor
          name: Map `additional_details.shield_alert.alert_summary.alert_activities` to `ocsf.resources`
          enabled: true
          source: additional_details.shield_alert.alert_summary.alert_activities
          target: ocsf.resources
          preserveSource: true
          processors:
            - type: attribute-remapper
              name: Map `$sourceElem.item_name` to `$targetElem.name`
              sources:
                - $sourceElem.item_name
              target: $targetElem.name
              preserveSource: true
              overrideOnConflict: false
            - type: attribute-remapper
              name: Map `$sourceElem.item_id` to `$targetElem.uid`
              sources:
                - $sourceElem.item_id
              target: $targetElem.uid
              preserveSource: true
              overrideOnConflict: false
            - type: attribute-remapper
              name: Map `$sourceElem.item_type` to `$targetElem.type`
              sources:
                - $sourceElem.item_type
              target: $targetElem.type
              preserveSource: true
              overrideOnConflict: false
        - type: array-map-processor
          name: Map `additional_details.shield_alert.alert_summary.alert_activities` to `ocsf.evidences`
          enabled: true
          source: additional_details.shield_alert.alert_summary.alert_activities
          target: ocsf.evidences
          preserveSource: true
          processors:
            - type: attribute-remapper
              name: Map `$sourceElem.event_type` to `$targetElem.api.operation`
              sources:
                - $sourceElem.event_type
              target: $targetElem.api.operation
              preserveSource: true
              overrideOnConflict: false
            - type: attribute-remapper
              name: Map `$sourceElem.ip_info.ip` to `$targetElem.src_endpoint.ip`
              sources:
                - $sourceElem.ip_info.ip
              target: $targetElem.src_endpoint.ip
              preserveSource: true
              overrideOnConflict: false
            - type: attribute-remapper
              name: Map `$sourceElem.ip_info.registrant` to `$targetElem.src_endpoint.isp`
              sources:
                - $sourceElem.ip_info.registrant
              target: $targetElem.src_endpoint.isp
              preserveSource: true
              overrideOnConflict: false
            - type: attribute-remapper
              name: Map `$sourceElem.ip_info.city_name` to `$targetElem.src_endpoint.location.city`
              sources:
                - $sourceElem.ip_info.city_name
              target: $targetElem.src_endpoint.location.city
              preserveSource: true
              overrideOnConflict: false
            - type: attribute-remapper
              name: Map `$sourceElem.ip_info.region_name` to `$targetElem.src_endpoint.location.region`
              sources:
                - $sourceElem.ip_info.region_name
              target: $targetElem.src_endpoint.location.region
              preserveSource: true
              overrideOnConflict: false
            - type: attribute-remapper
              name: Map `$sourceElem.ip_info.country_code` to `$targetElem.src_endpoint.location.country`
              sources:
                - $sourceElem.ip_info.country_code
              target: $targetElem.src_endpoint.location.country
              preserveSource: true
              overrideOnConflict: false
            - type: attribute-remapper
              name: Map `$sourceElem.ip_info.latitude` to `$targetElem.src_endpoint.location.lat`
              sources:
                - $sourceElem.ip_info.latitude
              target: $targetElem.src_endpoint.location.lat
              targetFormat: double
              preserveSource: true
              overrideOnConflict: false
            - type: attribute-remapper
              name: Map `$sourceElem.ip_info.longitude` to `$targetElem.src_endpoint.location.long`
              sources:
                - $sourceElem.ip_info.longitude
              target: $targetElem.src_endpoint.location.long
              targetFormat: double
              preserveSource: true
              overrideOnConflict: false
        - type: attribute-remapper
          name: Map `additional_details.shield_alert.created_at` to `ocsf.finding_info.created_time`
          enabled: true
          sources:
            - additional_details.shield_alert.created_at
          sourceType: attribute
          target: ocsf.finding_info.created_time
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: grok-parser
          name: Parse `ocsf.finding_info.created_time` to `ocsf.finding_info.created_time`
          enabled: true
          source: ocsf.finding_info.created_time
          samples:
            - "2026-10-27T04:56:17-07:00"
          grok:
            supportRules: ""
            matchRules: |
              parse_time %{date("yyyy-MM-dd'T'HH:mm:ssZZ"):ocsf.finding_info.created_time}
        - type: schema-processor
          name: Apply OCSF schema for 2004
          enabled: true
          mappers:
            - type: schema-remapper
              name: Map `ocsf.metadata.product.name` to `ocsf.metadata.product.name`
              sources:
                - ocsf.metadata.product.name
              target: ocsf.metadata.product.name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.product.vendor_name` to `ocsf.metadata.product.vendor_name`
              sources:
                - ocsf.metadata.product.vendor_name
              target: ocsf.metadata.product.vendor_name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.event_code` to `ocsf.metadata.event_code`
              sources:
                - ocsf.metadata.event_code
              target: ocsf.metadata.event_code
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.metadata.uid` to `ocsf.metadata.uid`
              sources:
                - ocsf.metadata.uid
              target: ocsf.metadata.uid
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.time` to `ocsf.time`
              sources:
                - ocsf.time
              target: ocsf.time
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.is_alert` to `ocsf.is_alert`
              sources:
                - ocsf.is_alert
              target: ocsf.is_alert
              preserveSource: true
              overrideOnConflict: true
            - type: schema-category-mapper
              name: ocsf.activity_id
              categories:
                - filter:
                    query: "*"
                  name: Create
                  id: 1
              targets:
                name: ocsf.activity_name
                id: ocsf.activity_id
            - type: schema-remapper
              name: Map `additional_details.shield_alert.rule_name` to `ocsf.finding_info.title`
              sources:
                - additional_details.shield_alert.rule_name
              target: ocsf.finding_info.title
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `additional_details.shield_alert.alert_id` to `ocsf.finding_info.uid`
              sources:
                - additional_details.shield_alert.alert_id
              target: ocsf.finding_info.uid
              preserveSource: true
              overrideOnConflict: true
              targetFormat: string
            - type: schema-remapper
              name: Map `additional_details.shield_alert.malware_info.description`, `additional_details.shield_alert.rule_category` to `ocsf.finding_info.desc`
              sources:
                - additional_details.shield_alert.malware_info.description
                - additional_details.shield_alert.rule_category
              target: ocsf.finding_info.desc
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `additional_details.shield_alert.link` to `ocsf.finding_info.src_url`
              sources:
                - additional_details.shield_alert.link
              target: ocsf.finding_info.src_url
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.finding_info.types` to `ocsf.finding_info.types`
              sources:
                - ocsf.finding_info.types
              target: ocsf.finding_info.types
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.finding_info.created_time` to `ocsf.finding_info.created_time`
              sources:
                - ocsf.finding_info.created_time
              target: ocsf.finding_info.created_time
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.resources` to `ocsf.resources`
              sources:
                - ocsf.resources
              target: ocsf.resources
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `ocsf.evidences` to `ocsf.evidences`
              sources:
                - ocsf.evidences
              target: ocsf.evidences
              preserveSource: true
              overrideOnConflict: true
            - type: schema-remapper
              name: Map `additional_details.shield_alert.rule_id` to `ocsf.finding_info.analytic.uid`
              sources:
                - additional_details.shield_alert.rule_id
              target: ocsf.finding_info.analytic.uid
              preserveSource: true
              overrideOnConflict: true
              targetFormat: string
            - type: schema-remapper
              name: Map `additional_details.shield_alert.rule_name` to `ocsf.finding_info.analytic.name`
              sources:
                - additional_details.shield_alert.rule_name
              target: ocsf.finding_info.analytic.name
              preserveSource: true
              overrideOnConflict: true
            - type: schema-category-mapper
              name: ocsf.finding_info.analytic.type_id
              categories:
                - filter:
                    query: "*"
                  name: Rule
                  id: 1
              targets:
                name: ocsf.finding_info.analytic.type
                id: ocsf.finding_info.analytic.type_id
            - type: schema-remapper
              name: Map `additional_details.shield_alert.risk_score` to `ocsf.risk_score`
              sources:
                - additional_details.shield_alert.risk_score
              target: ocsf.risk_score
              preserveSource: true
              overrideOnConflict: true
              targetFormat: integer
            - type: schema-category-mapper
              name: ocsf.severity_id
              categories:
                - filter:
                    query: "-@additional_details.shield_alert.severity:* -@additional_details.shield_alert.priority:*"
                  name: Unknown
                  id: 0
                - filter:
                    query: "@additional_details.shield_alert.severity:(INFORMATIONAL OR informational) OR @additional_details.shield_alert.priority:informational"
                  name: Informational
                  id: 1
                - filter:
