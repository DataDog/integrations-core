pipeline:
  type: pipeline
  name: Microsoft Sysmon
  enabled: true
  filter:
    query: source:microsoft-sysmon
  processors:
    - type: date-remapper
      name: Define `Event.System.TimeCreated.SystemTime` as the official date of the
        log
      enabled: true
      sources:
        - Event.System.TimeCreated.SystemTime
    - type: service-remapper
      name: Define `service` as the official service of the log
      enabled: true
      sources:
        - service
    - type: status-remapper
      name: Define `level` as the official status of the log
      enabled: true
      sources:
        - level
    - name: Map `Event.System.EventID` to `title`
      enabled: true
      source: Event.System.EventID
      target: title
      lookupTable: |-
        1,Process created
        2,File creation time changed
        3,Network connection detected
        4,Sysmon service state changed
        5,Process terminated
        6,Driver loaded
        7,Image loaded
        8,CreateRemoteThread detected
        9,RawAccessRead detected
        10,Process accessed
        11,File created
        12,Registry object added or deleted
        13,Registry value set
        14,Registry object renamed
        15,File stream created
        16,Sysmon config state changed
        17,Named pipe created
        18,Named pipe connected
        19,WmiEventFilter activity detected
        20,WmiEventConsumer activity detected
        21,WmiEventConsumerToFilter activity detected
        22,Dns query executed
        23,File Delete archived
        24,New content in the clipboard
        25,Process image change
        26,File Delete logged
        27,File Block Executable
        28,File Block Shredding
        29,File Executable detected
        255,Sysmon error
      type: lookup-processor
    - type: attribute-remapper
      name: Map `Event.System.EventID` to `evt.id`
      enabled: true
      sources:
        - Event.System.EventID
      sourceType: attribute
      target: evt.id
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `Event.EventData.Data.User` to `usr.name`
      enabled: true
      sources:
        - Event.EventData.Data.User
      sourceType: attribute
      target: usr.name
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: pipeline
      name: Process Network connection detected event logs
      enabled: true
      filter:
        query: "@evt.id:3"
      processors:
        - type: attribute-remapper
          name: Map `Event.EventData.Data.SourceIp` to `network.client.ip`
          enabled: true
          sources:
            - Event.EventData.Data.SourceIp
          sourceType: attribute
          target: network.client.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `Event.EventData.Data.DestinationIp` to `network.destination.ip`
          enabled: true
          sources:
            - Event.EventData.Data.DestinationIp
          sourceType: attribute
          target: network.destination.ip
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `Event.EventData.Data.SourcePort` to `network.client.port`
          enabled: true
          sources:
            - Event.EventData.Data.SourcePort
          sourceType: attribute
          target: network.client.port
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `Event.EventData.Data.DestinationPort` to `network.destination.port`
          enabled: true
          sources:
            - Event.EventData.Data.DestinationPort
          sourceType: attribute
          target: network.destination.port
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: geo-ip-parser
          name: Parse network.destination.ip
          enabled: true
          sources:
            - network.destination.ip
          target: network.destination.geoip
          ip_processing_behavior: do-nothing
    - type: pipeline
      name: Process DNS query event logs
      enabled: true
      filter:
        query: "@evt.id:22"
      processors:
        - type: attribute-remapper
          name: Map `Event.EventData.Data.QueryName` to `dns.question.name`
          enabled: true
          sources:
            - Event.EventData.Data.QueryName
          sourceType: attribute
          target: dns.question.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `Event.EventData.Data.QueryResults` to `dns.answer.name`
          enabled: true
          sources:
            - Event.EventData.Data.QueryResults
          sourceType: attribute
          target: dns.answer.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
    - type: attribute-remapper
      name: Map `Event.EventData.Data.IpAddress` to `network.client.ip`
      enabled: true
      sources:
        - Event.EventData.Data.IpAddress
      sourceType: attribute
      target: network.client.ip
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: geo-ip-parser
      name: Parse network.client.ip
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - type: pipeline
      name: OCSF pre transformations
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: '@Event.System.Provider.Name:"Microsoft-Windows-Sysmon"'
      processors:
        - type: string-builder-processor
          name: Add product vendor
          enabled: true
          template: "Microsoft"
          target: ocsf.metadata.product.vendor_name
          replaceMissing: false
        - type: string-builder-processor
          name: Add device OS name
          enabled: true
          template: "Windows"
          target: ocsf.device.os.name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `Event.System.Provider.Name` to `ocsf.metadata.product.feature.name`
          enabled: true
          sources:
            - Event.System.Provider.Name
          sourceType: attribute
          target: ocsf.metadata.product.feature.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `Event.System.EventID` to `ocsf.metadata.event_code`
          enabled: true
          sources:
            - Event.System.EventID
          sourceType: attribute
          target: ocsf.metadata.event_code
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
          targetFormat: string
        - type: attribute-remapper
          name: Map `Event.System.EventRecordID` to `ocsf.metadata.uid`
          enabled: true
          sources:
            - Event.System.EventRecordID
          sourceType: attribute
          target: ocsf.metadata.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
          targetFormat: string
        - type: attribute-remapper
          name: Map `Event.System.Channel` to `ocsf.metadata.log_name`
          enabled: true
          sources:
            - Event.System.Channel
          sourceType: attribute
          target: ocsf.metadata.log_name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `Event.System.Provider.Name` to `ocsf.metadata.log_provider`
          enabled: true
          sources:
            - Event.System.Provider.Name
          sourceType: attribute
          target: ocsf.metadata.log_provider
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `Event.System.Version` to `ocsf.metadata.log_version`
          enabled: true
          sources:
            - Event.System.Version
          sourceType: attribute
          target: ocsf.metadata.log_version
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
          targetFormat: string
        - type: attribute-remapper
          name: Map `Event.System.Provider.Guid` to `ocsf.metadata.product.feature.uid`
          enabled: true
          sources:
            - Event.System.Provider.Guid
          sourceType: attribute
          target: ocsf.metadata.product.feature.uid
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: attribute-remapper
          name: Map `Event.System.TimeCreated.SystemTime` to `ocsf.metadata.original_time`
          enabled: true
          sources:
            - Event.System.TimeCreated.SystemTime
          sourceType: attribute
          target: ocsf.metadata.original_time
          targetType: attribute
          preserveSource: true
          overrideOnConflict: false
        - type: grok-parser
          name: Parse `Event.EventData.Data.UtcTime` to `ocsf.time`
          enabled: true
          source: Event.EventData.Data.UtcTime
          samples:
            - "2026-08-31 18:25:19.837"
          grok:
            supportRules: ""
            matchRules: |
              utc_time %{date("yyyy-MM-dd HH:mm:ss.SSS","UTC"):ocsf.time}
        - type: grok-parser
          name: Parse `Event.System.TimeCreated.SystemTime` to `ocsf.time`
          enabled: true
          source: Event.System.TimeCreated.SystemTime
          samples:
            - "2024-01-02T03:04:05.7005647Z"
            - "2024-01-02T03:04:05.700564700Z"
          grok:
            supportRules: ""
            matchRules: |
              win_time_frac %{date("yyyy-MM-dd'T'HH:mm:ss.SSS"):ocsf.time}%{regex("[0-9]*")}Z
              win_time_plain %{date("yyyy-MM-dd'T'HH:mm:ss"):ocsf.time}Z
        - type: string-builder-processor
          name: Add product name
          enabled: true
          template: "Sysmon"
          target: ocsf.metadata.product.name
          replaceMissing: false
        - type: lookup-processor
          name: Map `Event.System.EventID` to `ocsf.message`
          enabled: true
          source: Event.System.EventID
          target: ocsf.message
          lookupTable: "1,Process Create\n2,File creation time changed\n3,Network connection detected\n4,Sysmon service state changed\n5,Process terminated\n6,Driver loaded\n7,Image loaded\n8,CreateRemoteThread detected\n9,RawAccessRead detected\n10,Process accessed\n11,File created\n12,Registry object added or deleted\n13,Registry value set\n14,Registry object renamed\n15,File stream created\n16,Sysmon configuration change\n17,Pipe Created\n18,Pipe Connected\n19,WmiEventFilter activity detected\n20,WmiEventConsumer activity detected\n21,WmiEventConsumerToFilter activity detected\n22,Dns query\n23,File Delete archived\n24,Clipboard changed\n25,Process Tampering\n26,File Delete logged\n27,File Block Executable\n28,File Block Shredding\n29,File Executable Detected"
          defaultLookup:
        - type: grok-parser
          name: Parse `Event.EventData.Data.RuleName` to `ocsf.attack_ev.technique.uid`, `ocsf.attack_ev.technique.name`, `ocsf.metadata.labels`
          enabled: true
          source: Event.EventData.Data.RuleName
          samples:
            - "-"
            - "Proxy"
            - "T1099"
            - "T1060,RunKey"
            - "Context,DeviceConnectedOrUpdated"
            - "technique_id=T1571,technique_name=Non-Standard Port"
            - "technique_id=T1055.001,technique_name=Dynamic-link Library Injection"
            - "technique_id=T1047"
          grok:
            supportRules: ""
            matchRules: |
              absent %{regex("-"):}
              labeled_technique_with_name technique_id=%{regex("T[0-9]{4}(\\.[0-9]{3})?"):ocsf.attack_ev.technique.uid},technique_name=%{data:ocsf.attack_ev.technique.name}
              labeled_technique technique_id=%{regex("T[0-9]{4}(\\.[0-9]{3})?"):ocsf.attack_ev.technique.uid}
              technique_with_labels %{regex("T[0-9]{4}(\\.[0-9]{3})?"):ocsf.attack_ev.technique.uid},%{data:ocsf.metadata.labels:array(",")}
              technique_only %{regex("T[0-9]{4}(\\.[0-9]{3})?"):ocsf.attack_ev.technique.uid}
              labels %{data:ocsf.metadata.labels:array(",")}
        - type: array-processor
          name: Move `ocsf.attack_ev` into the `ocsf.attacks` array
          enabled: true
          operation:
            source: ocsf.attack_ev
            target: ocsf.attacks
            preserveSource: false
            type: append
        - type: grok-parser
          name: Parse `Event.EventData.Data.Image` to `ocsf.actor.process.name`
          enabled: true
