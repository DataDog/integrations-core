apiVersion: v1
kind: Pod
metadata:
  name: preempt-low-pod
  namespace: default
  labels:
    kai.scheduler/queue: team-a
spec:
  schedulerName: kai-scheduler
  priorityClassName: train
  automountServiceAccountToken: false
  containers:
  - name: main
    image: registry.k8s.io/pause:3.10
    resources:
      requests:
        cpu: 800m
        memory: 64Mi
