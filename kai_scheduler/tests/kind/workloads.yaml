apiVersion: v1
kind: Pod
metadata:
  name: running-pod
  namespace: default
  labels:
    kai.scheduler/queue: team-b
spec:
  schedulerName: kai-scheduler
  automountServiceAccountToken: false
  containers:
  - name: main
    image: registry.k8s.io/pause:3.10
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: unschedulable-pod
  namespace: default
  labels:
    kai.scheduler/queue: team-b
spec:
  schedulerName: kai-scheduler
  automountServiceAccountToken: false
  containers:
  - name: main
    image: registry.k8s.io/pause:3.10
    resources:
      requests:
        cpu: '1000'
        memory: 64Mi
