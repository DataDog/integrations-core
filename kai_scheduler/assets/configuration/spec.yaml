name: KAI Scheduler
fleet_configurable: true
files:
- name: kai_scheduler.yaml
  options:
  - template: init_config
    options:
    - template: init_config/openmetrics
  - template: instances
    options:
    - name: scheduler_endpoint
      formats: [url]
      description: |
        Endpoint exposing the KAI scheduler's Prometheus metrics. The scheduler serves scheduling cycle, action,
        preemption, and queue fair share metrics.

        This integration is part of GPU Monitoring and only runs when GPU Monitoring is enabled in the
        configuration of the Agent running the check (`gpu.enabled: true`, or `DD_GPU_ENABLED=true`). When GPU
        Monitoring is disabled, every instance configured here is skipped.
      fleet_configurable: true
      value:
        display_default: null
        example: http://kai-scheduler-default.kai-scheduler.svc:8080/metrics
        type: string
    - name: queue_controller_endpoint
      formats: [url]
      description: |
        Endpoint exposing the KAI queue-controller's Prometheus metrics. The queue-controller serves queue quota and
        allocation metrics.
      fleet_configurable: true
      value:
        display_default: null
        example: http://queue-controller.kai-scheduler.svc:8080/metrics
        type: string
    - name: binder_endpoint
      formats: [url]
      description: |
        Endpoint exposing the KAI binder's Prometheus metrics. The binder only serves generic controller-runtime,
        Go, and process metrics.
      fleet_configurable: true
      value:
        display_default: null
        example: http://binder.kai-scheduler.svc:8080/metrics
        type: string
    - name: collect_podgroup_events
      fleet_configurable: true
      description: |
        Submit events for KAI PodGroup life cycle transitions by polling PodGroup custom resources from the Kubernetes
        API.

        This requires `list` role-based access control (RBAC) permission on `podgroups.scheduling.run.ai`, and `list`
        on `events` to add the eviction reason and preemptor to eviction events.

        Every instance with this option enabled polls all the PodGroups of the cluster. When you configure several
        instances, such as one per scheduling shard, set it to `false` on all but one of them to avoid duplicate
        events.
      value:
        type: boolean
        example: true
        default: true
    - name: collect_scheduling_goodput
      description: |
        Experimental. Submit the scheduling goodput metrics, in GPU-hours since the previous run, as one series per
        PodGroup tagged with `kai_workload` and its KAI queue, so that they can be summed by queue, cluster or reason:

        - `gpu.scheduling.badput_time`: GPU time that GPU PodGroups spent waiting to become fully runnable, tagged with
          the normalized `reason` and, when KAI reports one, the raw `scheduler_reason`.
        - `gpu.scheduling.fully_admitted_time`: GPU time that GPU PodGroups spent with all their active pods running.

        Goodput is `fully_admitted_time / (fully_admitted_time + badput_time)`. The metrics have no `kai.` prefix so
        that every scheduler integration submits the same metrics.

        Each GPU PodGroup active in an hour adds at least two custom metric series, plus one per extra badput reason.

        A GPU PodGroup has pods that request `nvidia.com/gpu`, `amd.com/gpu` or a KAI GPU fraction. It is fully admitted
        once every one of its active pods runs, and at least `minMember` of its pods run or completed. This requires
        cluster-wide `list` RBAC permission on `podgroups.scheduling.run.ai` and on `pods`, and `get` on `jobs.batch` to
        tell whether a PodGroup left without pods waits for new ones or is done.

        Every instance with this option enabled counts all the PodGroups of the cluster, so enable it on one instance
        only, otherwise the metrics are counted several times.
      value:
        type: boolean
        example: false
        default: false
    - name: kube_config_dict
      description: |
        Optional kubeconfig dictionary used to configure the Kubernetes API client.

        If unset, the check uses in-cluster Kubernetes configuration.
      value:
        type: object
        example:
          apiVersion: v1
          kind: Config
          clusters: []
          contexts: []
          users: []
    - name: cluster_check
      description: |
        Set to true when configuring this integration as a Cluster Agent cluster check.
      value:
        type: boolean
        example: true
    - template: instances/openmetrics
      overrides:
        openmetrics_endpoint.required: false
        openmetrics_endpoint.hidden: true
        histogram_buckets_as_distributions.value.example: true
        histogram_buckets_as_distributions.description: |
          Whether or not to send histogram buckets as Datadog distribution metrics. This implicitly
          enables the `collect_histogram_buckets` and `non_cumulative_histogram_buckets` options.

          This integration enables this option by default.

          Learn more about distribution metrics:
          https://docs.datadoghq.com/developers/metrics/types/?tab=distribution#metric-types
        collect_counters_with_distributions.value.example: true
        collect_counters_with_distributions.description: |
          Whether or not to also collect the observation counter metrics ending in `.sum` and `.count`
          when sending histogram buckets as Datadog distribution metrics. This implicitly enables the
          `histogram_buckets_as_distributions` option.

          This integration enables this option by default.
  - template: logs
    example:
    - type: docker
      source: kai_scheduler
      service: <SERVICE>
