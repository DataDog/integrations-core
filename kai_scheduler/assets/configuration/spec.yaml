name: KAI Scheduler
fleet_configurable: true
files:
- name: kai_scheduler.yaml
  options:
  - template: init_config
    options:
    - template: init_config/openmetrics
  - template: instances
    options:
    - name: scheduler_endpoint
      formats: [url]
      description: |
        Endpoint exposing the KAI scheduler's Prometheus metrics. The scheduler serves scheduling cycle, action,
        preemption, and queue fair share metrics.

        This integration is part of GPU Monitoring and only runs when GPU Monitoring is enabled in the
        configuration of the Agent running the check (`gpu.enabled: true`, or `DD_GPU_ENABLED=true`). When GPU
        Monitoring is disabled, every instance configured here is skipped.
      fleet_configurable: true
      value:
        display_default: null
        example: http://kai-scheduler-default.kai-scheduler.svc:8080/metrics
        type: string
    - name: queue_controller_endpoint
      formats: [url]
      description: |
        Endpoint exposing the KAI queue-controller's Prometheus metrics. The queue-controller serves queue quota and
        allocation metrics.
      fleet_configurable: true
      value:
        display_default: null
        example: http://queue-controller.kai-scheduler.svc:8080/metrics
        type: string
    - name: binder_endpoint
      formats: [url]
      description: |
        Endpoint exposing the KAI binder's Prometheus metrics. The binder only serves generic controller-runtime,
        Go, and process metrics.
      fleet_configurable: true
      value:
        display_default: null
        example: http://binder.kai-scheduler.svc:8080/metrics
        type: string
    - name: collect_podgroup_events
      fleet_configurable: true
      description: |
        Submit events for KAI PodGroup life cycle transitions by polling PodGroup custom resources from the Kubernetes
        API.

        This requires `list` role-based access control (RBAC) permission on `podgroups.scheduling.run.ai`, and `list`
        on `events` to add the eviction reason and preemptor to eviction events.

        Every instance with this option enabled polls all the PodGroups of the cluster. When you configure several
        instances, such as one per scheduling shard, set it to `false` on all but one of them to avoid duplicate
        events.
      value:
        type: boolean
        example: true
        default: true
    - name: collect_scheduling_goodput
      description: |
        Experimental. Submit the scheduling goodput metrics, in GPU-hours since the previous run, as one series per
        PodGroup tagged with `kai_pod_group`, `job_scheduler_workload` and its KAI queue, so that they can be summed by
        queue, cluster or reason:

        - `gpu.scheduling.badput_time`: GPU time that GPU PodGroups spent waiting to become fully runnable, tagged with
          one of six general `reason` categories (`quota_or_capacity`, `placement_or_topology`,
          `configuration_or_request`, `preemption_or_reclaim`, `startup_or_system`, `other_or_unknown`) and a
          `scheduler_reason`: the raw KAI reason, or one the check derives, such as `PartiallyRunning` for partial
          scheduling. It doesn't stop when KAI allocates a PodGroup, but when all its active pods run. After a
          preemption it is tagged `reason:preemption_or_reclaim` until KAI starts the PodGroup again.
        - `gpu.scheduling.fully_admitted_time`: GPU time that GPU PodGroups spent with all their active pods running.

        Goodput is `fully_admitted_time / (fully_admitted_time + badput_time)`. The metrics have no `kai.` prefix so
        that every scheduler integration submits the same metrics. Both metrics are also tagged with `gpu_type`, when the
        pods of the PodGroup require a GPU model with the `nvidia.com/gpu.product` node label in their `nodeSelector` or
        `nodeAffinity`, and the tag is unset otherwise. It works when `collect_podgroup_events` is `false`, such as when
        the Cluster Agent `job_scheduler_events` check sends the PodGroup events.

        Each GPU PodGroup active in an hour adds at least two custom metric series, plus one per extra badput reason.

        A GPU PodGroup has pods that request `nvidia.com/gpu`, `amd.com/gpu` or a KAI GPU fraction. It is fully admitted
        once every one of its active pods runs, and at least `minMember` of its pods run or completed. This requires
        cluster-wide `list` RBAC permission on `podgroups.scheduling.run.ai` and on `pods`, and `get` on `jobs.batch` to
        tell whether a PodGroup left without pods waits for new ones or is done.

        Every instance with this option enabled counts all the PodGroups of the cluster, so enable it on one instance
        only, otherwise the metrics are counted several times.
      value:
        type: boolean
        example: false
        default: false
    - name: kube_config_dict
      fleet_configurable: true
      description: |
        Optional kubeconfig dictionary used to configure the Kubernetes API client.

        If unset, the check uses in-cluster Kubernetes configuration.

        The check uses the context named by `current-context`, and reads only the fields listed in this option.
        Fields that are not listed, such as `preferences` or `proxy-url`, are ignored. The cluster `extensions`
        are only used by `exec` plugins with `provideClusterInfo: true`, which receive the
        `client.authentication.k8s.io/exec` extension.

        Supported authentication methods, in the order the Kubernetes client tries them:
          - `auth-provider`: the `gcp`, `azure`, or `oidc` provider.
          - `token` or `tokenFile`: a bearer token.
          - `exec`: a credential plugin command, which runs on the Agent host.
          - `username` and `password`: basic authentication.
        Client certificate authentication (`client-certificate` and `client-key`, or their `-data` variants) can be
        combined with any of them. File paths are read on the Agent host.

        When configured through Fleet Automation, `token`, `password`, `client-key-data`, and the `access-token`,
        `refresh-token`, `id-token`, and `client-secret` fields of `auth-provider.config` are secrets and must be
        set as secret references.
      value:
        type: object
        properties:
        - name: apiVersion
          type: string
        - name: kind
          type: string
        - name: current-context
          type: string
        - name: clusters
          type: array
          items:
            type: object
            properties:
            - name: name
              type: string
            - name: cluster
              type: object
              properties:
              - name: server
                type: string
              - name: certificate-authority
                type: string
              - name: certificate-authority-data
                type: string
              - name: insecure-skip-tls-verify
                type: boolean
              - name: tls-server-name
                type: string
              - name: extensions
                type: array
                items:
                  type: object
                  properties:
                  - name: name
                    type: string
                  - name: extension
                    type: object
                    additionalProperties: true
        - name: contexts
          type: array
          items:
            type: object
            properties:
            - name: name
              type: string
            - name: context
              type: object
              properties:
              - name: cluster
                type: string
              - name: user
                type: string
              - name: namespace
                type: string
        - name: users
          type: array
          items:
            type: object
            properties:
            - name: name
              type: string
            - name: user
              type: object
              properties:
              - name: token
                type: string
                secret: true
              - name: tokenFile
                type: string
              - name: client-certificate
                type: string
              - name: client-certificate-data
                type: string
              - name: client-key
                type: string
              - name: client-key-data
                type: string
                secret: true
              - name: username
                type: string
              - name: password
                type: string
                secret: true
              - name: auth-provider
                type: object
                properties:
                - name: name
                  type: string
                - name: config
                  type: object
                  properties:
                  - name: access-token
                    type: string
                    secret: true
                  - name: refresh-token
                    type: string
                    secret: true
                  - name: id-token
                    type: string
                    secret: true
                  - name: client-secret
                    type: string
                    secret: true
                  - name: client-id
                    type: string
                  - name: expiry
                    type: string
                  - name: expires-on
                    type: string
                  - name: cmd-path
                    type: string
                  - name: cmd-args
                    type: string
                  - name: scopes
                    type: string
                  - name: token-key
                    type: string
                  - name: expiry-key
                    type: string
                  - name: tenant-id
                    type: string
                  - name: apiserver-id
                    type: string
                  - name: idp-issuer-url
                    type: string
                  - name: idp-certificate-authority
                    type: string
                  - name: idp-certificate-authority-data
                    type: string
              - name: exec
                type: object
                properties:
                - name: apiVersion
                  type: string
                - name: command
                  type: string
                - name: args
                  type: array
                  items:
                    type: string
                - name: env
                  type: array
                  items:
                    type: object
                    properties:
                    - name: name
                      type: string
                    - name: value
                      type: string
                - name: provideClusterInfo
                  type: boolean
        example:
          apiVersion: v1
          kind: Config
          current-context: <CONTEXT_NAME>
          clusters:
          - name: <CLUSTER_NAME>
            cluster:
              server: https://<KUBERNETES_API_SERVER>
              certificate-authority-data: <BASE64_ENCODED_CA_CERTIFICATE>
          contexts:
          - name: <CONTEXT_NAME>
            context:
              cluster: <CLUSTER_NAME>
              user: <USER_NAME>
          users:
          - name: <USER_NAME>
            user:
              token: <TOKEN>
    - name: cluster_check
      description: |
        Set to true when configuring this integration as a Cluster Agent cluster check.
      value:
        type: boolean
        example: true
    - template: instances/openmetrics
      overrides:
        openmetrics_endpoint.required: false
        openmetrics_endpoint.hidden: true
        histogram_buckets_as_distributions.value.example: true
        histogram_buckets_as_distributions.description: |
          Whether or not to send histogram buckets as Datadog distribution metrics. This implicitly
          enables the `collect_histogram_buckets` and `non_cumulative_histogram_buckets` options.

          This integration enables this option by default.

          Learn more about distribution metrics:
          https://docs.datadoghq.com/developers/metrics/types/?tab=distribution#metric-types
        collect_counters_with_distributions.value.example: true
        collect_counters_with_distributions.description: |
          Whether or not to also collect the observation counter metrics ending in `.sum` and `.count`
          when sending histogram buckets as Datadog distribution metrics. This implicitly enables the
          `histogram_buckets_as_distributions` option.

          This integration enables this option by default.
  - template: logs
    example:
    - type: docker
      source: kai_scheduler
      service: <SERVICE>
