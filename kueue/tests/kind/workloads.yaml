apiVersion: batch/v1
kind: Job
metadata:
  name: scheduled-workload
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: user-queue
spec:
  suspend: true
  parallelism: 1
  completions: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: workload
        image: alpine:3.19.1
        command: ['sh', '-c', 'sleep 3600']
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: unschedulable-workload
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: user-queue
spec:
  suspend: true
  parallelism: 1
  completions: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: workload
        image: alpine:3.19.1
        command: ['sh', '-c', 'sleep 3600']
        resources:
          requests:
            # Exceeds the whole cohort's CPU (cluster-queue 1 + borrow-queue 1) so it stays pending
            # deterministically, even though cluster-queue can borrow within the cohort.
            cpu: '3'
            memory: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-workload
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: user-queue
spec:
  suspend: true
  parallelism: 1
  completions: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: workload
        image: alpine:3.19.1
        command: ['sh', '-c', 'sleep 3600']
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            nvidia.com/gpu: 1
            example.com/foo: 1
          limits:
            nvidia.com/gpu: 1
            example.com/foo: 1
---
# Short-lived job that actually runs to completion, so finished/ready wait-time metrics are emitted.
apiVersion: batch/v1
kind: Job
metadata:
  name: finished-workload
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: user-queue
spec:
  suspend: true
  parallelism: 1
  completions: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: workload
        image: alpine:3.19.1
        command: ['sh', '-c', 'true']
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
