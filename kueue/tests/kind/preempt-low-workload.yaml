apiVersion: batch/v1
kind: Job
metadata:
  name: preempt-low-workload
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: preempt-queue
    kueue.x-k8s.io/priority-class: low-priority
spec:
  suspend: true
  parallelism: 1
  completions: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: workload
        image: alpine:3.19.1
        command: ['sh', '-c', 'while true; do sleep 3600; done']
        resources:
          requests:
            cpu: 200m
            memory: 64Mi
