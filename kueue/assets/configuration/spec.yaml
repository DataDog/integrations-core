name: Kueue
fleet_configurable: true
files:
- name: kueue.yaml
  options:
  - template: init_config
    options:
    - template: init_config/openmetrics
  - template: instances
    options:
    - template: instances/openmetrics
      overrides:
        openmetrics_endpoint.value.example: http://localhost:8080/metrics
        histogram_buckets_as_distributions.value.example: true
        openmetrics_endpoint.description: |
          Endpoint exposing Kueue's Prometheus metrics.
    - name: cluster_check
      description: |
        Set to true when configuring this integration as a Cluster Agent cluster check.
      value:
        type: boolean
        example: true
    - name: collect_follower_metrics
      description: |
        Collect samples labeled `replica_role:follower`.

        When Kueue runs with more than one replica, every replica exports the same state gauges, while counters,
        histograms and LocalQueue resource metrics come from the leader only. By default, the check drops follower
        samples so state gauges are not reported twice. Samples without a `replica_role` label, such as Go runtime
        and process metrics, are always collected.
      value:
        type: boolean
        example: false
        default: false
    - name: collect_workload_events
      description: |
        Collect Kueue Workload lifecycle events by polling Workload custom resources from the Kubernetes API.

        This requires `get` and `list` RBAC permissions on `workloads.kueue.x-k8s.io`.

        Events are only submitted when the scraped Kueue replica reports `replica_role` as `leader` or `standalone`,
        or does not report it at all. This avoids duplicate events when one instance is configured per Kueue replica.
      value:
        type: boolean
        example: true
        default: true
    - name: collect_scheduling_goodput
      description: |
        Experimental. Submit the scheduling goodput metrics, in GPU-hours since the previous run, as one series per
        Workload tagged with `kueue_workload` and its queue, so that they can be summed by queue, cluster or reason:

        - `gpu.scheduling.badput_time`: GPU time that GPU Workloads spent waiting to become fully runnable, tagged with
          the normalized `reason` and, when Kueue reports one, the raw `scheduler_reason`.
        - `gpu.scheduling.fully_admitted_time`: GPU time that GPU Workloads spent admitted with all their pods ready.

        Goodput is `fully_admitted_time / (fully_admitted_time + badput_time)`. The metrics have no `kueue.` prefix so
        that every scheduler integration submits the same metrics. The ClusterQueue of a Workload that is not admitted
        yet comes from the Agent tagger, which needs Kueue metadata in the Cluster Agent.

        Each GPU Workload active in an hour adds at least two custom metric series, plus one per extra badput reason.

        A Workload is fully admitted once Kueue reports it `Admitted` with `PodsReady`, which Kueue only maintains when
        `waitForPodsReady` is enabled. Without it, no goodput metric is submitted.

        This option polls Workloads the same way `collect_workload_events` does. It needs `get` and `list` on
        `workloads.kueue.x-k8s.io` even when `collect_workload_events` is disabled, and it only counts Workloads in
        `workload_events_namespaces` when that option is set. A GPU Workload requests `nvidia.com/gpu` or
        `amd.com/gpu`. Only the instance that scraped the Kueue leader submits the metrics, so that one instance per
        replica does not count the same interval several times, except possibly once while the leader changes.
      value:
        type: boolean
        example: false
        default: false
    - name: kube_config_dict
      description: |
        Optional kubeconfig dictionary used to configure the Kubernetes API client.

        If unset, the check uses in-cluster Kubernetes configuration.
      value:
        type: object
        example:
          apiVersion: v1
          kind: Config
          clusters: []
          contexts: []
          users: []
    - name: workload_events_namespaces
      description: |
        Optional list of namespaces to collect Workload events from. If unset, Workloads are collected from all
        namespaces. It also limits which Workloads `collect_scheduling_goodput` counts.
      value:
        type: array
        items:
          type: string
        example:
        - default
    - name: resource_name_map
      description: |
        Mapping of Kueue resource label values to metric name suffixes for resource metrics.

        By default, `cpu` is reported as `cpu`, `memory` is reported as `memory`, `nvidia.com/gpu` is reported as
        `gpu`, and unmapped resources are reported as `other`. Built-in resource names cannot be overridden.
      value:
        type: object
        example:
          example.com/fpga: fpga
  - template: logs
    example:
    - type: docker
      source: kueue
      service: <SERVICE>
