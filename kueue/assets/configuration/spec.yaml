name: Kueue
fleet_configurable: true
files:
- name: kueue.yaml
  options:
  - template: init_config
    options:
    - template: init_config/openmetrics
  - template: instances
    options:
    - template: instances/openmetrics
      overrides:
        openmetrics_endpoint.value.example: http://localhost:8080/metrics
        histogram_buckets_as_distributions.value.example: true
        openmetrics_endpoint.description: |
          Endpoint exposing Kueue's Prometheus metrics.
    - name: cluster_check
      description: |
        Set to true when configuring this integration as a Cluster Agent cluster check.
      value:
        type: boolean
        example: true
    - name: collect_follower_metrics
      description: |
        Collect samples labeled `replica_role:follower`.

        When Kueue runs with more than one replica, every replica exports the same state gauges, while counters,
        histograms and LocalQueue resource metrics come from the leader only. By default, the check drops follower
        samples so state gauges are not reported twice. Samples without a `replica_role` label, such as Go runtime
        and process metrics, are always collected.
      value:
        type: boolean
        example: false
        default: false
    - name: collect_workload_events
      description: |
        Collect Kueue Workload lifecycle events by polling Workload custom resources from the Kubernetes API.

        This requires `get` and `list` RBAC permissions on `workloads.kueue.x-k8s.io`.

        Events are only submitted when the scraped Kueue replica reports `replica_role` as `leader` or `standalone`,
        or does not report it at all. This avoids duplicate events when one instance is configured per Kueue replica.
      value:
        type: boolean
        example: true
        default: true
    - name: collect_scheduling_goodput
      description: |
        Experimental. Submit the scheduling goodput metrics, in GPU-hours since the previous run, as one series per
        Workload tagged with `kueue_workload`, `job_scheduler_workload` and its queue, so that they can be summed by
        queue, cluster or reason:

        - `gpu.scheduling.badput_time`: GPU time that GPU Workloads spent waiting to become fully runnable, tagged with
          one of six general `reason` categories (`quota_or_capacity`, `placement_or_topology`,
          `configuration_or_request`, `preemption_or_reclaim`, `startup_or_system`, `other_or_unknown`) and, when Kueue
          reports one, the raw `scheduler_reason`. It doesn't stop when Kueue admits a Workload, but when its pods are
          ready. After a preemption it is tagged `reason:preemption_or_reclaim` until Kueue admits the Workload again.
        - `gpu.scheduling.fully_admitted_time`: GPU time that GPU Workloads spent admitted with all their pods ready.

        Goodput is `fully_admitted_time / (fully_admitted_time + badput_time)`. The metrics have no `kueue.` prefix so
        that every scheduler integration submits the same metrics. The ClusterQueue of a Workload that is not admitted
        yet comes from the Agent tagger, which needs Kueue metadata in the Cluster Agent. Both metrics are also tagged
        with `gpu_type`, when known: from the Agent tagger once Kueue assigned a ResourceFlavor, or else from the
        `nvidia.com/gpu.product` node label that the pods require in their `nodeSelector` or `nodeAffinity`.

        Each GPU Workload active in an hour adds at least two custom metric series, plus one per extra badput reason.

        A Workload is fully admitted once Kueue reports it `Admitted` with `PodsReady`, which Kueue only maintains when
        `waitForPodsReady` is enabled. Without it, no goodput metric is submitted.

        This option polls Workloads the same way `collect_workload_events` does, and it works when that option is
        `false`, such as when the Cluster Agent `job_scheduler_events` check sends the Workload events. It needs `get`
        and `list` on `workloads.kueue.x-k8s.io` even when `collect_workload_events` is disabled, and it only counts
        Workloads in `workload_events_namespaces` when that option is set. A GPU Workload requests `nvidia.com/gpu` or
        `amd.com/gpu`. Only the instance that scraped the Kueue leader submits the metrics, so that one instance per
        replica does not count the same interval several times, except possibly once while the leader changes.
      value:
        type: boolean
        example: false
        default: false
    - name: kube_config_dict
      fleet_configurable: true
      description: |
        Optional kubeconfig dictionary used to configure the Kubernetes API client.

        If unset, the check uses in-cluster Kubernetes configuration.

        The check uses the context named by `current-context`, and reads only the fields listed in this option.
        Fields that are not listed, such as `preferences` or `proxy-url`, are ignored. The cluster `extensions`
        are only used by `exec` plugins with `provideClusterInfo: true`, which receive the
        `client.authentication.k8s.io/exec` extension.

        Supported authentication methods, in the order the Kubernetes client tries them:
          - `auth-provider`: the `gcp`, `azure`, or `oidc` provider.
          - `token` or `tokenFile`: a bearer token.
          - `exec`: a credential plugin command, which runs on the Agent host.
          - `username` and `password`: basic authentication.
        Client certificate authentication (`client-certificate` and `client-key`, or their `-data` variants) can be
        combined with any of them. File paths are read on the Agent host.

        When configured through Fleet Automation, `token`, `password`, `client-key-data`, and the `access-token`,
        `refresh-token`, `id-token`, and `client-secret` fields of `auth-provider.config` are secrets and must be
        set as secret references.
      value:
        type: object
        properties:
        - name: apiVersion
          type: string
        - name: kind
          type: string
        - name: current-context
          type: string
        - name: clusters
          type: array
          items:
            type: object
            properties:
            - name: name
              type: string
            - name: cluster
              type: object
              properties:
              - name: server
                type: string
              - name: certificate-authority
                type: string
              - name: certificate-authority-data
                type: string
              - name: insecure-skip-tls-verify
                type: boolean
              - name: tls-server-name
                type: string
              - name: extensions
                type: array
                items:
                  type: object
                  properties:
                  - name: name
                    type: string
                  - name: extension
                    type: object
                    additionalProperties: true
        - name: contexts
          type: array
          items:
            type: object
            properties:
            - name: name
              type: string
            - name: context
              type: object
              properties:
              - name: cluster
                type: string
              - name: user
                type: string
              - name: namespace
                type: string
        - name: users
          type: array
          items:
            type: object
            properties:
            - name: name
              type: string
            - name: user
              type: object
              properties:
              - name: token
                type: string
                secret: true
              - name: tokenFile
                type: string
              - name: client-certificate
                type: string
              - name: client-certificate-data
                type: string
              - name: client-key
                type: string
              - name: client-key-data
                type: string
                secret: true
              - name: username
                type: string
              - name: password
                type: string
                secret: true
              - name: auth-provider
                type: object
                properties:
                - name: name
                  type: string
                - name: config
                  type: object
                  properties:
                  - name: access-token
                    type: string
                    secret: true
                  - name: refresh-token
                    type: string
                    secret: true
                  - name: id-token
                    type: string
                    secret: true
                  - name: client-secret
                    type: string
                    secret: true
                  - name: client-id
                    type: string
                  - name: expiry
                    type: string
                  - name: expires-on
                    type: string
                  - name: cmd-path
                    type: string
                  - name: cmd-args
                    type: string
                  - name: scopes
                    type: string
                  - name: token-key
                    type: string
                  - name: expiry-key
                    type: string
                  - name: tenant-id
                    type: string
                  - name: apiserver-id
                    type: string
                  - name: idp-issuer-url
                    type: string
                  - name: idp-certificate-authority
                    type: string
                  - name: idp-certificate-authority-data
                    type: string
              - name: exec
                type: object
                properties:
                - name: apiVersion
                  type: string
                - name: command
                  type: string
                - name: args
                  type: array
                  items:
                    type: string
                - name: env
                  type: array
                  items:
                    type: object
                    properties:
                    - name: name
                      type: string
                    - name: value
                      type: string
                - name: provideClusterInfo
                  type: boolean
        example:
          apiVersion: v1
          kind: Config
          current-context: <CONTEXT_NAME>
          clusters:
          - name: <CLUSTER_NAME>
            cluster:
              server: https://<KUBERNETES_API_SERVER>
              certificate-authority-data: <BASE64_ENCODED_CA_CERTIFICATE>
          contexts:
          - name: <CONTEXT_NAME>
            context:
              cluster: <CLUSTER_NAME>
              user: <USER_NAME>
          users:
          - name: <USER_NAME>
            user:
              token: <TOKEN>
    - name: workload_events_namespaces
      description: |
        Optional list of namespaces to collect Workload events from. If unset, Workloads are collected from all
        namespaces. It also limits which Workloads `collect_scheduling_goodput` counts.
      value:
        type: array
        items:
          type: string
        example:
        - default
    - name: resource_name_map
      description: |
        Mapping of Kueue resource label values to metric name suffixes for resource metrics.

        By default, `cpu` is reported as `cpu`, `memory` is reported as `memory`, `nvidia.com/gpu` is reported as
        `gpu`, and unmapped resources are reported as `other`. Built-in resource names cannot be overridden.
      value:
        type: object
        example:
          example.com/fpga: fpga
  - template: logs
    example:
    - type: docker
      source: kueue
      service: <SERVICE>
