          rule_panos_csv_threat (%{_syslog_header} )?%{regex("[0-9]*,[^,]*,[^,]*,THREAT,.*")::csv("future_use_1,receive_time,serial,type,subtype,future_use_6,time_generated,src,dst,natsrc,natdst,rule,suser,duser,app,vsys,from,to,inboundif,outboundif,logset,future_use_22,sessionid,repeatcnt,sport,dport,natsport,natdport,flags,proto,act,misc,threatid,cat,severity,dir,seqno,actflags,sloc,dloc,future_use_41,contenttype,pcapip,filedigest,cloud,urlidx,useragent,filetype,xff,ref,sender,sub,recipient,reportid,dg_hier_level_1,dg_hier_level_2,dg_hier_level_3,dg_hier_level_4,vsysname,dvc,future_use_61,suuid,duuid,http_method,tunnelid,monitortag,parent_session_id,parent_start_time,tunnel,thrcategory,contentver,future_use_72,assoc_id,ppid,httpheaders,urlcategory,ruleuuid,http2conn,dynusrgrp,xffip,scat,sprofile,smodel,sven,sosfam,sosver,shost,smac,dcat,dprofile,dmodel,dven,dosfam,dosver,dhost,dmac,contid,podnamespace,podname,src_edl,dst_edl,hostid,srnum,domain_edl,src_dag,dst_dag,partial_hash,high_res_timestamp,reason,justification,nssai_sst,subcatApp,appcat,apptech,apprisk,appchar,appcont,tunneledapp,appsaas,appstate,cloudreportid,flowtype,cluster")}
          rule_panos_csv_system (%{_syslog_header} )?%{regex("[0-9]*,[^,]*,[^,]*,SYSTEM,.*")::csv("future_use_1,receive_time,serial,type,subtype,future_use_6,time_generated,vsys,eventid,object,future_use_11,future_use_12,module,severity,opaque,seqno,actionflags,dg_hier_level_1,dg_hier_level_2,dg_hier_level_3,dg_hier_level_4,vsys_name,device_name,future_use_24,future_use_25,high_res_timestamp")}
          rule_pan_firewall_keyvalue (%{_syslog_header} )?%{regex("[A-Za-z0-9_.]+=[^|,]*, [A-Za-z0-9_.]+=.*")::keyvalue("=", " \"/:(){};+@")}
          rule_panorama (<%{integer}>)?((%{date("MMM  d HH:mm:ss")}|%{date("MMM dd HH:mm:ss")}) (%{notSpace})?) %{data::keyvalue("="," \"/:,(){};+\\\\", "", "|")}
    # The csv filter needs a unique name for every column, including the unnamed FUTURE_USE ones. Remapping
    # them onto `type`, which every parsed log has, drops them without changing `type`.
    - type: attribute-remapper
      name: Remove the FUTURE_USE columns of default PAN-OS CSV logs
      enabled: true
      sources:
        - future_use_1
        - future_use_6
        - future_use_11
        - future_use_12
        - future_use_22
        - future_use_24
        - future_use_25
        - future_use_39
        - future_use_41
        - future_use_44
        - future_use_61
        - future_use_72
      sourceType: attribute
      target: type
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: grok-parser
      name: Parsing exact sequence numbers from default PAN-OS CSV logs
      enabled: true
      source: message
      samples:
        - <14>Oct  5 16:15:08 panorama-01 1,2026/10/05 16:15:08,012345678901,SYSTEM,general,0,2026/10/05 16:15:07,,general,,0,0,general,informational,"User admin logged in",7300000000000000003,0x0,0,0,0,0,,fw-01
      grok:
        # The csv filter infers numbers as doubles, which rounds 19-digit `seq`/`seqno` values. Skip the
        # fields before them (quoted fields may contain commas and `""` escaped quotes) and extract them as
        # integers.
        supportRules: |-
          _syslog_header (<%{integer}>)?(%{date("MMM  d HH:mm:ss")}|%{date("MMM dd HH:mm:ss")}) %{notSpace}
          _field (?:"(?:[^"]|"")*"|[^,]*),
          _fields_5 %{_field}%{_field}%{_field}%{_field}%{_field}
          _csv_prefix (%{_syslog_header} )?[0-9]*,[^,]*,[^,]*,
        matchRules: |-
          rule_panos_csv_traffic_seq %{_csv_prefix}TRAFFIC,%{_fields_5}%{_fields_5}%{_fields_5}%{_fields_5}%{_fields_5}%{_fields_5}%{_fields_5}%{integer:seq}(,.*)?
          rule_panos_csv_threat_seqno %{_csv_prefix}THREAT,%{_fields_5}%{_fields_5}%{_fields_5}%{_fields_5}%{_fields_5}%{_fields_5}%{_field}%{_field}%{integer:seqno}(,.*)?
          rule_panos_csv_system_seqno %{_csv_prefix}SYSTEM,%{_fields_5}%{_fields_5}%{_field}%{integer:seqno}(,.*)?
    - type: grok-parser
      name: Parsing 'time_generated' to 'timestamp' (epoch)
      enabled: true
      source: time_generated
      samples:
        - Jan 24 2024 10:30:11 GMT
      grok:
        supportRules: ""
        matchRules: |-
          date_rule %{date("MMM dd yyyy HH:mm:ss z"):timestamp}
          panos_date_rule %{date("yyyy/MM/dd HH:mm:ss"):timestamp}
    - type: pipeline
      name: Processors for timestamps of default PAN-OS CSV logs
      enabled: true
      filter:
        # The default CSV format's `time_generated` is the firewall's local time without an offset.
        # `high_res_timestamp` (PAN-OS 10.0+) carries the firewall's offset but is the management plane's
        # receive time, so only its offset is applied to `time_generated`. Other formats' `time_generated`
        # does not match the date pattern below and is left unchanged.
        query: '@high_res_timestamp:*'
      processors:
        - type: grok-parser
          name: Extract the UTC offset of 'high_res_timestamp'
          enabled: true
          source: high_res_timestamp
          samples:
            - 2026-10-05T16:15:07.123+05:30
          grok:
            supportRules: ""
            matchRules: |-
              high_res_offset_rule %{regex("[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+")}%{regex("Z|[+-][0-9]{2}:[0-9]{2}"):time_generated_with_offset}
        # The string builder reads the extracted offset and replaces it with the joined value.
        - type: string-builder-processor
          name: Join 'time_generated' and its UTC offset
          enabled: true
          template: "%{time_generated} %{time_generated_with_offset}"
          target: time_generated_with_offset
          replaceMissing: false
        - type: grok-parser
          name: Parsing 'time_generated' with its UTC offset to 'timestamp' (epoch)
          enabled: true
          source: time_generated_with_offset
          samples:
            - 2026/10/05 16:15:07 +05:30
          grok:
            supportRules: ""
            matchRules: |-
              panos_date_offset_rule %{date("yyyy/MM/dd HH:mm:ss ZZ"):timestamp}
        # Remapping onto an attribute that is already set drops the helper without changing the target.
        - type: attribute-remapper
          name: Remove the joined 'time_generated' string
          enabled: true
          sources:
            - time_generated_with_offset
          sourceType: attribute
          target: time_generated
          targetType: attribute
          preserveSource: false
          overrideOnConflict: false
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      enabled: true
      sources:
        - timestamp
    - type: service-remapper
      name: Define `type` as the official service of the log
      enabled: true
      sources:
