                - filter:
                    query: "@network.client.ip:* NOT (CIDR(@network.client.ip,10.0.0.0/8) OR CIDR(@network.client.ip,172.16.0.0/12) OR CIDR(@network.client.ip,192.168.0.0/16) OR CIDR(@network.client.ip,100.64.0.0/10) OR CIDR(@network.client.ip,fc00::/7)) AND (CIDR(@network.destination.ip,10.0.0.0/8) OR CIDR(@network.destination.ip,172.16.0.0/12) OR CIDR(@network.destination.ip,192.168.0.0/16) OR CIDR(@network.destination.ip,100.64.0.0/10) OR CIDR(@network.destination.ip,fc00::/7))"
                  name: Inbound
                  id: 1
                - filter:
                    query: "(CIDR(@network.client.ip,10.0.0.0/8) OR CIDR(@network.client.ip,172.16.0.0/12) OR CIDR(@network.client.ip,192.168.0.0/16) OR CIDR(@network.client.ip,100.64.0.0/10) OR CIDR(@network.client.ip,fc00::/7)) AND @network.destination.ip:* NOT (CIDR(@network.destination.ip,10.0.0.0/8) OR CIDR(@network.destination.ip,172.16.0.0/12) OR CIDR(@network.destination.ip,192.168.0.0/16) OR CIDR(@network.destination.ip,100.64.0.0/10) OR CIDR(@network.destination.ip,fc00::/7))"
                  name: Outbound
                  id: 2
                - filter:
                    query: "(CIDR(@network.client.ip,10.0.0.0/8) OR CIDR(@network.client.ip,172.16.0.0/12) OR CIDR(@network.client.ip,192.168.0.0/16) OR CIDR(@network.client.ip,100.64.0.0/10) OR CIDR(@network.client.ip,fc00::/7)) AND (CIDR(@network.destination.ip,10.0.0.0/8) OR CIDR(@network.destination.ip,172.16.0.0/12) OR CIDR(@network.destination.ip,192.168.0.0/16) OR CIDR(@network.destination.ip,100.64.0.0/10) OR CIDR(@network.destination.ip,fc00::/7))"
                  name: Lateral
                  id: 3
                - filter:
                    query: "*"
                  name: Unknown
                  id: 0
              targets:
                name: ocsf.connection_info.direction
                id: ocsf.connection_info.direction_id
