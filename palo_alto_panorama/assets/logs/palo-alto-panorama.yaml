    # With Agent auto multi-line aggregation, several syslog messages can be merged into one log, which turns
    # `type`, `seqno` and the other keys into arrays (SCI2-5977). A filter like `@type:THREAT` still matches such a
    # log, but the grok parser below only matches a single string value, so `ocsf.metadata.log_name` is only set for
    # logs that hold exactly one message. Every OCSF pipeline below filters on it, and merged logs are not normalized.
    - type: pipeline
      name: OCSF log name for single-message logs
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: '@type:("TRAFFIC" OR "DECRYPTION" OR "THREAT" OR "CORRELATION")'
      processors:
        - type: grok-parser
          name: Parse `type` to `ocsf.metadata.log_name`
          enabled: true
          source: type
          samples:
            - TRAFFIC
            - CORRELATION
          grok:
            supportRules: ""
            matchRules: |-
              single_log_type %{regex("[A-Z-]+"):ocsf.metadata.log_name}
    - type: pipeline
      name: OCSF pre transformations
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@ocsf.metadata.log_name:*"
      processors:
        - type: string-builder-processor
          name: Add product name
          enabled: true
          template: Panorama
          target: ocsf.metadata.product.name
          replaceMissing: false
        - type: string-builder-processor
          name: Add product vendor
          enabled: true
          template: Palo Alto Networks
          target: ocsf.metadata.product.vendor_name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `timestamp` to `ocsf.time`
          enabled: true
          sources:
            - timestamp
          sourceType: attribute
          target: ocsf.time
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: attribute-remapper
          name: Map `seq`, `seqno` to `ocsf.metadata.uid`
          enabled: true
          sources:
            - seq
            - seqno
          sourceType: attribute
          target: ocsf.metadata.uid
          targetType: attribute
          targetFormat: string
          preserveSource: true
          overrideOnConflict: true
        # The key-value and CSV parsers infer numbers, so `serial` can lose leading zeros or be rendered as a
        # double. Read the device serial as text from the raw message instead.
        - type: grok-parser
          name: Parse `message` to `ocsf.device.uid`
          enabled: true
          source: message
          samples:
            - "<14>Nov 16 08:07:01 pan-01.example.com serial=001000000001|type=TRAFFIC|subtype=start"
            - "<13>Nov 16 10:07:01 panorama-01.example.com 1,2026/11/16 10:07:01,001000000002,THREAT,file,2817"
          grok:
            supportRules: |-
              _syslog_header (<%{integer}>)?(%{date("MMM  d HH:mm:ss")}|%{date("MMM dd HH:mm:ss")}) %{notSpace}
            matchRules: |-
              kv_serial (.*?[ |])?serial=%{regex("[^|, ]+"):ocsf.device.uid}.*
              csv_serial (%{_syslog_header} )?[0-9]*,[^,]*,%{regex("[^,]+"):ocsf.device.uid},(TRAFFIC|THREAT|DECRYPTION|CORRELATION),.*
    - type: pipeline
      name: OCSF evidence URL for THREAT url logs
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@ocsf.metadata.log_name:THREAT @subtype:url"
      processors:
        - type: attribute-remapper
          name: Map `misc` to `ocsf.evidence.url.url_string`
          enabled: true
          sources:
            - misc
          sourceType: attribute
          target: ocsf.evidence.url.url_string
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
    - type: pipeline
      name: OCSF evidence file for THREAT file logs
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@ocsf.metadata.log_name:THREAT @subtype:(file OR virus OR wildfire OR wildfire-virus)"
      processors:
        - type: attribute-remapper
          name: Map `misc` to `ocsf.evidence.file.name`
          enabled: true
          sources:
            - misc
          sourceType: attribute
          target: ocsf.evidence.file.name
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: string-builder-processor
          name: Add evidence file type_id
          enabled: true
          template: "1"
          target: ocsf.evidence.file.type_id
          replaceMissing: false
        - type: attribute-remapper
          name: Map `ocsf.evidence.file.type_id` to `ocsf.evidence.file.type_id`
          enabled: true
          sources:
            - ocsf.evidence.file.type_id
          sourceType: attribute
          target: ocsf.evidence.file.type_id
          targetType: attribute
          targetFormat: integer
          preserveSource: true
          overrideOnConflict: true
        - type: string-builder-processor
          name: Add evidence file type
          enabled: true
          template: Regular File
          target: ocsf.evidence.file.type
          replaceMissing: false
    - type: pipeline
      name: OCSF sub pipeline for class Detection Finding [2004]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@ocsf.metadata.log_name:(THREAT OR CORRELATION)"
      processors:
        - type: string-builder-processor
          name: Add is_alert
          enabled: true
          template: "true"
          target: ocsf.is_alert
          replaceMissing: false
        - type: grok-parser
          name: Parse `ocsf.is_alert` to `ocsf.is_alert`
          enabled: true
          source: ocsf.is_alert
          samples:
            - "true"
          grok:
            supportRules: ""
            matchRules: to_bool %{boolean("true","false"):ocsf.is_alert}
        # `threatid` is the threat name followed by its numeric ID in parentheses, e.g. `SCAN: Host Sweep(8002)`.
        # URL filtering logs carry only the ID, e.g. `(9999)`.
        - type: grok-parser
          name: Parse `threatid` to `ocsf.finding_info.analytic`
          enabled: true
          source: threatid
          samples:
            - "SCAN: Host Sweep(8002)"
            - "(9999)"
          grok:
            supportRules: ""
            matchRules: |-
              threat_id_only \(%{regex("[0-9]+"):ocsf.finding_info.analytic.uid}\)
              threat_name_and_id %{regex(".+?"):ocsf.finding_info.analytic.name}\(%{regex("[0-9]+"):ocsf.finding_info.analytic.uid}\)
        # CORRELATION logs have no sequence number, so their finding ID is built from the device serial, the
        # correlation object ID, the affected host and the event time.
        - type: string-builder-processor
          name: Add finding_info uid for CORRELATION logs
          enabled: true
          template: "%{ocsf.device.uid}-%{object_id}-%{network.client.ip}-%{timestamp}"
          target: ocsf.finding_info.uid
          replaceMissing: true
