    - type: pipeline
      name: OCSF sub pipeline for class Network Activity [4001]
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@ocsf.metadata.log_name:(TRAFFIC OR DECRYPTION)"
      processors:
        # Read the session ID as text, so CSV logs do not render it as a double.
        - type: grok-parser
          name: Parse `message` to `ocsf.connection_info.session.uid`
          enabled: true
          source: message
          samples:
            - "<14>Nov 16 08:07:01 pan-01.example.com serial=001000000001|type=TRAFFIC|subtype=start|sessionid=36137871|repeatcnt=1"
            - "<14>Oct  5 16:15:08 panorama-01 1,2026/10/05 16:15:08,012345678901,TRAFFIC,end,2049,2026/10/05 16:15:07,10.0.0.10,185.64.148.0,203.0.113.5,185.64.148.0,allow-web,,,ssl,vsys1,trust,untrust,ethernet1/1,ethernet1/2,log-forwarding,2026/10/05 16:15:07,123456,1"
          grok:
            supportRules: |-
              _syslog_header (<%{integer}>)?(%{date("MMM  d HH:mm:ss")}|%{date("MMM dd HH:mm:ss")}) %{notSpace}
            matchRules: |-
              kv_session (.*?[ |,])?sessionid=%{regex("[0-9]+"):ocsf.connection_info.session.uid}.*
              csv_session (%{_syslog_header} )?[0-9]*,[^,]*,[^,]*,TRAFFIC,(?:(?:"(?:[^"]|"")*"|[^,]*),){18}%{regex("[0-9]+"):ocsf.connection_info.session.uid},.*
        # A NAT address means the firewall translated the address, unless it is empty, `0.0.0.0` or equal to the
        # original address. Each original and NAT pair is joined into the endpoint `ip` field, so a grok rule can
        # compare the two. The grok rule then rewrites `ip`, and the schema mappers below set its final value.
        # The destination string also carries the NAT port and the GeoIP location of the original destination,
        # so that both follow the address the grok rule selects.
        - type: string-builder-processor
          name: Join `network.client.ip` and `natsrc` into `ocsf.src_endpoint.ip`
          enabled: true
          template: "%{network.client.ip}|%{natsrc}"
          target: ocsf.src_endpoint.ip
          replaceMissing: true
        - type: string-builder-processor
          name: Join `network.destination.ip`, `natdst`, `natdport` and `network.destination.geoip` into `ocsf.dst_endpoint.ip`
          enabled: true
          template: "%{network.destination.ip}|%{natdst}|%{natdport}|%{network.destination.geoip.country.iso_code}|%{network.destination.geoip.subdivision.iso_code}|%{network.destination.geoip.city.name}|%{network.destination.geoip.continent.name}|%{network.destination.geoip.location.latitude}|%{network.destination.geoip.location.longitude}"
          target: ocsf.dst_endpoint.ip
          replaceMissing: true
        # Source NAT: `src` stays the source IP, and `natsrc` is the translated address the traffic left through.
        - type: grok-parser
          name: Parse `ocsf.src_endpoint.ip` to `ocsf.src_endpoint.ip`, `ocsf.src_endpoint.nat_ip`
          enabled: true
          source: ocsf.src_endpoint.ip
          samples:
            - "10.0.0.10|203.0.113.5"
            - "10.0.0.15|0.0.0.0"
            - "10.0.0.15|10.0.0.15"
            - "10.0.0.15|"
          grok:
            supportRules: ""
            matchRules: |-
              not_translated %{regex("[^|]*"):ocsf.src_endpoint.ip}\|(?:\1|0\.0\.0\.0)?
              translated %{regex("[^|]*"):ocsf.src_endpoint.ip}\|%{regex("[^|]+"):ocsf.src_endpoint.nat_ip}
        # Destination NAT: `natdst` is the host the traffic reached, and `dst` is the address the client targeted.
        # A translated destination takes `natdport` when it is set, and drops the location of `dst`.
        - type: grok-parser
          name: Parse `ocsf.dst_endpoint.ip` to `ocsf.dst_endpoint.ip`, `port`, `nat_ip`, `location`
          enabled: true
          source: ocsf.dst_endpoint.ip
          samples:
            - "185.64.148.0|10.0.1.20|8389|FR|FR-IDF|Paris|Europe|48.90654|2.33339"
            - "185.64.148.0|185.64.148.0|443|FR|FR-IDF|Paris|Europe|48.90654|2.33339"
            - "10.0.1.20|0.0.0.0|0||||||"
            - "10.0.1.20|||||||"
            - "|10.0.1.20|0||||||"
          grok:
            supportRules: |-
              _location (?:%{regex("[^|]+"):ocsf.dst_endpoint.location.country})?\|(?:%{regex("[^|]+"):ocsf.dst_endpoint.location.region})?\|(?:%{regex("[^|]+"):ocsf.dst_endpoint.location.city})?\|(?:%{regex("[^|]+"):ocsf.dst_endpoint.location.continent})?\|(?:%{number:ocsf.dst_endpoint.location.lat})?\|(?:%{number:ocsf.dst_endpoint.location.long})?
            matchRules: |-
              not_translated %{regex("[^|]*"):ocsf.dst_endpoint.ip}\|(?:\1|0\.0\.0\.0)?\|[^|]*\|%{_location}
              translated %{regex("[^|]+"):ocsf.dst_endpoint.nat_ip}\|%{regex("[^|]+"):ocsf.dst_endpoint.ip}\|(?:(?=[1-9])%{integer:ocsf.dst_endpoint.port})?.*
              no_original \|%{regex("[^|]+"):ocsf.dst_endpoint.ip}\|.*
        - type: array-processor
          name: Move `ocsf.src_endpoint.nat_ip` into `ocsf.src_endpoint.intermediate_ips`
          enabled: true
          operation:
            source: ocsf.src_endpoint.nat_ip
            target: ocsf.src_endpoint.intermediate_ips
            preserveSource: false
            type: append
        - type: array-processor
          name: Move `ocsf.dst_endpoint.nat_ip` into `ocsf.dst_endpoint.intermediate_ips`
