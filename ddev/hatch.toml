[env.collectors.datadog-checks]
check-types = true
mypy-files = [
  "src/ddev",
]
# Keep in sync with the anthropic pin in pyproject.toml so mypy checks the SDK calls.
mypy-deps = [
  "anthropic==2.1.0",
]

[envs.default]
python = "3.13"
e2e-env = false
dependencies = [
  "pyyaml",
  # vcrpy 8.2.0 dropped the dependency on aiohttp.streams.AsyncStreamReaderMixin,
  # removed in aiohttp 3.14
  "vcrpy>=8.2.0",
]
# TODO: remove this when the old CLI is gone
pre-install-commands = [
  "uv pip install {verbosity:flag:-1} -e ../datadog_checks_dev[cli]",
]
