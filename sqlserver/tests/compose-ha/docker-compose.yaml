services:
    sqlserver:
        build:
            # The tests directory, so the image can include the shared column statistics procedure.
            context: ..
            dockerfile: compose-ha/sql/Dockerfile
            args:
                - SQLSERVER_IMAGE_TAG=${SQLSERVER_IMAGE_TAG}
        platform: linux/amd64
        environment:
            SA_PASSWORD: "Password123"
            ACCEPT_EULA: "Y"
            INIT_SCRIPT: "aoag_primary.sql"
            INIT_WAIT: 30
        ports:
            - "1433:1433"
        container_name: aoag_primary
        hostname: aoag_primary
        volumes:
            - mssql-server-shared:/var/opt/mssql/shared
            - mssql-server-backup:/var/opt/mssql/backup
        networks:
            - sqlaoag
    sqlserver_2:
        build:
            # The tests directory, so the image can include the shared column statistics procedure.
            context: ..
            dockerfile: compose-ha/sql/Dockerfile
            args:
                - SQLSERVER_IMAGE_TAG=${SQLSERVER_IMAGE_TAG}
        platform: linux/amd64
        environment:
            SA_PASSWORD: "Password123"
            ACCEPT_EULA: "Y"
            INIT_SCRIPT: "aoag_secondary.sql"
            INIT_WAIT: 50
        ports:
            - "1434:1433"
        container_name: aoag_secondary
        hostname: aoag_secondary
        volumes:
            - mssql-server-shared:/var/opt/mssql/shared
            - mssql-server-backup:/var/opt/mssql/backup
        networks:
            - sqlaoag
volumes:
    mssql-server-shared:
    mssql-server-backup:
networks:
    sqlaoag:
