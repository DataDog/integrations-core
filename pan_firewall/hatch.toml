[env.collectors.datadog-checks]
check-types = true
mypy-args = [
    "--explicit-package-bases",
]

[[envs.default.matrix]]
python = ["3.13"]

[[envs.default.matrix]]
python = ["3.13"]
setup = ["lab", "lab-panorama"]

[envs.default]
e2e-env = false

[envs.default.overrides]
name."^py3.13$".e2e-env = { value = true }
# The lab envs are E2E envs only where all their lab variables are set, so CI never runs them.
matrix.setup.e2e-env = { value = true, if = ["lab"], env = ["PANOS_LAB_HOSTS", "PANOS_LAB_USERNAME", "PANOS_PASSWORD"] }
name."^py3.13-lab-panorama$".e2e-env = { value = true, env = [
  "PANOS_LAB_PANORAMA_HOST",
  "PANOS_LAB_PANORAMA_USERNAME",
  "PANOS_LAB_PANORAMA_PASSWORD",
  "PANOS_LAB_USERNAME",
  "PANOS_PASSWORD",
] }
matrix.setup.env-vars = [
  { key = "USE_PANOS_LAB", value = "1", if = ["lab", "lab-panorama"] },
  { key = "PANOS_LAB_MODE", value = "static", if = ["lab"] },
  { key = "PANOS_LAB_MODE", value = "panorama", if = ["lab-panorama"] },
]
