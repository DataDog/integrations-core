pipeline:
  type: pipeline
  name: Palo Alto Networks Firewall
  enabled: true
  filter:
    query: source:pan.firewall
  processors:
    - type: grok-parser
      name: Parsing Palo Alto Network Firewall logs
      enabled: true
      source: message
      samples:
        - "<14>Nov 18 10:20:05 fw-a timestamp=2026/11/18 10:20:05, serial=007900000000001, type=THREAT, subtype=spyware, time_generated=2026/11/18 10:20:05, network.client.ip=10.60.2.100, network.destination.ip=8.8.8.8, rule=trust-out, usr.id=, dstuser=,\tapp=dns-base,\tinbound_if=ethernet1/2,\toutbound_if=ethernet1/1,\t evt.name=drop,\tmisc=test-malware.testpanw.com,\tthreatid=generic:test-malware.testpanw.com,\tcategory=any,\tseverity=medium,\turl_idx=0,\thttp.useragent=,\tfiletype=,\txff=\treferer=,\ttunnel=N/A,\tthr_category=dns-malware"
        - "<14>Nov 18 10:15:48 fw-b timestamp=2026/11/18 10:15:48, serial=007900000000002, type=SYSTEM, subtype=general,\tvsys=,\tevt.name=general,\tobject=,\tmodule=general,\tseverity=informational,\topaque=WildFire job enqueued. Enqueue time=2026/11/18 10:15:48. JobId=13752.  . Type: Full,\tseqno=7701028248951498075, actionflags=0x0, vsys_name=, device_name=fw-b"
        - "<14>Oct 26 16:59:23 fw-b timestamp=2026/10/26 16:59:23,\tserial=007900000000002,\ttype=CONFIG,\tsubtype=0,\t network.client.ip=198.51.100.50,\tvsys=,\tevt.name=set,\tusr.id=admin,\tclient=CLI,\tevt.outcome=Succeeded,\tpath= network interface ethernet  ethernet1/1 layer3 ip, before_change_detail=,\tafter_change_detail=,\tseqno=7701021535917572103,\tactionflags=0x0, vsys_name=, device_name=fw-b"
        - "<14>Nov 18 10:19:48 fw-a timestamp=2026/11/18 10:19:48, serial=007900000000001, type=TRAFFIC, subtype=end, time_generated=2026/11/18 10:19:48, network.client.ip=10.60.3.100, network.destination.ip=10.60.2.100, rule=vpn-to-trust, usr.id=, dstuser=,\tapp=incomplete,\tinbound_if=tunnel.1,\toutbound_if=ethernet1/2,\tnetwork.client.port=54096,\tnetwork.destination.port=8080, natsport=0\tnatdport=0,\tproto=tcp,\t evt.name=allow, start=2026/11/18 10:19:34, tunnel=N/A"
      grok:
        matchRules: |
          rule_panos %{_header}%{_kv}
        supportRules: |
          _kv %{data::keyvalue("=", " \"/:\\\\()'\\[\\]#?&;+%!*~<>@|{}$^\\p{L}\\p{N}")}
          _header (?:[^=]*\s)?
    - type: grok-parser
      name: Keep `serial` as a string
      enabled: true
      source: message
      samples:
        - "<14>Sep  3 19:40:32 PA-3220 timestamp=2025/09/03 19:40:32, serial=016201026426, type=TRAFFIC, subtype=end"
      grok:
        matchRules: |
          serial %{data},[ \t]*serial=%{regex("[^,\\s\"]*"):serial}%{greedyData}
        supportRules: ''
    - type: grok-parser
      name: Copy `device_name` to a lowercase `device_hostname`
      enabled: true
      source: device_name
      samples:
        - "PA-3220"
      grok:
        # Metric tags are lowercase and log attribute search is case-sensitive. `device_hostname`
        # matches the metric tag of the same name, so dashboards can filter logs and metrics with
        # one template variable. `device_name` keeps the firewall's own spelling. Read from the
        # parsed attribute, not the message, so text inside a free-text field can't be picked up.
        matchRules: |
          device_hostname %{data:device_hostname:lowercase}
        supportRules: ''
    - type: attribute-remapper
      name: Keep `subtype` as a string
      enabled: true
      sources:
        - subtype
      sourceType: attribute
      target: subtype
      targetType: attribute
      targetFormat: string
      preserveSource: false
      overrideOnConflict: true
    - type: attribute-remapper
      name: Copy `threatid` to `pan.firewall.threatid`
      enabled: true
      sources:
        - threatid
      sourceType: attribute
      target: pan.firewall.threatid
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Copy `thr_category` to `pan.firewall.thr_category`
      enabled: true
      sources:
        - thr_category
      sourceType: attribute
      target: pan.firewall.thr_category
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Copy `app` to `pan.firewall.app`
      enabled: true
      sources:
        - app
      sourceType: attribute
      target: pan.firewall.app
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Copy `session_end_reason` to `pan.firewall.session_end_reason`
      enabled: true
      sources:
        - session_end_reason
      sourceType: attribute
      target: pan.firewall.session_end_reason
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: pipeline
      name: Extract the PAN-OS event time into `pan_event_time`
      enabled: true
      filter:
        query: "*"
      processors:
        # Event time, read from the parsed attributes (not the message, so a URL parameter such as
        # `?high_res_timestamp=...` inside a free-text field can't be picked up). The steps run from
        # lowest to highest precedence and each overwrites `pan_event_time` only if its attribute
        # parses: `timestamp` (receive_time in Threat, URL, Data Filtering and GlobalProtect formats;
        # start in GTP), then `time_generated`, then `high_res_timestamp` (ISO 8601 with offset).
        # Times without an offset are firewall-local and are parsed as UTC. Firewalls that don't
        # populate high_res_timestamp send a 1969-12-31 placeholder, which is skipped.
        # Only `high_res_timestamp` carries an offset, so only it becomes the official log date
        # (`pan_log_date`); without it the log keeps its intake time. `pan_event_time` feeds `ocsf.time`.
        - type: grok-parser
          name: Parse `timestamp` into `pan_event_time`
          enabled: true
          source: timestamp
          samples:
            - "2025/09/03 19:41:10"
          grok:
            matchRules: |
              timestamp %{date("yyyy/MM/dd HH:mm:ss"):pan_event_time}
            supportRules: ''
        - type: grok-parser
          name: Parse `time_generated` into `pan_event_time`
          enabled: true
          source: time_generated
          samples:
            - "2025/09/03 19:40:32"
          grok:
            matchRules: |
              time_generated %{date("yyyy/MM/dd HH:mm:ss"):pan_event_time}
            supportRules: ''
        - type: grok-parser
          name: Parse `high_res_timestamp` into `pan_log_date`
          enabled: true
          source: high_res_timestamp
          samples:
            - "2025-09-03T12:40:32.123-07:00"
          grok:
            matchRules: |
              high_res_timestamp (?!1969-)%{date("yyyy-MM-dd'T'HH:mm:ss.SSSZZ"):pan_log_date}
            supportRules: ''
        - type: attribute-remapper
          name: Copy `pan_log_date` to `pan_event_time`
          enabled: true
          sources:
            - pan_log_date
          sourceType: attribute
          target: pan_event_time
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
    - type: date-remapper
      name: Define `pan_log_date` as the official date of the log
      enabled: true
      sources:
        - pan_log_date
    # Follows the PAN-OS syslog severity table: high and medium both map to warning.
    - type: category-processor
      name: Map PAN-OS `severity` to `pan_status`
      enabled: true
      target: pan_status
      categories:
        - filter:
            query: "@severity:critical"
          name: critical
        - filter:
            query: "@severity:high"
          name: warning
        - filter:
            query: "@severity:medium"
          name: warning
        - filter:
            query: "@severity:low"
          name: notice
        - filter:
            query: "@severity:informational"
          name: info
    - type: status-remapper
      name: Define `pan_status` as the official status of the log
      enabled: true
      sources:
        - pan_status
    - type: geo-ip-parser
      name: Fetching GeoIp data for client ip
      enabled: true
      sources:
        - network.client.ip
      target: network.client.geoip
    - type: user-agent-parser
      name: Parsing useragent details from http.useragent
      enabled: true
      sources:
        - http.useragent
      target: http.useragent_details
      encoded: false
    - type: string-builder-processor
      name: Setting title attribute using usr.id, evt.name and country.name
      enabled: true
      target: title
      template: '%{usr.id} performed event %{evt.name} from %{network.client.geoip.country.name}'
      replaceMissing: false
    - type: pipeline
      name: OCSF pre transformations
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "*"
      processors:
        - type: attribute-remapper
          name: Map `pan_event_time` to `ocsf.time`
          enabled: true
          sources:
            - pan_event_time
          sourceType: attribute
          target: ocsf.time
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: string-builder-processor
          name: Add product name
          enabled: true
          template: Palo Alto Networks Firewall
          target: ocsf.metadata.product.name
          replaceMissing: false
        - type: string-builder-processor
          name: Add product vendor
          enabled: true
          template: Palo Alto Networks
          target: ocsf.metadata.product.vendor_name
          replaceMissing: false
        - type: attribute-remapper
          name: Map `serial` to `ocsf.metadata.product.uid`
          enabled: true
          sources:
            - serial
          sourceType: attribute
          target: ocsf.metadata.product.uid
          targetType: attribute
          targetFormat: string
          preserveSource: true
          overrideOnConflict: true
        - type: attribute-remapper
          name: Map `seqno` to `ocsf.metadata.sequence`
          enabled: true
          sources:
            - seqno
          sourceType: attribute
          target: ocsf.metadata.sequence
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
        - type: attribute-remapper
          name: Map `type` to `ocsf.metadata.event_code`
          enabled: true
          sources:
            - type
          sourceType: attribute
          target: ocsf.metadata.event_code
          targetType: attribute
          preserveSource: true
          overrideOnConflict: true
    - type: pipeline
      name: misc field URL extraction
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@type:THREAT @subtype:url"
      processors:
        - type: grok-parser
          name: Parse `misc` to `ocsf.evidence.url.url_string`
          enabled: true
          source: message
          samples:
            - "<14>Sep  3 19:41:10 PA-3220 timestamp=2025/09/03 19:41:10, type=THREAT, subtype=url, evt.name=block-url, misc=http://malware.example.com/payload.bin?id=42&ref=mail, threatid=Suspicious URL"
            - "<14>Sep  3 19:41:10 PA-3220 timestamp=2025/09/03 19:41:10, type=THREAT, subtype=url, evt.name=block-url, misc=\"http://malware.example.com/payload.bin\", threatid=\"Suspicious URL\""
            - "<14>Sep  3 19:41:10 PA-3220 timestamp=2025/09/03 19:41:10, type=THREAT, subtype=url, evt.name=block-url, misc=\"\"http://malware.example.com/payload.bin?id=42,43\"\", threatid=\"Suspicious URL\""
          grok:
            supportRules: ""
            matchRules: |-
              misc_url_quoted %{data},[ \t]*misc="(?!")%{regex("[^\"]+"):ocsf.evidence.url.url_string}"(?=[,\s]|$)%{greedyData}
              misc_url_double_quoted %{data},[ \t]*misc=""(?!"|[,\s]+[\w.]+=|$)%{regex("[^\"]+"):ocsf.evidence.url.url_string}""(?=[,\s]|$)%{greedyData}
              misc_url %{data},[ \t]*misc=%{regex("[^,\"]+"):ocsf.evidence.url.url_string}%{greedyData}
    - type: pipeline
      name: misc field filename extraction
      enabled: true
      ocsf:
        isOcsf: true
      filter:
        query: "@type:THREAT @subtype:(file OR virus OR wildfire-virus OR wildfire OR data)"
      processors:
        - type: grok-parser
          name: Parse `misc` to `ocsf.evidence.file.name`
          enabled: true
          source: message
          samples:
            - "<14>Sep  3 19:40:32 PA-3220 timestamp=2025/09/03 19:40:32, type=THREAT, subtype=virus, evt.name=block-url, misc=invoice_2025.pdf, threatid=Eicar Test File"
            - "<14>Sep  3 19:40:32 PA-3220 timestamp=2025/09/03 19:40:32, type=THREAT, subtype=data, evt.name=alert, misc=\"payroll, Q3.xlsx\", threatid=\"Credit Card Numbers\""
          grok:
            supportRules: ""
            matchRules: |-
              misc_file_quoted %{data},[ \t]*misc="(?!")%{regex("[^\"]+"):ocsf.evidence.file.name}"(?=[,\s]|$)%{greedyData}
              misc_file_double_quoted %{data},[ \t]*misc=""(?!"|[,\s]+[\w.]+=|$)%{regex("[^\"]+"):ocsf.evidence.file.name}""(?=[,\s]|$)%{greedyData}
              misc_file %{data},[ \t]*misc=%{regex("[^,\"]+"):ocsf.evidence.file.name}%{greedyData}
        - type: string-builder-processor
          name: Add type_id
          enabled: true
          template: "1"
          target: ocsf.evidence.file.type_id
          replaceMissing: false
        - type: attribute-remapper
          name: Map `ocsf.evidence.file.type_id` to `ocsf.evidence.file.type_id`
          enabled: true
          sources:
            - ocsf.evidence.file.type_id
          sourceType: attribute
          target: ocsf.evidence.file.type_id
