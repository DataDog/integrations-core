name: Palo Alto Networks Firewall
fleet_configurable: true
files:
- name: pan_firewall.yaml
  options:
  - template: init_config
    options:
    - template: init_config/default
  - template: instances
    options:
    - template: instances/default
  - template: logs
    example:
    - type: tcp
      port: 10518
      service: "firewall"
      source: "pan.firewall"
      tags:
        - "ndm_syslog:true"
