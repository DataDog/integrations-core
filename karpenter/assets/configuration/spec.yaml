name: Karpenter
fleet_configurable: true
files:
- name: karpenter.yaml
  options:
    - template: init_config
      options:
        - template: init_config/openmetrics
    - template: instances
      options:
        - template: instances/openmetrics
          overrides:
            openmetrics_endpoint.value.example: http://localhost:8080/metrics
            openmetrics_endpoint.description: |
              Endpoint exposing the Karpenter's Prometheus metrics. For more information refer to:
              https://karpenter.sh/docs/reference/metrics/
- name: auto_conf.yaml
  options:
  - template: ad_identifiers
    overrides:
      value.example:
      - controller
  - template: auto_conf/cel_selector
    overrides:
      cel_selector.example:
        containers:
        # Narrow down matching containers since the container name "controller"
        # is generic and doesn't identify it as being part of Karpenter.
        - container.image.reference.contains("karpenter/controller")
  - template: init_config
    options:
      - template: init_config/openmetrics
  - template: instances
    options:
      - template: instances/openmetrics
        overrides:
          openmetrics_endpoint.value.example: http://localhost:8080/metrics