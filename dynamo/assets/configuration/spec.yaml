name: Dynamo
files:
- name: dynamo.yaml
  options:
  - template: init_config
    options:
    - template: init_config/openmetrics
  - template: instances
    options:
    - template: instances/openmetrics
      overrides:
        openmetrics_endpoint.required: true
        openmetrics_endpoint.value.example: http://localhost:8000/metrics
        openmetrics_endpoint.description: |
          Endpoint exposing Dynamo's Prometheus metrics.

          This is typically the frontend's `/metrics` endpoint (default port 8000).
          Backend workers (`python -m dynamo.vllm`, `python -m dynamo.sglang`, etc.) expose a
          separate system status server on `DYN_SYSTEM_PORT` (commonly 8081, set to 9090 by the
          Kubernetes operator) that must be configured as its own instance if you want worker-side
          `dynamo.component.*` metrics in addition to frontend metrics.

          For more information refer to:
          https://docs.nvidia.com/dynamo/latest/observability/metrics.html
