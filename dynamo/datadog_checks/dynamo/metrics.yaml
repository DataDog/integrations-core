dynamo_frontend_non_max_overlap_selections: frontend.non_max_overlap_selections
dynamo_frontend_overlap_blocks_lost: frontend.overlap_blocks_lost
dynamo_frontend_images_per_request: frontend.images_per_request
dynamo_frontend_videos_per_request: frontend.videos_per_request
dynamo_frontend_audio_per_request: frontend.audio_per_request
dynamo_frontend_image_tokens_per_request: frontend.image_tokens_per_request
dynamo_frontend_model_total_kv_blocks: frontend.model.total_kv_blocks
dynamo_frontend_model_max_num_seqs: frontend.model.max_num_seqs
