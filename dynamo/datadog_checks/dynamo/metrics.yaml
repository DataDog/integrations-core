# Metric name mappings for the Dynamo check, loaded through METRICS_MAP in check.py
# (see docs/developer/base/openmetrics-metrics-files.md). Families in this file come from the frontend
# and the KV router, which run on CPU nodes, and are always collected. Worker families are in gpu_metrics.yaml.
#
# Metrics exposed by the Dynamo HTTP frontend (default: http://<host>:8000/metrics).
# Source: https://github.com/ai-dynamo/dynamo
#   lib/runtime/src/metrics/prometheus_names.rs (frontend_service module)
