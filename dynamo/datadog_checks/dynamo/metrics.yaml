# Metric name mappings for the Dynamo check, discovered by convention by OpenMetricsBaseCheckV2
# (see docs/developer/base/openmetrics-metrics-files.md).
#
# Metrics exposed by the Dynamo HTTP frontend (default: http://<host>:8000/metrics).
# Source: https://github.com/ai-dynamo/dynamo
#   lib/runtime/src/metrics/prometheus_names.rs (frontend_service module)
dynamo_frontend_requests: frontend.requests
dynamo_frontend_requests_started: frontend.requests_started
dynamo_frontend_queued_requests: frontend.queued_requests
dynamo_frontend_inflight_requests: frontend.inflight_requests
dynamo_frontend_active_requests: frontend.active_requests
dynamo_frontend_disconnected_clients: frontend.disconnected_clients
