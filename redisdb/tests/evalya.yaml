version: "1"

# Publish the existing authenticated standalone Compose fixture as
# redisdb/tests@redis-standalone. The Compose file defaults its config mount to the
# repository's auth.conf, so consumers only need to select a Redis version.
tasks:
  - id: redis-standalone
    task: ./compose/standalone.compose@redis-standalone
    labels:
      evalya.io/publish: "true"
      evalya.io/provides.DB_HOST: "{{ .hostname }}"
      evalya.io/provides.DB_PORT: "6379"
      evalya.io/provides.REDIS_PASSWORD: devops-best-friend
    env:
      - name: REDIS_PASSWORD
        value: devops-best-friend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
